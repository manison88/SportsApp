<!doctype html>
<html><head><meta charset="utf-8"><title>Clean</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/clean.css">
<style>
  .nav-t { text-align: center; }
  .nav-t b { display: block; font: 600 15px/1.2 var(--c-ui); letter-spacing: -.2px; }
  .nav-t span { display: block; margin-top: 2px; }

  .player { position: absolute; top: 108px; left: 12px; right: 12px; height: 540px; border-radius: 28px; background: #1a1410; }
  .player img { transform: scale(1.42); transform-origin: 62% 92%; filter: sepia(.32) saturate(1.15) contrast(1.06) brightness(.92) hue-rotate(-6deg); }
  .player .leak { position: absolute; inset: 0; mix-blend-mode: screen; background:
    radial-gradient(circle at 104% 2%, rgba(255,150,70,.5), rgba(255,140,60,.18) 30%, rgba(255,120,40,0) 58%),
    radial-gradient(40% 30% at 0% 100%, rgba(255,90,60,.25), rgba(255,90,60,0) 70%); }
  .player .shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,0) 20%, rgba(0,0,0,0) 38%, rgba(20,10,0,.55) 62%, rgba(10,5,0,.88)); }
  .player .grain { opacity: .22; z-index: 2; border-radius: 28px; }
  .segs { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 4px; z-index: 3; }
  .segs i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
  .segs i b { display: block; height: 100%; background: #fff; }
  .chap { position: absolute; top: 30px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 3; font: 600 11px/1 var(--c-ui); color: rgba(255,255,255,.85); letter-spacing: .2px; }
  .chap span:last-child { color: rgba(255,255,255,.6); }
  .card { position: absolute; left: 24px; right: 24px; bottom: 30px; z-index: 3; color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .card .ey { font: 600 11px/1.2 var(--c-ui); letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .card .c-display { margin-top: 12px; font-size: 46px; line-height: .98; letter-spacing: -1.8px; }
  .card .sub { margin-top: 12px; font: 500 14px/1.4 var(--c-ui); color: rgba(255,255,255,.8); }

  .scrub { position: absolute; top: 672px; left: var(--c-gutter); right: var(--c-gutter); display: flex; align-items: center; gap: 14px; }
  .play { width: 48px; height: 48px; border-radius: 24px; flex: none; display: grid; place-items: center; background: var(--c-surface); box-shadow: 0 1px 2px rgba(0,0,0,.06), inset 0 0 0 .5px var(--c-line); }
  .play svg { width: 18px; height: 18px; fill: var(--c-text); }
  .bar { flex: 1; }
  .bar .tr { position: relative; height: 4px; border-radius: 2px; background: var(--c-sunk); }
  .bar .tr i { position: absolute; left: 0; top: 0; bottom: 0; width: 48%; border-radius: 2px; background: var(--c-text); }
  .bar .tr b { position: absolute; left: 48%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 7px; background: var(--c-text); box-shadow: 0 0 0 3px var(--c-bg); }
  .bar .tr s { position: absolute; top: -3px; width: 2px; height: 10px; border-radius: 1px; background: var(--c-bg); }
  .bar .tm { display: flex; justify-content: space-between; margin-top: 9px; font-variant-numeric: tabular-nums; }

  .act { position: absolute; top: 744px; left: var(--c-gutter); right: var(--c-gutter); display: flex; gap: 10px; align-items: center; }
  .act .c-btn { flex: 1; }
  .act .c-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .act .c-segment { width: 124px; height: 52px; border-radius: 26px; padding: 4px; }
  .act .c-segment span { border-radius: 22px; display: grid; place-items: center; padding: 0; }
</style></head>
<body class="phone c" data-chrome="dark">
  <div class="c-nav">
    <span class="c-icon-btn"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
    <span class="nav-t"><b>World Series · Game 5</b><span class="c-small">Your recap · 2:30</span></span>
    <span class="c-icon-btn"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></span>
  </div>

  <div class="c-photo player">
    <img class="ph" src="../../../photos/wrigley-night-2.jpg" style="object-position:40% 50%">
    <div class="leak"></div>
    <div class="shade"></div>
    <div class="grain"></div>
    <div class="segs"><i><b style="width:100%"></b></i><i><b style="width:100%"></b></i><i><b style="width:35%"></b></i><i></i></div>
    <div class="chap"><span>3 · The save</span><span>with Dad</span></div>
    <div class="card">
      <div class="ey">Oct 30, 2016 · Wrigley Field</div>
      <div class="c-display">Down 3–1.<br>Not tonight.</div>
      <div class="sub">Eight outs from Chapman. Nobody sits.</div>
    </div>
  </div>

  <div class="scrub">
    <span class="play"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></span>
    <div class="bar">
      <div class="tr"><i></i><s style="left:25%"></s><s style="left:50.5%;display:none"></s><s style="left:75%"></s><b></b></div>
      <div class="tm"><span class="c-small">1:12</span><span class="c-small">2:30</span></div>
    </div>
  </div>

  <div class="act">
    <span class="c-btn"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M12 8v6M9.5 10.5L12 8l2.5 2.5"/></svg>Share as story</span>
    <div class="c-segment"><span>16:9</span><span class="on">9:16</span></div>
  </div>

<script src="../../../kit/kit.js"></script>
</body></html>
