<!doctype html>
<html><head><meta charset="utf-8"><title>Clean</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/clean.css">
<style>
  .hero { position: absolute; top: 56px; left: 12px; right: 12px; height: 262px; }
  .hero .nav { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
  .hero .vis { position: absolute; left: 14px; bottom: 14px; height: 28px; padding: 0 11px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.88); backdrop-filter: blur(10px); font: 600 12px/1 var(--c-ui); }
  .hero .vis i { width: 6px; height: 6px; border-radius: 3px; background: #1f4fd1; }

  .title { position: absolute; top: 340px; left: var(--c-gutter); right: var(--c-gutter); }
  .title .c-h1 { margin-top: 8px; }

  .rec { position: absolute; top: 420px; left: var(--c-gutter); right: var(--c-gutter); display: flex; align-items: flex-end; }
  .rec .big .c-num-xl { font-size: 76px; }
  .rec .big .c-small { margin-top: 10px; display: block; color: var(--c-text-2); }
  .rec .dates { margin-left: auto; display: grid; gap: 12px; padding-bottom: 2px; text-align: right; }
  .rec .dates b { display: block; font: 600 15px/1.2 var(--c-ui); letter-spacing: -.2px; font-variant-numeric: tabular-nums; }
  .rec .dates span { display: block; margin-bottom: 3px; }

  .seats { position: absolute; top: 540px; left: 12px; right: 12px; height: 270px; overflow: hidden; }
  .seats .lab { position: absolute; top: 16px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .seats svg { position: absolute; left: 0; top: 0; }
  .leg { position: absolute; left: 18px; bottom: 16px; display: grid; gap: 8px; z-index: 2; }
  .leg span { display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--c-ui); color: var(--c-text-2); font-variant-numeric: tabular-nums; }
  .leg span b { color: var(--c-text); font-weight: 600; width: 30px; }
  .leg i { width: 10px; height: 10px; border-radius: 3px; }
</style></head>
<body class="phone c" data-chrome="dark">
  <div class="c-photo hero">
    <img class="ph" src="../../../photos/wrigley-scoreboard-wide.jpg" style="object-position:50% 40%">
    <div class="nav">
      <span class="c-icon-btn glass"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
      <span class="c-icon-btn glass"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span>
    </div>
    <span class="vis"><i></i>17 visits · your most-visited venue</span>
  </div>

  <div class="title">
    <div class="c-eyebrow">Chicago · Opened 1914 · 41,649 seats</div>
    <div class="c-h1">Wrigley Field</div>
  </div>

  <div class="rec">
    <div class="big"><div class="c-num-xl">11–6</div><span class="c-small">Chicago’s record with you here</span></div>
    <div class="dates">
      <div><span class="c-small">First visit</span><b>Jun 14, 2014</b></div>
      <div><span class="c-small">Latest</span><b>Jul 4, 2026</b></div>
    </div>
  </div>

  <div class="c-card seats">
    <div class="lab"><span class="c-eyebrow">Where you sat</span><span class="c-small">17 games</span></div>
    <svg id="sm" width="369" height="270"></svg>
    <div class="leg">
      <span><i style="background:#1f4fd1"></i><b>314</b>Bleachers · 11</span>
      <span><i style="background:#6f93ec"></i><b>209</b>Terrace · 4</span>
      <span><i style="background:#b3c6f5"></i><b>128</b>Field box · 2</span>
    </div>
  </div>

<script>
(function () {
  const svg = document.getElementById('sm');
  const NS = 'http://www.w3.org/2000/svg';
  const H = [232, 212], R = 132, k = Math.SQRT1_2;
  const add = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); svg.appendChild(e); return e; };
  const P = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
  // field: home -> LF pole -> outfield arc -> RF pole
  const LF = [H[0] - R * k, H[1] - R * k], RF = [H[0] + R * k, H[1] - R * k];
  add('path', { d: `M${P(...H)} L${P(...LF)} A${R},${R} 0 0 1 ${P(...RF)} Z`, fill: '#eef2ea' });
  const dm = 40;
  add('path', { d: `M${P(...H)} L${P(H[0] - dm * k, H[1] - dm * k)} L${P(H[0], H[1] - 2 * dm * k)} L${P(H[0] + dm * k, H[1] - dm * k)} Z`, fill: 'none', stroke: '#d3d8cc', 'stroke-width': 1.2 });
  // grandstand ring centerline at offset d
  const stand = d => {
    const a = [H[0] - R * k - d * k, H[1] - R * k + d * k], b = [H[0] - d * k, H[1] + d * k];
    const c = [H[0] + d * k, H[1] + d * k], e = [H[0] + R * k + d * k, H[1] - R * k + d * k];
    return `M${P(...a)} L${P(...b)} A${d},${d} 0 0 0 ${P(...c)} L${P(...e)}`;
  };
  const ring = (d, w, dash, hi) => {
    const base = add('path', { d, fill: 'none', stroke: '#e9e9e4', 'stroke-width': w, 'stroke-dasharray': dash.join(' ') });
    const L = base.getTotalLength(), per = dash[0] + dash[1];
    hi.forEach(([idx, col, label]) => {
      add('path', { d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-dasharray': `${dash[0]} ${L + 50}`, 'stroke-dashoffset': -idx * per, style: `filter: drop-shadow(0 0 6px ${col})` });
      if (label) { const p = base.getPointAtLength(idx * per + dash[0] / 2); const t = add('text', { x: p.x, y: p.y + 3.5, 'text-anchor': 'middle', 'font-family': 'Inter', 'font-weight': 700, 'font-size': 9.5, fill: '#fff' }); t.textContent = label; }
    });
  };
  ring(stand(15), 16, [17, 2.5], [[6, '#b3c6f5']]);
  ring(stand(36), 15, [19, 2.5], [[12, '#6f93ec']]);
  const RB = R + 22;
  ring(`M${P(H[0] - RB * k, H[1] - RB * k)} A${RB},${RB} 0 0 1 ${P(H[0] + RB * k, H[1] - RB * k)}`, 22, [24, 3], [[2, '#1f4fd1', '314']]);
  add('path', { d: `M${H[0] - 4},${H[1] - 4} h8 v4 l-4 4 l-4 -4 Z`, fill: '#9a9aa0' });
})();
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
