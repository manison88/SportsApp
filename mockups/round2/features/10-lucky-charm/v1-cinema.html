<!doctype html>
<html><head><meta charset="utf-8"><title>Cinema</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/cinema.css">
<style>
  .a-hero { height: 520px; }
  .a-hero img { object-position: 50% 70%; transform: scale(1.25); transform-origin: 50% 80%; filter: contrast(1.05) saturate(.75) brightness(.5) blur(1.5px); }
  .a-hero::after { background: linear-gradient(180deg, rgba(5,5,6,.92) 0%, rgba(5,5,6,.5) 12%, rgba(5,5,6,.25) 26%, rgba(5,5,6,.35) 50%, rgba(5,5,6,.9) 84%, #050506 100%); }
  .title { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font: 600 15px/1.2 var(--a-ui); z-index: 21; pointer-events: none; }
  .title span { display: block; font: 500 12px/1.3 var(--a-ui); color: var(--a-text-2); margin-top: 2px; }

  .gauge { position: absolute; left: 0; top: 142px; width: 393px; height: 230px; z-index: 5; }
  .read { position: absolute; left: 0; right: 0; top: 248px; text-align: center; z-index: 6; }
  .read .n { font: 600 76px/.9 var(--a-num); letter-spacing: -3.5px; font-variant-numeric: tabular-nums; }
  .read .a-small { margin-top: 8px; color: var(--a-text-2); }
  .ends { position: absolute; left: 34px; right: 34px; top: 380px; display: flex; justify-content: space-between; z-index: 6; }

  .vs-head { position: absolute; left: 0; right: 0; top: 432px; text-align: center; z-index: 6; }
  .vs-head .a-h1 em { font-style: italic; color: var(--a-text-2); }
  .vs { position: absolute; left: var(--a-gutter); right: var(--a-gutter); top: 506px; display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; z-index: 6; }
  .side { text-align: center; }
  .side .a-num-xl { font-size: 58px; }
  .side .a-num-xl small { font-size: 26px; letter-spacing: -.5px; margin-left: 2px; }
  .side.off .a-num-xl { color: var(--a-text-3); }
  .side .lab { font: 600 13px/1.3 var(--a-ui); margin-top: 10px; }
  .side .a-small { margin-top: 3px; }
  .vs .v { font: italic 400 26px/1 var(--a-serif); color: var(--a-text-3); text-align: center; padding-bottom: 34px; }

  .maya { position: absolute; left: var(--a-gutter); right: var(--a-gutter); top: 652px; display: flex; align-items: center; gap: 12px; padding-top: 18px; border-top: 1px solid var(--a-line); }
  .maya .a-avatar { width: 34px; height: 34px; background: #ff7a8a; font-size: 17px; }
  .maya p { flex: 1; font: 400 14px/1.35 var(--a-ui); color: var(--a-text-2); }
  .maya p b { color: var(--a-text); font-weight: 600; }
  .maya .pct { font: 600 20px/1 var(--a-num); color: #ff7a8a; letter-spacing: -.4px; }

  .cta { position: absolute; left: var(--a-gutter); right: var(--a-gutter); bottom: 46px; display: flex; gap: 10px; }
  .cta .a-btn { flex: 1; }
  .cta .a-btn svg, .cta .a-btn.ghost svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cta .a-btn.ghost { flex: 0 0 52px; padding: 0; }
</style></head>
<body class="phone a">
  <div class="a-hero"><img class="ph" src="../../../photos/wrigley-night.jpg"></div>
  <div class="grain"></div>

  <div class="a-nav">
    <div class="a-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="a-icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></div>
  </div>
  <div class="title">Lucky charm<span>60 games · 2014–2026</span></div>

  <svg class="gauge" id="gauge" viewBox="0 0 393 230"></svg>
  <div class="read">
    <div class="n">+13</div>
    <div class="a-small">points above the odds</div>
  </div>
  <div class="ends"><span class="a-eyebrow">Jinx</span><span class="a-eyebrow" style="color:var(--a-text-2)">Lucky charm</span></div>

  <div class="vs-head"><div class="a-h1">You <em>vs.</em> the odds</div></div>
  <div class="vs">
    <div class="side">
      <div class="a-num-xl">61<small>%</small></div>
      <div class="lab">With you</div>
      <div class="a-small tnum">35–22–2</div>
    </div>
    <div class="v">vs</div>
    <div class="side off">
      <div class="a-num-xl">48<small>%</small></div>
      <div class="lab" style="color:var(--a-text-2)">Without you</div>
      <div class="a-small">same teams, same years</div>
    </div>
  </div>

  <div class="maya">
    <div class="a-avatar">M</div>
    <p><b>Maya is luckier still.</b> 11–6 in her 17 games, all of them with you.</p>
    <div class="pct">65%</div>
  </div>

  <div class="cta">
    <div class="a-btn"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share your luck</div>
    <div class="a-btn ghost"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></div>
  </div>

<script>
  // dial: −20 … +20 points; Sam sits at +13
  const cx = 196.5, cy = 214, R = 150, NS = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('gauge');
  const ang = v => Math.PI * (1 - (v + 20) / 40);          // −20 → π (left), +20 → 0 (right)
  const pt = (v, r) => [cx + r * Math.cos(ang(v)), cy - r * Math.sin(ang(v))];
  const arc = (a, b, r) => { const [x1,y1] = pt(a,r), [x2,y2] = pt(b,r); return `M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`; };
  let h = '';
  // ticks
  for (let v = -20; v <= 20; v += 1) {
    const major = v % 10 === 0, r1 = R + 10, r2 = R + (major ? 22 : 16);
    const [x1,y1] = pt(v, r1), [x2,y2] = pt(v, r2);
    h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(245,241,234,${major ? .7 : .3})" stroke-width="${major ? 1.6 : 1}" stroke-linecap="round"/>`;
  }
  h += `<path d="${arc(-20, 20, R)}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="6" stroke-linecap="round"/>`;
  h += `<defs><linearGradient id="amb" x1="0" x2="1"><stop offset="0" stop-color="#ffb547" stop-opacity=".25"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
  h += `<path d="${arc(0, 13, R)}" fill="none" stroke="#ffb547" stroke-width="12" stroke-linecap="round" opacity=".35" filter="url(#glow)"/>`;
  h += `<path d="${arc(0, 13, R)}" fill="none" stroke="url(#amb)" stroke-width="6" stroke-linecap="round"/>`;
  const [nx, ny] = pt(13, R);
  h += `<circle cx="${nx}" cy="${ny}" r="9" fill="#050506" stroke="#ffb547" stroke-width="3"/>`;
  // zero marker
  const [zx, zy] = pt(0, R - 14);
  h += `<text x="${zx}" y="${zy + 4}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10" letter-spacing="1.5" fill="rgba(245,241,234,.42)">EVEN</text>`;
  g.innerHTML = h;
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
