<!doctype html>
<html><head><meta charset="utf-8"><title>Clean</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/clean.css">
<style>
  .c-nav .t { font: 600 15px/1 var(--c-ui); letter-spacing: -.2px; }
  .intro { position: absolute; top: 116px; left: 20px; right: 20px; }
  .intro .c-h1 { margin-top: 10px; }

  .gauge { position: absolute; top: 186px; left: 0; width: 393px; height: 236px; }
  .readout { position: absolute; top: 298px; left: 0; right: 0; text-align: center; }
  .readout .n { font: 700 84px/.9 var(--c-display); letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  .readout .n small { font-size: 52px; letter-spacing: 0; vertical-align: 12px; margin-right: 4px; font-weight: 600; }
  .readout .c-small { margin-top: 8px; color: var(--c-text-2); font-weight: 600; }
  .ends { position: absolute; top: 430px; left: 28px; right: 28px; display: flex; justify-content: space-between; }
  .ends span { font: 600 11px/1 var(--c-ui); letter-spacing: 1.2px; text-transform: uppercase; color: var(--c-text-3); }
  .ends span.me { color: var(--c-text); }

  .vs { position: absolute; top: 498px; left: 16px; right: 16px; padding: 6px 0; }
  .vs .c-row { padding: 14px 18px; gap: 14px; }
  .vs .lbl { width: 122px; white-space: nowrap; }
  .vs .lbl b { display: block; font: 600 15px/1.2 var(--c-ui); letter-spacing: -.2px; }
  .vs .lbl span { font: 500 12.5px/1.3 var(--c-ui); color: var(--c-text-3); }
  .vs .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--c-sunk); position: relative; overflow: hidden; }
  .vs .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .vs .pct { width: 58px; text-align: right; font: 700 24px/1 var(--c-display); letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
  .vs .pct.dim { color: var(--c-text-3); }
  .vs .c-avatar { box-shadow: none; width: 26px; height: 26px; font-size: 11.5px; flex: none; }

  .cta { position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; gap: 10px; }
  .cta .c-btn { flex: 1; }
  .cta svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body class="phone c" data-chrome="dark">

  <div class="c-nav">
    <div class="c-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="t">Lucky charm</div>
    <div class="c-icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="#0c0c0e"/></svg></div>
  </div>

  <div class="intro">
    <div class="c-eyebrow">You vs. the odds · 60 games</div>
    <div class="c-h1">You're a lucky charm.</div>
  </div>

  <svg class="gauge" id="g" viewBox="0 0 393 236"></svg>
  <div class="readout">
    <div class="n"><small>+</small>13</div>
    <div class="c-small">points luckier when you go</div>
  </div>
  <div class="ends"><span>Jinx</span><span class="me">Lucky charm</span></div>

  <div class="vs c-group">
    <div class="c-row">
      <div class="lbl"><b>With you</b><span>35–22–2</span></div>
      <div class="bar"><i style="width:61%;background:#0c0c0e"></i></div>
      <div class="pct">61%</div>
    </div>
    <div class="c-row">
      <div class="lbl"><b>Without you</b><span>From the couch</span></div>
      <div class="bar"><i style="width:48%;background:#c3c3bd"></i></div>
      <div class="pct dim">48%</div>
    </div>
    <div class="c-row">
      <div class="lbl" style="display:flex;align-items:center;gap:9px"><div class="c-avatar" style="background:#ff7a8a">M</div><div><b>With Maya</b><span>11–6</span></div></div>
      <div class="bar"><i style="width:65%;background:#ff7a8a"></i></div>
      <div class="pct">65%</div>
    </div>
  </div>

  <div class="cta">
    <div class="c-btn"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share your luck</div>
  </div>

<script>
  // gauge: -20 … +20 across a 180° arc, value +13
  const svg = document.getElementById('g'), NS = 'http://www.w3.org/2000/svg';
  const cx = 196.5, cy = 214, R = 160, val = 13;
  const ang = v => Math.PI - (v + 20) / 40 * Math.PI;           // radians, 0 = right
  const pt = (v, r) => [cx + r * Math.cos(ang(v)), cy - r * Math.sin(ang(v))];
  const arc = (a, b, r) => { const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r); return `M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`; };
  const add = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  add('defs', {}).innerHTML = `<linearGradient id="fill" x1="0" x2="1"><stop offset="0" stop-color="#9db8ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>`;
  // ticks
  for (let v = -20; v <= 20; v += 1) {
    const major = v % 10 === 0, [x1, y1] = pt(v, R - 26), [x2, y2] = pt(v, R - 26 - (major ? 10 : 5));
    add('line', {x1, y1, x2, y2, stroke: v > 0 && v <= val ? '#0c0c0e' : '#c9c9c4', 'stroke-width': major ? 1.8 : 1.1, 'stroke-linecap': 'round'});
  }
  add('path', {d: arc(-20, 20, R), fill: 'none', stroke: '#e6e6e1', 'stroke-width': 22, 'stroke-linecap': 'round'});
  add('path', {d: arc(0, val, R), fill: 'none', stroke: 'url(#fill)', 'stroke-width': 22, 'stroke-linecap': 'round'});
  // zero mark
  const [zx1, zy1] = pt(0, R + 17), [zx2, zy2] = pt(0, R - 17);
  add('line', {x1: zx1, y1: zy1, x2: zx2, y2: zy2, stroke: '#0c0c0e', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: .25});
  // 48% "odds" marker at 0 and knob at +13
  const [kx, ky] = pt(val, R);
  add('circle', {cx: kx, cy: ky, r: 17, fill: '#fff', filter: 'drop-shadow(0 3px 6px rgba(0,0,0,.18))'});
  add('circle', {cx: kx, cy: ky, r: 7, fill: '#0c0c0e'});
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
