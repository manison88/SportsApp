<!doctype html>
<html><head><meta charset="utf-8"><title>Broadcast</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/broadcast.css">
<style>
  .g { position: absolute; left: var(--b-gutter); right: var(--b-gutter); }
  .b-nav .b-label { color: var(--b-text-2); }

  .title { top: 118px; text-align: center; }
  .title .b-display { font-size: 54px; }
  .title .b-display em { font-style: normal; color: var(--b-text-3); }

  .dial { top: 192px; height: 250px; }
  .dial svg { position: absolute; left: 0; top: 0; width: 357px; height: 220px; overflow: visible; }
  .dial .read { position: absolute; left: 0; right: 0; top: 98px; text-align: center; }
  .dial .read .b-mega { font-size: 128px; letter-spacing: -3px; }
  .dial .read .b-label { margin-top: 7px; color: var(--b-text-2); }
  .dial .ends { position: absolute; left: 0; right: 0; top: 210px; display: flex; justify-content: space-between; padding: 0 2px; }
  .dial .ends span { width: 40px; text-align: center; }

  .vs { top: 470px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side { height: 140px; padding: 14px 16px; position: relative; }
  .side .b-label { color: rgba(255,255,255,.8); }
  .side .pct { position: absolute; left: 14px; bottom: 34px; font: 800 72px/.8 var(--b-cond); letter-spacing: -1.5px; }
  .side .sub { position: absolute; left: 16px; bottom: 14px; font: 600 12px/1 var(--b-ui); color: rgba(255,255,255,.78); }
  .side.them { background: var(--b-panel); box-shadow: inset 0 0 0 1px var(--b-line); border-radius: 14px; }
  .side.them .pct { color: var(--b-text-2); }
  .side.them .b-label, .side.them .sub { color: var(--b-text-3); }

  .maya { top: 624px; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; }
  .av { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 800 15px/1 var(--b-cond); color: #1a0a0d; background: #ff7a8a; }
  .maya .t { flex: 1; font: 500 13.5px/1.3 var(--b-ui); color: var(--b-text-2); }
  .maya .t b { color: #fff; font-weight: 600; }
  .maya .b-num { font-size: 26px; color: #ff7a8a; }

  .cta { top: 734px; display: flex; gap: 10px; }
  .cta .b-btn { flex: 1; }
</style></head>
<body class="phone b">

  <div class="b-nav">
    <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="b-label">Lucky charm · 59 games</div>
    <div class="b-icon-btn"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="19" cy="12" r=".6"/></svg></div>
  </div>

  <div class="g title">
    <div class="b-display">You <em>vs.</em> the odds</div>
  </div>

  <div class="g dial">
    <svg id="dial" viewBox="0 0 357 220"></svg>
    <div class="read">
      <div class="b-mega">+13</div>
      <div class="b-label">Points above the odds</div>
    </div>
    <div class="ends"><span class="b-label">Jinx</span><span class="b-label" style="color:#fff">Charm</span></div>
  </div>

  <div class="g vs">
    <div class="side b-field" style="--c:#2f6bff">
      <div class="b-label">With Sam there</div>
      <div class="pct">61%</div>
      <div class="sub">35–22–2 in the stands</div>
    </div>
    <div class="side them">
      <div class="b-label">Without him</div>
      <div class="pct">48%</div>
      <div class="sub">Every other night</div>
    </div>
  </div>

  <div class="g maya b-panel">
    <div class="av">M</div>
    <div class="t"><b>Maya is even luckier.</b> 11–6 in 17 games together.</div>
    <div class="b-num">65%</div>
  </div>

  <div class="g cta">
    <div class="b-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share the verdict</div>
  </div>

<script>
  // 180° dial, -20..+20, needle at +13
  const svg = document.getElementById('dial'), cx = 178.5, cy = 200, R = 168, NS = 'http://www.w3.org/2000/svg';
  const ang = v => Math.PI - (v + 20) / 40 * Math.PI;          // -20 → left, +20 → right
  const pt = (v, r) => [cx + r * Math.cos(ang(v)), cy - r * Math.sin(ang(v))];
  const arc = (a, b, r) => { const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r); return `M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`; };
  const add = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  add('path', { d: arc(-20, 20, R - 10), stroke: '#171a21', 'stroke-width': 20, fill: 'none' });
  add('path', { d: arc(0, 13, R - 10), stroke: '#2f6bff', 'stroke-width': 20, fill: 'none' });
  for (let v = -20; v <= 20; v += 1) {
    const big = v % 5 === 0, [x1, y1] = pt(v, R - 26), [x2, y2] = pt(v, R - (big ? 40 : 32));
    add('line', { x1, y1, x2, y2, stroke: v === 0 ? '#fff' : 'rgba(255,255,255,' + (big ? .5 : .2) + ')', 'stroke-width': big ? 2 : 1.2 });
  }
  const [nx, ny] = pt(13, R + 4), [bx, by] = pt(13, R - 24);
  add('line', { x1: bx, y1: by, x2: nx, y2: ny, stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round' });
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
