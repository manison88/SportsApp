<!doctype html>
<html><head><meta charset="utf-8"><title>Broadcast</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/broadcast.css">
<style>
  .g { position: absolute; left: var(--b-gutter); right: var(--b-gutter); }
  .b-nav .b-h1 { font-size: 30px; }
  .yr { top: 106px; display: flex; justify-content: space-between; align-items: center; }

  .card { position: absolute; left: var(--b-gutter); right: var(--b-gutter); }
  .card .b-frame { height: 400px; border-radius: 14px 14px 0 0; }
  .card .b-frame img { position: absolute; inset: 0; }
  .card .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,8,10,.35) 0%, rgba(7,8,10,0) 26%, rgba(7,8,10,0) 42%, rgba(7,8,10,.92) 100%); }
  .card .tl { position: absolute; left: 16px; top: 16px; }
  .card .copy { position: absolute; left: 18px; right: 18px; bottom: 18px; }
  .card .copy .b-label { color: rgba(255,255,255,.8); margin-bottom: 10px; }
  .card .copy .b-display { font-size: 56px; }

  /* ticket-stub strip, notched where it tears from the photo */
  .stub { position: relative; height: 66px; background: var(--b-panel-2); border-radius: 0 0 14px 14px; display: flex; align-items: center; padding: 0 16px; gap: 0;
    -webkit-mask: radial-gradient(circle 9px at 0 0, transparent 8.5px, #000 9px) top left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 0, transparent 8.5px, #000 9px) top right / 51% 100% no-repeat; }
  .stub::before { content: ""; position: absolute; left: 12px; right: 12px; top: 0; border-top: 1.5px dashed rgba(255,255,255,.16); }
  .stub .c { flex: 1; min-width: 0; }
  .stub .c + .c { padding-left: 12px; box-shadow: inset 1px 0 0 var(--b-line); }
  .stub .c .b-label { font-size: 9.5px; letter-spacing: 1.8px; }
  .stub .c b { display: block; margin-top: 5px; font: 700 15px/1 var(--b-cond); letter-spacing: .4px; text-transform: uppercase; white-space: nowrap; }
  .stub .b-bug { height: 30px; font-size: 15px; flex: none; }
  .stub .b-bug .team { padding: 0 8px; }
  .stub .b-bug .score { padding: 0 9px; }

  .c1 { top: 134px; }
  .c2 { top: 620px; }
  .c2 .b-frame { height: 300px; }
</style></head>
<body class="phone b">

<div class="b-nav">
  <div class="b-h1">Timeline</div>
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></div>
</div>

<div class="g yr">
  <span class="b-label" style="color:#fff">2016 · 9 games</span>
  <span class="b-label">60 games · 2014–2026</span>
</div>

<div class="card c1">
  <div class="b-frame">
    <img class="ph" src="../../../photos/wrigley-night.jpg" style="object-position:50% 80%">
    <div class="scrim"></div>
    <div class="tl"><span class="b-pill" style="background:#fff;color:#000">World Series · G5</span></div>
    <div class="copy">
      <div class="b-label">With Dad · 4 photos</div>
      <div class="b-display">Down 3–1.<br>Not tonight.</div>
    </div>
  </div>
  <div class="stub">
    <div class="c"><div class="b-label">Date</div><b>Oct 30, 2016</b></div>
    <div class="c"><div class="b-label">Bleachers</div><b>Sec 314</b></div>
    <div class="b-bug"><span class="team" style="--c:var(--chc)">CHC</span><span class="score">3</span><span class="team" style="--c:var(--cle)">CLE</span><span class="score">2</span></div>
  </div>
</div>

<div class="card c2">
  <div class="b-frame">
    <img class="ph" src="../../../photos/wrigley-night-2.jpg" style="object-position:50% 72%">
    <div class="scrim"></div>
    <div class="tl"><span class="b-pill" style="background:#fff;color:#000">NLCS · G6</span></div>
  </div>
</div>

<nav class="b-tabs">
  <span class="on"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="9" rx="2"/><path d="M4 17h16M4 21h10"/></svg>Timeline</span>
  <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.4 3.2 14.6 0 18M12 3c-3.2 3.4-3.2 14.6 0 18"/></svg>Map</span>
  <span><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="11" r="3.5"/><path d="M9 17.5h6"/></svg>Passport</span>
  <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4.4-6 8-6s6.6 2 8 6"/></svg>You</span>
</nav>

<script src="../../../kit/kit.js"></script>
</body></html>
