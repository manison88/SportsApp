<!doctype html>
<html><head><meta charset="utf-8"><title>Clean</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/clean.css">
<style>
  .head { position: absolute; top: 100px; left: var(--c-gutter); right: var(--c-gutter); display: flex; justify-content: space-between; align-items: flex-end; }
  .head .c-h1 { margin-top: 8px; }
  .head .btns { display: flex; gap: 8px; }
  .chips { position: absolute; top: 164px; left: var(--c-gutter); right: 0; display: flex; gap: 8px; white-space: nowrap; }

  .card { position: absolute; top: 210px; left: 12px; right: 12px; overflow: visible; }
  .card .ph-wrap { position: relative; height: 288px; margin: 8px 8px 0; border-radius: 18px; overflow: hidden; }
  .card .date { position: absolute; top: 12px; left: 12px; height: 28px; padding: 0 11px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.88); backdrop-filter: blur(10px); font: 600 12px/1 var(--c-ui); color: var(--c-text); }
  .card .date i { width: 6px; height: 6px; border-radius: 3px; background: #ffb612; }
  .card .count { position: absolute; top: 12px; right: 12px; height: 28px; padding: 0 10px; border-radius: 14px; display: inline-flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,.4); backdrop-filter: blur(10px); font: 600 12px/1 var(--c-ui); color: #fff; }
  .card .count svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card .body { padding: 16px 18px 18px; }
  .card .c-h1 { font-size: 27px; line-height: 1.08; letter-spacing: -.8px; }
  .card .with { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .card .with .av { display: flex; }
  .card .with .c-avatar { width: 24px; height: 24px; font-size: 11px; box-shadow: 0 0 0 2px #fff; }
  .card .with .c-avatar + .c-avatar { margin-left: -6px; }

  /* ticket stub */
  .stub { position: relative; display: flex; align-items: center; padding: 16px 18px 18px; }
  .stub::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: 1.5px dashed rgba(0,0,0,.12); }
  .notch { position: absolute; top: -10px; width: 20px; height: 20px; border-radius: 10px; background: var(--c-bg); }
  .notch.l { left: -10px; box-shadow: inset -3px 0 4px -2px rgba(0,0,0,.06); }
  .notch.r { right: -10px; box-shadow: inset 3px 0 4px -2px rgba(0,0,0,.06); }
  .stub .f { flex: 1; }
  .stub .f + .f { padding-left: 12px; }
  .stub .k { font: 600 9.5px/1 var(--c-ui); letter-spacing: 1px; text-transform: uppercase; color: var(--c-text-3); }
  .stub .v { margin-top: 5px; font: 600 14px/1 var(--c-display); letter-spacing: -.2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stub .sc { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  .stub .sc .c-mono { width: 24px; height: 24px; border-radius: 7px; font-size: 11px; }
  .stub .sc .n { font: 700 17px/1 var(--c-display); letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .stub .sc .n.lo { color: var(--c-text-3); }

  .next { position: absolute; top: 718px; left: 12px; right: 12px; height: 200px; padding: 8px; }
  .next .ph-wrap { height: 180px; border-radius: 18px; overflow: hidden; position: relative; }
</style></head>
<body class="phone c" data-chrome="dark">
  <div class="head">
    <div>
      <div class="c-eyebrow">60 games · 2014–2026</div>
      <div class="c-h1">Timeline</div>
    </div>
    <div class="btns">
      <span class="c-icon-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></span>
    </div>
  </div>

  <div class="chips">
    <span class="c-chip on">All</span>
    <span class="c-chip">2025</span>
    <span class="c-chip">With Maya</span>
    <span class="c-chip">Road trips</span>
    <span class="c-chip">Walk-offs</span>
  </div>

  <div class="c-card card">
    <div class="ph-wrap">
      <img class="ph" src="../../../photos/lambeau-concourse.jpg" style="object-position:40% 50%">
      <span class="date"><i></i>Jan 5, 2025 · 19°F</span>
      <span class="count"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="3"/><circle cx="12" cy="12.5" r="3.2"/><path d="M9 6l1.3-2h3.4L15 6"/></svg>23</span>
    </div>
    <div class="body">
      <div class="c-h1">Nobody breathed until the kick went up.</div>
      <div class="with">
        <span class="av"><span class="c-avatar" style="background:#ff7a8a">M</span><span class="c-avatar" style="background:#6fd3ff">L</span></span>
        <span class="c-small" style="color:var(--c-text-2)">With Maya &amp; Leo · 51-yard walk-off</span>
      </div>
    </div>
    <div class="stub">
      <span class="notch l"></span><span class="notch r"></span>
      <div class="f"><div class="k">Venue</div><div class="v">Lambeau Field</div></div>
      <div class="f"><div class="k">Seat</div><div class="v">112 · Row 41</div></div>
      <div class="sc">
        <span class="c-mono" style="--c:#0b162a">CHI</span><span class="n">24</span>
        <span class="n lo">22</span><span class="c-mono" style="--c:#203731">GB</span>
      </div>
    </div>
  </div>

  <div class="c-card next">
    <div class="ph-wrap"><img class="ph" src="../../../photos/soldier-soccer.jpg" style="object-position:50% 40%"><span class="date" style="position:absolute;top:12px;left:12px;height:28px;padding:0 11px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);font:600 12px/1 var(--c-ui)"><i style="width:6px;height:6px;border-radius:3px;background:#e0362e"></i>Oct 4, 2023 · Soldier Field</span></div>
  </div>

  <nav class="c-tabs">
    <span class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Timeline</span>
    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Map</span>
    <span><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10.5" r="3"/><path d="M9 16.5h6"/></svg>Passport</span>
    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>You</span>
  </nav>

<script src="../../../kit/kit.js"></script>
</body></html>
