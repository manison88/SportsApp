<!doctype html>
<html><head><meta charset="utf-8"><title>Cinema</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/cinema.css">
<style>
  .photo { position: absolute; left: 0; right: 0; top: 0; height: 470px; overflow: hidden; }
  .photo img { filter: saturate(.75) brightness(.62) blur(1px); transform: scale(1.1); object-position: 50% 55%; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,5,6,.75) 0%, rgba(5,5,6,.4) 30%, rgba(5,5,6,.6) 60%, #050506 100%); }
  .glow { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 60% at 50% 30%, rgba(47,107,255,.42), rgba(47,107,255,.12) 45%, rgba(47,107,255,0) 70%),
                radial-gradient(90% 40% at 50% 64%, rgba(47,107,255,.16), rgba(47,107,255,0) 70%); }

  .live { height: 30px; padding: 0 13px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #ff4d3d; box-shadow: 0 0 0 3px rgba(255,77,61,.22); }

  .meta { position: absolute; left: 0; right: 0; top: 116px; text-align: center; }
  .score { position: absolute; left: 22px; right: 22px; top: 150px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .team { text-align: center; }
  .team .n { font: 600 124px/.86 var(--a-num); letter-spacing: -6px; font-variant-numeric: tabular-nums; }
  .team.away .n { color: var(--a-text-2); }
  .team .who { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font: 600 13px/1 var(--a-ui); letter-spacing: 1.4px; }
  .team.away .who { color: var(--a-text-2); }
  .mono-badge { width: 26px; height: 26px; font-size: 13px; border-radius: 8px; }
  .score .colon { width: 1px; height: 76px; background: var(--a-line); margin-top: -24px; }

  .state { position: absolute; left: 0; right: 0; top: 334px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .state .inn { font: 600 15px/1 var(--a-num); letter-spacing: -.1px; display: flex; align-items: center; gap: 6px; }
  .state .inn svg { width: 9px; height: 9px; fill: var(--a-text); }
  .bases { width: 40px; height: 30px; position: relative; }
  .bases i { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); border-radius: 2px; box-shadow: inset 0 0 0 1.5px rgba(245,241,234,.45); }
  .bases i.on { background: var(--a-text); box-shadow: 0 0 10px rgba(255,255,255,.5); }
  .outs { display: flex; gap: 5px; align-items: center; font: 500 13px/1 var(--a-ui); color: var(--a-text-2); }
  .outs b { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px rgba(245,241,234,.45); display: inline-block; }
  .outs b.on { background: var(--a-text); box-shadow: none; }
  .sep { width: 1px; height: 18px; background: var(--a-line); }

  .save { position: absolute; left: 50%; top: 404px; width: 196px; height: 196px; margin-left: -98px; border-radius: 50%; display: grid; place-items: center; }
  .save::before, .save::after { content: ""; position: absolute; border-radius: 50%; }
  .save::before { inset: -18px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .save::after { inset: -38px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
  .save .core { width: 196px; height: 196px; border-radius: 50%; background: var(--a-text); color: #0a0a0b; display: grid; place-items: center; align-content: center; gap: 10px;
    box-shadow: 0 0 0 8px rgba(47,107,255,.2); position: relative; z-index: 1; }
  .halo { position: absolute; left: 50%; top: 502px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; background: radial-gradient(closest-side, rgba(47,107,255,.5), rgba(47,107,255,.18) 55%, rgba(47,107,255,0)); }
  .save svg { width: 34px; height: 34px; fill: none; stroke: #0a0a0b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .save .t { font: 400 25px/1.02 var(--a-serif); letter-spacing: -.3px; text-align: center; }
  .hint { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }

  .la-label { position: absolute; left: 22px; right: 22px; top: 680px; display: flex; justify-content: space-between; align-items: center; }
  .la { position: absolute; left: 16px; right: 16px; top: 702px; height: 70px; border-radius: 24px; background: rgba(0,0,0,.85); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14);
    display: flex; align-items: center; padding: 0 14px; gap: 12px; }
  .la .w { width: 34px; height: 34px; border-radius: 10px; background: var(--a-text); color: #0a0a0b; display: grid; place-items: center; font: 400 20px/1 var(--a-serif); }
  .la .mid { flex: 1; }
  .la .sc { font: 600 19px/1 var(--a-num); letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .la .sc span { color: var(--a-text-3); font-weight: 500; }
  .la .sub { font: 500 11.5px/1 var(--a-ui); color: var(--a-text-3); margin-top: 6px; }
  .la .dot { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; }
  .la .dot svg { width: 17px; height: 17px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body class="phone a">
  <div class="photo"><img class="ph" src="../../../photos/wrigley-night-2.jpg"></div>
  <div class="glow"></div>
  <div class="grain"></div>

  <div class="a-nav">
    <div class="a-icon-btn"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="a-chip live"><i></i>Live · Wrigley Field</div>
    <div class="a-icon-btn"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="19" cy="12" r=".6"/></svg></div>
  </div>

  <div class="meta"><span class="a-eyebrow accent">17th visit · 17th game with Maya</span></div>

  <div class="score">
    <div class="team">
      <div class="n">4</div>
      <div class="who"><span class="mono-badge" style="background:#0e3386;box-shadow:inset 0 0 0 1.5px #cc3433">C</span>CHC</div>
    </div>
    <div class="colon"></div>
    <div class="team away">
      <div class="n">3</div>
      <div class="who"><span class="mono-badge" style="background:#12284b;color:#ffc52f">M</span>MIL</div>
    </div>
  </div>

  <div class="state">
    <div class="inn"><svg viewBox="0 0 10 10"><path d="M1 2h8L5 8z"/></svg>Bottom 7th</div>
    <div class="sep"></div>
    <div class="bases">
      <i style="left:14.5px;top:2px" class="on"></i>
      <i style="left:3px;top:13.5px"></i>
      <i style="left:26px;top:13.5px"></i>
    </div>
    <div class="sep"></div>
    <div class="outs"><b class="on"></b><b></b>1 out</div>
  </div>

  <div class="halo"></div>
  <div class="save">
    <div class="core">
      <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg>
      <div class="t">Save this<br>moment</div>
    </div>
  </div>
  <div class="hint a-small">Stamps the score, the inning and Section 209</div>

  <div class="la-label"><span class="a-eyebrow">On your Lock Screen</span><span class="a-small">Live Activity</span></div>
  <div class="la">
    <div class="w">W</div>
    <div class="mid">
      <div class="sc">CHC 4 <span>–</span> 3 MIL</div>
      <div class="sub">Bot 7th · 1 out · runner on 2nd</div>
    </div>
    <div class="dot"><svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg></div>
  </div>
<script src="../../../kit/kit.js"></script>
</body></html>
