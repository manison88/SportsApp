<!doctype html>
<html><head><meta charset="utf-8"><title>Clean</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/clean.css">
<style>
  .pair { display: flex; }
  .pair .c-avatar { width: 32px; height: 32px; }
  .intro { position: absolute; top: 112px; left: 20px; right: 20px; }
  .intro .c-h1 { margin-top: 8px; }

  .venn { position: absolute; top: 186px; left: 0; width: 393px; height: 232px; }
  .vl { position: absolute; font: 700 15px/1.2 var(--c-display); letter-spacing: -.2px; }
  .vl small { display: block; font: 500 12px/1.3 var(--c-ui); color: var(--c-text-3); letter-spacing: 0; }
  .seventeen { position: absolute; top: 254px; left: 186px; width: 124px; text-align: center; color: #fff; }
  .seventeen b { display: block; font: 700 64px/.9 var(--c-display); letter-spacing: -3px; font-variant-numeric: tabular-nums; }
  .seventeen span { font: 600 11px/1 var(--c-ui); letter-spacing: 1px; text-transform: uppercase; opacity: .9; }

  .h2h { position: absolute; top: 438px; left: 16px; right: 16px; }
  .h2h .head { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; padding: 14px 18px 4px; }
  .h2h .head > div { display: flex; align-items: center; gap: 8px; font: 600 13px/1 var(--c-ui); }
  .h2h .head > div:last-child { justify-content: flex-end; }
  .h2h .head .c-avatar { width: 22px; height: 22px; font-size: 10.5px; box-shadow: none; }
  .h2h .r { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; padding: 12px 18px; }
  .h2h .r + .r { box-shadow: inset 0 1px 0 var(--c-line); }
  .h2h .r .c-num { font-size: 22px; letter-spacing: -.7px; }
  .h2h .r .c-num:last-child { text-align: right; }
  .h2h .r .c-num.win { color: #ff5c70; }
  .h2h .r .c-num.lose { color: var(--c-text-3); }
  .h2h .r .k { text-align: center; font: 500 12.5px/1.2 var(--c-ui); color: var(--c-text-2); }
  .h2h .r .k em { font-style: normal; display: block; font-size: 10.5px; color: var(--c-text-3); margin-top: 2px; }

  .maplbl { position: absolute; top: 640px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: baseline; }
  .map { position: absolute; top: 664px; left: 16px; right: 16px; height: 140px; border-radius: 22px; overflow: hidden; background: #fff; }
  .map svg { display: block; }
</style></head>
<body class="phone c" data-chrome="dark">

  <div class="c-nav">
    <div class="c-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="pair"><div class="c-avatar" style="background:#0c0c0e">S</div><div class="c-avatar" style="background:#ff7a8a;margin-left:-8px">M</div></div>
    <div class="c-icon-btn"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>

  <div class="intro">
    <div class="c-eyebrow">Shared passport · Sam &amp; Maya</div>
    <div class="c-h1">17 games together.</div>
  </div>

  <svg class="venn" viewBox="0 0 393 232">
    <defs><radialGradient id="mg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ff9aa6"/><stop offset="1" stop-color="#ff5c70"/></radialGradient></defs>
    <circle cx="196" cy="116" r="112" fill="#fff" stroke="#0c0c0e" stroke-width="1.5"/>
    <circle cx="240" cy="134" r="60" fill="url(#mg)"/>
  </svg>
  <div class="vl" style="top:254px;left:108px">Sam<small>60 games</small></div>
  <div class="seventeen" style="left:178px;top:282px"><b>17</b><span>together</span></div>

  <div class="h2h c-group">
    <div class="head"><div><div class="c-avatar" style="background:#ff7a8a">M</div>Maya</div><div></div><div>Sam<div class="c-avatar" style="background:#0c0c0e">S</div></div></div>
    <div class="r"><span class="c-num win">65%</span><span class="k">Win rate<em>11–6 together</em></span><span class="c-num">61%</span></div>
    <div class="r"><span class="c-num">6</span><span class="k">Venues</span><span class="c-num">21</span></div>
    <div class="r"><span class="c-num">2</span><span class="k">Countries</span><span class="c-num">3</span></div>
  </div>

  <div class="maplbl"><span class="c-eyebrow">Roads you shared</span><span class="c-small">Lambeau 2025 · Spain 2020</span></div>
  <div class="map"><svg id="m" width="361" height="140"></svg></div>

<script src="../../../kit/vendor/d3.min.js"></script>
<script src="../../../kit/vendor/topojson-client.min.js"></script>
<script src="../../../kit/vendor/countries-110m.js"></script>
<script>
  const C = __atlas['countries-110m'];
  const land = topojson.feature(C, C.objects.countries);
  const W = 361, H = 140;
  const CHI = [-87.63, 41.88], GB = [-88.06, 44.50], BCN = [2.12, 41.38], VLC = [-0.38, 39.47], MAD = [-3.69, 40.45];
  const proj = d3.geoNaturalEarth1().rotate([42, 0]).fitExtent([[22, 18], [W - 22, H - 18]], {type: 'MultiPoint', coordinates: [[-91, 47], [7, 37], [-91, 37], [7, 47]]});
  const path = d3.geoPath(proj);
  const svg = d3.select('#m');
  svg.append('path').datum(land).attr('d', path).attr('fill', '#ecece7');
  const gc = (a, b, n = 80) => { const i = d3.geoInterpolate(a, b); return {type: 'LineString', coordinates: d3.range(n + 1).map(k => i(k / n))}; };
  // lift arcs into a gentle bow
  const bow = (a, b, h) => {
    const [x1, y1] = proj(a), [x2, y2] = proj(b), mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - h;
    return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
  };
  const arcs = [[CHI, BCN, 34], [BCN, VLC, 0], [VLC, MAD, 0], [MAD, CHI, -18], [CHI, GB, 0]];
  arcs.forEach(([a, b, h], k) => svg.append('path').attr('d', bow(a, b, h)).attr('fill', 'none')
    .attr('stroke', k === 3 ? '#0c0c0e' : '#ff5c70').attr('stroke-width', k === 3 ? 1.4 : 2.2).attr('stroke-linecap', 'round')
    .attr('stroke-dasharray', k === 3 ? '2 4' : null).attr('opacity', k === 3 ? .5 : 1));
  const dot = (p, r, fill) => { const [x, y] = proj(p); svg.append('circle').attr('cx', x).attr('cy', y).attr('r', r).attr('fill', fill).attr('stroke', '#fff').attr('stroke-width', 2); };
  dot(CHI, 5, '#0c0c0e'); dot(GB, 4.5, '#ff5c70'); dot(BCN, 4.5, '#ff5c70'); dot(MAD, 4.5, '#ff5c70'); dot(VLC, 3, '#ff5c70');
  const lab = (p, t, dx, dy, anchor = 'start') => { const [x, y] = proj(p); svg.append('text').attr('x', x + dx).attr('y', y + dy).attr('text-anchor', anchor)
    .attr('font-family', 'Inter').attr('font-weight', 600).attr('font-size', 10.5).attr('fill', '#0c0c0e').text(t); };
  lab(CHI, 'Chicago', 8, 14); lab(GB, 'Lambeau · 19°F', 8, -6); lab(BCN, 'Barcelona', 4, -10, 'end'); lab(MAD, 'Madrid', -8, 16, 'end');
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
