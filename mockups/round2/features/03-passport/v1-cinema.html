<!doctype html>
<html><head><meta charset="utf-8"><title>Cinema</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../system/cinema.css">
<style>
  .hdr { position: absolute; top: 62px; left: var(--a-gutter); right: var(--a-gutter); }
  .hdr .a-h1 { margin-top: 8px; }
  .hdr .a-h1 i { color: #f3dcc0; }
  .hdr .a-small { margin-top: 10px; color: var(--a-text-2); }
  .ring { position: absolute; right: 18px; top: 66px; width: 92px; height: 92px; }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .c b { display: block; font: 600 22px/1 var(--a-num); letter-spacing: -.6px; }
  .ring .c span { display: block; margin-top: 3px; font: 600 9px/1 var(--a-ui); letter-spacing: 1.3px; color: var(--a-text-3); }

  .chips { position: absolute; top: 196px; left: var(--a-gutter); right: 0; display: flex; gap: 8px; }
  .chips .a-chip.on { background: var(--a-text); color: #0a0a0b; }
  .chips .a-chip em { font-style: normal; opacity: .55; }

  .grid { position: absolute; top: 248px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 18px; }
  .st { display: grid; justify-items: center; }
  .st svg { width: 96px; height: 96px; overflow: visible; }
  .st .nm { margin-top: 8px; font: 500 12.5px/1.2 var(--a-ui); color: var(--a-text); text-align: center; white-space: nowrap; }
  .st .dt { margin-top: 3px; font: 500 11px/1 var(--a-num); color: var(--a-text-3); font-variant-numeric: tabular-nums; }
  .st.ghost .nm { color: var(--a-text-3); }
  .fadeout { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(5,5,6,0), #050506 78%); z-index: 10; pointer-events: none; }
</style></head>
<body class="phone a">
  <div class="hdr">
    <div class="a-eyebrow">Stadium passport</div>
    <div class="a-h1">14 of 30<br><i>ballparks.</i></div>
    <div class="a-small">Next closest: Rogers Centre · 435 mi</div>
  </div>
  <div class="ring">
    <svg width="92" height="92" viewBox="0 0 92 92" style="overflow:visible">
      <circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5"/>
      <circle cx="46" cy="46" r="40" fill="none" stroke="#ffb547" stroke-width="5" stroke-linecap="round" stroke-dasharray="117.3 251.3" transform="rotate(-90 46 46)" style="filter:drop-shadow(0 0 6px rgba(255,181,71,.55))"/>
    </svg>
    <div class="c"><div><b>47%</b><span>MLB</span></div></div>
  </div>

  <div class="chips">
    <span class="a-chip on">MLB <em>14/30</em></span>
    <span class="a-chip">NFL <em>2</em></span>
    <span class="a-chip">NBA · NHL <em>1</em></span>
    <span class="a-chip">Soccer <em>4</em></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="fadeout"></div>

  <nav class="a-tabs">
    <span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Timeline</span>
    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></svg>Map</span>
    <span class="on"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10.5" r="3"/><path d="M9 16.5h6"/></svg>Passport</span>
    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>You</span>
  </nav>

<script>
(function(){
  // [ring text, monogram, name, first visit, visits, tilt]
  const S = [
    ['WRIGLEY FIELD · CHICAGO', 'W', 'Wrigley Field', 'Jun 14, 2014', 17, -6],
    ['GUARANTEED RATE · CHICAGO', 'GR', 'Guaranteed Rate', 'Aug 2, 2014', 1, 4],
    ['BUSCH STADIUM · ST. LOUIS', 'B', 'Busch Stadium', 'Jul 8, 2017', 1, -3],
    ['FENWAY PARK · BOSTON', 'F', 'Fenway Park', 'Jun 22, 2018', 1, 7],
    ['PROGRESSIVE FIELD · CLEVELAND', 'P', 'Progressive Field', 'Jul 13, 2019', 1, -8],
    ['PNC PARK · PITTSBURGH', 'PNC', 'PNC Park', 'Aug 17, 2019', 1, 3],
    ['GREAT AMERICAN · CINCINNATI', 'GA', 'Great American', 'May 29, 2021', 1, -4],
    ['COMERICA PARK · DETROIT', 'C', 'Comerica Park', 'Jul 9, 2022', 1, 6],
    ['YANKEE STADIUM · NEW YORK', 'Y', 'Yankee Stadium', 'Sep 10, 2022', 1, -5],
  ];
  const G = ['Rogers Centre', 'Nationals Park', 'Citi Field'];
  // foil tints: warm gold, pearl, rose, sea-glass
  const F = [['#f3d9a8','#c9a96a','#e8c995'],['#eef0f2','#b9c0c8','#dfe4ea'],['#f4d6d0','#c99f9a','#ebc6c0'],['#d8efe6','#9fc2b6','#c8e3da'],['#efe6d6','#c8b9a0','#e2d5bf']];
  const grid = document.getElementById('grid');
  S.forEach(([ring, mono, name, date, n, tilt], i) => {
    const id = 'p' + i;
    const yr = date.slice(-4);
    const d = document.createElement('div'); d.className = 'st';
    d.innerHTML = `<svg viewBox="0 0 96 96">
      <defs>
        <linearGradient id="f${i}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${F[i%F.length][0]}"/><stop offset=".38" stop-color="${F[i%F.length][1]}"/><stop offset=".56" stop-color="#fffaf0"/><stop offset=".78" stop-color="${F[i%F.length][2]}"/><stop offset="1" stop-color="${F[i%F.length][0]}"/>
        </linearGradient>
        <path id="${id}" d="M48 48 m-33 0 a33 33 0 1 1 66 0 a33 33 0 1 1 -66 0"/>
      </defs>
      <g transform="rotate(${tilt} 48 48)" opacity="${i === 0 ? 1 : .9}">
        <circle cx="48" cy="48" r="44" fill="rgba(255,248,236,.035)" stroke="url(#f${i})" stroke-width="1.6"/>
        <circle cx="48" cy="48" r="40.5" fill="none" stroke="url(#f${i})" stroke-width=".6" stroke-dasharray="1.2 2.2" opacity=".8"/>
        <circle cx="48" cy="48" r="25" fill="none" stroke="url(#f${i})" stroke-width=".8" opacity=".85"/>
        <text font-family="Inter" font-size="6.6" font-weight="600" letter-spacing="1.25" fill="url(#f${i})"><textPath href="#${id}" startOffset="${i % 2 ? 2 : 4}%">${ring} · ${yr} ·</textPath></text>
        <text x="48" y="${mono.length > 2 ? 52.5 : 55}" text-anchor="middle" font-family="Instrument Serif" font-size="${mono.length > 2 ? 15 : mono.length > 1 ? 20 : 25}" fill="url(#f${i})">${mono}</text>
      </g>
      ${n > 1 ? `<g><circle cx="88" cy="10" r="11" fill="#f5f1ea" stroke="#050506" stroke-width="2"/><text x="88" y="13.6" text-anchor="middle" font-family="Inter Tight" font-weight="700" font-size="10" fill="#0a0a0b">×${n}</text></g>` : ''}
    </svg><div class="nm">${name}</div><div class="dt">${date}</div>`;
    grid.appendChild(d);
  });
  G.forEach(name => {
    const d = document.createElement('div'); d.className = 'st ghost';
    d.innerHTML = `<svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1" stroke-dasharray="3 4"/><path d="M48 41v14M41 48h14" stroke="rgba(255,255,255,.22)" stroke-width="1.2" stroke-linecap="round"/></svg><div class="nm">${name}</div><div class="dt">Not yet</div>`;
    grid.appendChild(d);
  });
})();
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
