<!doctype html>
<html><head><meta charset="utf-8"><title>Game memory</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../../round2/system/broadcast.css">
<link rel="stylesheet" href="../../system/final.css">
<style>
  body.b { --b-text-3: rgba(255,255,255,.6); }
  .b-label, .f-stats span { font-size: 12px; }
  .b-body { font-size: 15px; }

  .f-hero { height: 460px; }
  .f-hero .crop { position: absolute; inset: 0; overflow: hidden; }
  .f-hero .crop img { filter: contrast(1.04) saturate(.85) brightness(.88); }
  /* softer scrim than the system default */
  .f-hero::after { background: linear-gradient(180deg, rgba(7,8,10,.5) 0%, rgba(7,8,10,0) 20%, rgba(7,8,10,0) 44%, rgba(7,8,10,.62) 74%, #07080a 100%); }

  .head { top: 318px; z-index: 5; }
  .head .b-display { font-size: 60px; }
  .head .b-body { margin-top: 12px; color: rgba(255,255,255,.75); }

  .body { top: 490px; }

  .ls { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .ls th { font: 700 12px/1 var(--b-cond); letter-spacing: 2px; color: var(--b-text-3); text-align: center; padding-bottom: 8px; }
  .ls td { height: 48px; box-shadow: inset 0 1px 0 var(--b-line); text-align: center; font: 600 20px/1 var(--b-cond); color: var(--b-text-2); width: 34px; }
  .ls td.tm { text-align: left; width: auto; }
  .ls td.tm div { display: flex; align-items: center; gap: 12px; font: 700 20px/1 var(--b-cond); letter-spacing: .4px; text-transform: uppercase; color: #fff; }
  .ls td.t { width: 56px; text-align: right; font: 800 32px/1 var(--b-cond); color: #fff; }
  .ls tr.lose td.tm div, .ls tr.lose td.t { color: rgba(255,255,255,.6); }

  .who .f-row { gap: 14px; }
  .who .f-av { width: 36px; height: 36px; font-size: 16px; }
  .who .f-av + .f-av { margin-left: -6px; }
  .who .nm { font: 700 20px/1 var(--b-cond); letter-spacing: .4px; text-transform: uppercase; }
  .who .note { margin-top: 12px; font: 400 16px/1.45 var(--b-ui); color: rgba(255,255,255,.75); }

  .cta { position: absolute; left: 20px; right: 20px; bottom: 40px; }
  .cta .b-btn { width: 100%; height: 54px; font-size: 17px; }
  .cta svg { width: 16px; height: 16px; fill: currentColor; }
</style></head>
<body class="phone b">

<div class="f-hero"><div class="crop" data-crop="lambeau-concourse.jpg 760 370 700 855"></div></div>

<div class="b-nav">
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
</div>

<div class="f-col head" style="gap:0">
  <div class="b-display">51 yards.<br>No time left.</div>
  <div class="b-body">Lambeau Field, Jan 5, 2025</div>
</div>

<div class="f-col body">
  <table class="ls">
    <tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th style="text-align:right">T</th></tr>
    <tr><td class="tm"><div><span class="f-mono" style="--c:var(--chi)">CHI</span>Chicago</div></td><td>7</td><td>7</td><td>7</td><td>3</td><td class="t">24</td></tr>
    <tr class="lose"><td class="tm"><div><span class="f-mono" style="--c:var(--gb);color:#000">GB</span>Green Bay</div></td><td>0</td><td>7</td><td>0</td><td>15</td><td class="t">22</td></tr>
  </table>

  <div class="who">
    <div class="f-row">
      <div class="f-row" style="gap:0"><span class="f-av" style="--c:var(--maya)">M</span><span class="f-av" style="--c:var(--leo)">L</span></div>
      <div class="nm">With Maya &amp; Leo</div>
    </div>
    <div class="note">“Maya counted down the last eight seconds.”</div>
  </div>
</div>

<div class="cta">
  <div class="b-btn"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>Play recap</div>
</div>

<script>
(function () {
  const N = { 'wrigley-night.jpg': [1920, 2560], 'wrigley-night-2.jpg': [1920, 2560], 'lambeau-concourse.jpg': [1920, 1288], 'wrigley-bleachers.jpg': [1280, 853] };
  document.querySelectorAll('[data-crop]').forEach(b => {
    const [src, sx, sy, sw, sh] = b.dataset.crop.split(/\s+/).map((v, i) => i ? +v : v);
    const [nw, nh] = N[src], bw = b.clientWidth, bh = b.clientHeight, s = Math.max(bw / sw, bh / sh);
    const i = document.createElement('img');
    i.src = '../../../photos/' + src;
    i.style.cssText = `position:absolute;max-width:none;width:${nw * s}px;height:${nh * s}px;left:${bw / 2 - (sx + sw / 2) * s}px;top:${bh / 2 - (sy + sh / 2) * s}px`;
    b.prepend(i);
  });
})();
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
