<!doctype html>
<html><head><meta charset="utf-8"><title>Shared passport · Maya</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../../round2/system/broadcast.css">
<link rel="stylesheet" href="../../system/final.css">
<style>
  .hero { position: absolute; left: 0; right: 0; top: 112px; height: 304px; }
  .hero .ring { position: absolute; left: 50%; top: 0; width: 304px; height: 304px; margin-left: -152px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); }
  .hero .ring .lab { position: absolute; left: 0; right: 0; top: 24px; text-align: center; font: 800 26px/1 var(--b-cond); }
  .hero .ring .lab small { display: block; margin-top: 4px; font: 700 12px/1 var(--b-cond); letter-spacing: 2px; text-transform: uppercase; color: var(--b-text-2); }
  .hero .disc { position: absolute; left: 50%; top: 82px; width: 206px; height: 206px; margin-left: -103px; border-radius: 50%; background: var(--maya); color: #1a0a0d; display: grid; place-items: center; align-content: center; box-shadow: 0 0 60px rgba(255,122,138,.25); }
  .hero .disc b { font: 800 132px/.8 var(--b-cond); letter-spacing: -3px; }
  .hero .disc span { margin-top: 12px; font: 800 13px/1 var(--b-cond); letter-spacing: 2.2px; text-transform: uppercase; }

  .h2h { top: 446px; }
  .h2h .who { display: flex; justify-content: space-between; align-items: center; height: 44px; font: 700 17px/1 var(--b-cond); letter-spacing: .4px; text-transform: uppercase; }
  .h2h .who > div { display: flex; align-items: center; gap: 10px; }
  .h2h .who .f-av + span, .h2h .who span + .f-av { margin: 0; }
  .h2h .f-item { justify-content: space-between; }
  .h2h .v { font: 800 30px/1 var(--b-cond); font-variant-numeric: tabular-nums; min-width: 70px; }
  .h2h .v.m { color: var(--maya); }
  .h2h .v.s { text-align: right; color: #fff; }
  .h2h .k { font: 700 17px/1 var(--b-cond); letter-spacing: .4px; text-transform: uppercase; color: var(--b-text-2); }

  .map { position: absolute; left: 20px; right: 20px; top: 686px; height: 118px; border-radius: 14px; overflow: hidden; background: #0d1016; box-shadow: inset 0 0 0 1px var(--b-line); }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style></head>
<body class="phone b">

<div class="b-nav">
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
</div>

<div class="hero">
  <div class="ring"><div class="lab">60<small>Your games</small></div></div>
  <div class="disc"><b>17</b><span>With Maya</span></div>
</div>

<div class="f-col h2h">
  <div>
    <div class="who">
      <div><span class="f-av" style="--c:var(--maya)">M</span><span>Maya</span></div>
      <div><span>Sam</span><span class="f-av" style="--c:#fff">S</span></div>
    </div>
    <div class="f-list">
      <div class="f-item"><div class="v m">65%</div><div class="k">Win rate</div><div class="v s">61%</div></div>
      <div class="f-item"><div class="v m">8</div><div class="k">Venues</div><div class="v s">21</div></div>
      <div class="f-item"><div class="v m">2</div><div class="k">Countries</div><div class="v s">3</div></div>
    </div>
  </div>
</div>

<div class="map"><svg id="map" viewBox="0 0 353 118"></svg></div>

<script src="../../../kit/vendor/d3.min.js"></script>
<script src="../../../kit/vendor/topojson-client.min.js"></script>
<script src="../../../kit/vendor/countries-110m.js"></script>
<script>
  (function () {
    const topo = window.__atlas['countries-110m'];
    const land = topojson.feature(topo, topo.objects.countries);
    const W = 353, H = 118;
    const chi = [-87.65, 41.88], gb = [-88.02, 44.50], bcn = [2.17, 41.39], vlc = [-0.38, 39.47], mad = [-3.70, 40.42];
    const proj = d3.geoNaturalEarth1().rotate([43, 0]).fitExtent([[100, 44], [W - 40, 84]], { type: 'MultiPoint', coordinates: [[-88, 45], [2, 45], [-88, 39], [2, 39]] });
    const path = d3.geoPath(proj);
    const svg = d3.select('#map');
    svg.append('g').selectAll('path').data(land.features).join('path').attr('d', path).attr('fill', '#1c2029').attr('stroke', '#0d1016').attr('stroke-width', .6);
    const line = (pts, w) => svg.append('path').attr('d', path({ type: 'LineString', coordinates: pts })).attr('fill', 'none').attr('stroke', '#ff7a8a').attr('stroke-width', w).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    line([chi, gb], 2.4); line([chi, bcn], 2); line([bcn, vlc, mad], 2.4); line([mad, chi], 2);
    const dot = (c, r, f) => { const [x, y] = proj(c); svg.append('circle').attr('cx', x).attr('cy', y).attr('r', r).attr('fill', f).attr('stroke', '#0d1016').attr('stroke-width', 2); return [x, y]; };
    dot(chi, 5, '#fff'); const [gx, gy] = dot(gb, 4.5, '#ff7a8a'); dot(bcn, 4.5, '#ff7a8a'); const [mx, my] = dot(mad, 4.5, '#ff7a8a');
    const txt = (x, y, a, t) => svg.append('text').attr('x', x).attr('y', y).attr('text-anchor', a).attr('fill', '#fff').attr('font-family', 'Barlow Condensed').attr('font-weight', 800).attr('font-size', 14).attr('letter-spacing', 1.4).text(t);
    txt(gx - 12, gy + 5, "end", "LAMBEAU");
    txt(mx - 4, my + 24, 'middle', 'SPAIN');
  })();
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
