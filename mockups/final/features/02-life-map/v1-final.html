<!doctype html>
<html><head><meta charset="utf-8"><title>Life map</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../../round2/system/broadcast.css">
<link rel="stylesheet" href="../../system/final.css">
<style>
  body.b { --b-text-3: rgba(255,255,255,.6); }
  .b-label, .f-stats span { font-size: 12px; }
  .b-body { font-size: 15px; }

  #map { position: absolute; left: 0; top: 96px; width: 393px; height: 470px; }
  .fade { position: absolute; left: 0; right: 0; top: 486px; height: 80px; background: linear-gradient(rgba(7,8,10,0), var(--b-bg)); }

  .stats { top: 560px; }
  .big { display: flex; align-items: flex-end; gap: 12px; }
  .big .b-mega { font-size: 106px; letter-spacing: -2.5px; margin-left: -4px; }
  .big .b-h2 { padding-bottom: 8px; font-size: 24px; }
</style></head>
<body class="phone b">

<div class="b-nav">
  <div class="f-title">Map</div>
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></div>
</div>

<svg id="map"></svg>
<div class="fade"></div>

<div class="f-col stats">
  <div class="big"><div class="b-mega">42,900</div><div class="b-h2">Miles</div></div>
  <div class="f-stats">
    <div><b>21</b><span>Venues</span></div>
    <div><b>3</b><span>Countries</span></div>
    <div><b>60</b><span>Games</span></div>
  </div>
</div>

<nav class="b-tabs">
  <span><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="9" rx="2"/><path d="M4 17h16M4 21h10"/></svg>Timeline</span>
  <span class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.4 3.2 14.6 0 18M12 3c-3.2 3.4-3.2 14.6 0 18"/></svg>Map</span>
  <span><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="11" r="3.5"/><path d="M9 17.5h6"/></svg>Passport</span>
  <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4.4-6 8-6s6.6 2 8 6"/></svg>You</span>
</nav>

<script src="../../../kit/vendor/d3.min.js"></script>
<script src="../../../kit/vendor/topojson-client.min.js"></script>
<script src="../../../kit/vendor/countries-110m.js"></script>
<script>
(function () {
  const W = 393, H = 470;
  const svg = d3.select('#map').attr('viewBox', `0 0 ${W} ${H}`);
  const world = window.__atlas['countries-110m'];
  const land = topojson.feature(world, world.objects.countries);
  const home = [-87.65, 41.9];
  // [lon, lat, games]
  const V = [
    [-71.097, 42.346, 1], [-88.062, 44.501, 1], [-90.193, 38.623, 1], [-87.971, 43.028, 1],
    [-93.278, 44.982, 1], [-83.049, 42.339, 1], [-81.685, 41.496, 1], [-80.006, 40.447, 1],
    [-84.507, 39.097, 1], [-73.926, 40.829, 1], [-118.24, 34.074, 1], [-122.389, 37.778, 1],
    [-94.48, 39.051, 1], [-97.641, 30.133, 1], [2.123, 41.381, 1], [-3.688, 40.453, 1], [7.452, 51.493, 1]
  ];
  const proj = d3.geoOrthographic().rotate([44, -38]).clipAngle(90);
  proj.fitExtent([[18, 40], [W - 30, H - 70]], { type: 'MultiPoint', coordinates: [[-122.4, 37.8], [7.45, 51.5], [-97.6, 30.1], [-3.7, 40.4], [-80, 55]] });
  const path = d3.geoPath(proj);

  const defs = svg.append('defs');
  const rg = defs.append('radialGradient').attr('id', 'heat');
  rg.append('stop').attr('offset', '0').attr('stop-color', '#ffb547').attr('stop-opacity', .9);
  rg.append('stop').attr('offset', '.32').attr('stop-color', '#ff8a2a').attr('stop-opacity', .38);
  rg.append('stop').attr('offset', '1').attr('stop-color', '#ff5a1a').attr('stop-opacity', 0);

  svg.append('path').datum({ type: 'Sphere' }).attr('d', path).attr('fill', '#0d0f13').attr('stroke', 'rgba(255,255,255,.08)');
  svg.append('path').datum(d3.geoGraticule10()).attr('d', path).attr('fill', 'none').attr('stroke', 'rgba(255,255,255,.03)');
  svg.append('path').datum(land).attr('d', path).attr('fill', '#171a21').attr('stroke', '#07080a').attr('stroke-width', .6);

  const [hx, hy] = proj(home);
  svg.append('circle').attr('cx', hx).attr('cy', hy).attr('r', 52).attr('fill', 'url(#heat)');

  const arcs = svg.append('g').attr('fill', 'none').attr('stroke-linecap', 'round');
  V.forEach(([lon, lat]) => {
    arcs.append('path').datum({ type: 'LineString', coordinates: [home, [lon, lat]] })
      .attr('d', path).attr('stroke', '#fff').attr('stroke-opacity', .5).attr('stroke-width', 1.1);
  });
  V.forEach(([lon, lat]) => {
    const [x, y] = proj([lon, lat]);
    svg.append('circle').attr('cx', x).attr('cy', y).attr('r', 3).attr('fill', '#fff');
  });
  svg.append('circle').attr('cx', hx).attr('cy', hy).attr('r', 6).attr('fill', '#fff');

  const lab = (lon, lat, t, dx, dy, anchor, col) => {
    const [x, y] = proj([lon, lat]);
    svg.append('text').attr('x', x + dx).attr('y', y + dy).attr('text-anchor', anchor || 'start')
      .attr('fill', col || 'rgba(255,255,255,.72)').attr('font-family', 'Barlow Condensed').attr('font-weight', 700)
      .attr('font-size', 13).attr('letter-spacing', 1.6).text(t);
  };
  lab(-87.65, 41.9, 'CHICAGO', 0, 38, 'middle', '#ffb547');
  lab(-71.097, 42.346, 'BOSTON', 8, -8, 'start');
  lab(-3.688, 40.453, 'MADRID', 0, 22, 'end');
})();
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
