<!doctype html>
<html><head><meta charset="utf-8"><title>You were there</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<link rel="stylesheet" href="../../../round2/system/broadcast.css">
<link rel="stylesheet" href="../../system/final.css">
<style>
  body.b { --b-text-3: rgba(255,255,255,.6); }
  .b-label, .f-stats span { font-size: 12px; }
  .b-body { font-size: 15px; }

  .crop { position: absolute; inset: 0; overflow: hidden; }
  .crop img { filter: contrast(1.06) saturate(.9) brightness(.92); }

  .shot { position: absolute; left: 20px; right: 20px; top: 116px; height: 276px; }
  .shot .b-lower { height: 58px; }
  .shot .b-lower .tag { font-size: 20px; padding: 0 14px; }
  .shot .b-lower .txt { display: flex; align-items: center; padding: 0 14px; }
  .shot .b-lower .txt b { font: 800 19px/1.05 var(--b-cond); letter-spacing: .2px; text-transform: uppercase; }

  .wp { position: absolute; left: 20px; right: 20px; top: 416px; height: 180px; }
  #curve { position: absolute; left: 0; top: 0; width: 353px; height: 180px; overflow: visible; }

  .plays { top: 618px; }
  .plays .f-item { gap: 14px; }
  .plays .inn { width: 34px; font: 700 16px/1 var(--b-cond); letter-spacing: .6px; color: var(--b-text-3); }
  .plays .tx { font: 400 15px/1.3 var(--b-ui); color: var(--b-text-2); white-space: nowrap; }
  .plays .end { font: 800 20px/1 var(--b-cond); font-variant-numeric: tabular-nums; color: var(--b-text-2); }
  .plays .f-item.on .tx, .plays .f-item.on .end { color: #fff; }
  .plays .f-item.on .tx { font-weight: 600; }
  .plays .f-item.on .inn { color: #000; background: #fff; border-radius: 6px; height: 26px; width: 34px; display: grid; place-items: center; }
</style></head>
<body class="phone b">

<div class="b-nav">
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="b-bug"><span class="team" style="--c:var(--cle)">CLE</span><span class="score">2</span><span class="team" style="--c:var(--chc)">CHC</span><span class="score">3</span><span class="state">FINAL</span></div>
  <div class="b-icon-btn"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
</div>

<div class="shot b-frame">
  <div class="crop" data-crop="wrigley-night.jpg 0 720 1240 1054"></div>
  <div class="b-lower">
    <div class="tag" style="--c:var(--chc)">10:43</div>
    <div class="txt"><b>40 seconds after the final out</b></div>
  </div>
</div>

<div class="wp"><svg id="curve"></svg></div>

<div class="f-col plays">
  <div class="f-list">
    <div class="f-item"><span class="inn">B4</span><span class="tx">Bryant homers. Two more score.</span><span class="end">3–1</span></div>
    <div class="f-item"><span class="inn">T7</span><span class="tx">Chapman in. Eight outs to go.</span><span class="end">3–2</span></div>
    <div class="f-item on"><span class="inn">T9</span><span class="tx">Final out. On to Game 6.</span><span class="end">3–2</span></div>
  </div>
</div>

<script>
(function () {
  const N = { 'wrigley-night.jpg': [1920, 2560], 'wrigley-night-2.jpg': [1920, 2560], 'lambeau-concourse.jpg': [1920, 1288], 'wrigley-bleachers.jpg': [1280, 853] };
  window.__crop = function (b) {
    const [src, sx, sy, sw, sh] = b.dataset.crop.split(/\s+/).map((v, i) => i ? +v : v);
    const [nw, nh] = N[src], bw = b.clientWidth, bh = b.clientHeight, s = Math.max(bw / sw, bh / sh);
    const i = document.createElement('img');
    i.src = '../../../photos/' + src;
    i.style.cssText = `position:absolute;max-width:none;width:${nw * s}px;height:${nh * s}px;left:${bw / 2 - (sx + sw / 2) * s}px;top:${bh / 2 - (sy + sh / 2) * s}px`;
    b.prepend(i);
  };

  // win-probability curve: thin line, soft area, round photo pins
  const W = 353, H = 180, top = 62, bot = 152;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('curve');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const T = m => 8 + (m / 214) * (W - 36);
  const Y = p => bot - (p / 100) * (bot - top);
  const pts = [[0,46],[14,47],[28,44],[40,36],[52,35],[64,38],[78,44],[86,71],[92,76],[104,79],[116,77],[132,74],[140,64],[148,66],[160,71],[170,78],[180,82],[192,88],[200,92],[208,96],[214,100]];
  const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; };
  el('line', { x1: 0, x2: W, y1: Y(50), y2: Y(50), stroke: 'rgba(255,255,255,.16)', 'stroke-dasharray': '2 5' });
  for (let i = 1; i <= 9; i++) {
    const x = 8 + (i - .5) / 9 * (W - 36);
    const t = el('text', { x, y: H - 4, 'text-anchor': 'middle', fill: 'rgba(255,255,255,.6)', 'font-family': 'Barlow Condensed', 'font-weight': 700, 'font-size': 13 });
    t.textContent = i;
  }
  // smooth path
  const P = pts.map(p => [T(p[0]), Y(p[1])]);
  let d = `M${P[0][0]} ${P[0][1]}`;
  for (let i = 1; i < P.length; i++) {
    const p0 = P[i - 2] || P[i - 1], p1 = P[i - 1], p2 = P[i], p3 = P[i + 1] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
  }
  const defs = el('defs', {});
  defs.innerHTML = '<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bff" stop-opacity=".26"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></linearGradient>';
  el('path', { d: d + ` L${T(214)} ${bot} L${T(0)} ${bot} Z`, fill: 'url(#f)' });
  el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });

  const at = m => { for (let i = 1; i < pts.length; i++) if (pts[i][0] >= m) { const a = pts[i - 1], b = pts[i], k = (m - a[0]) / ((b[0] - a[0]) || 1); return a[1] + (b[1] - a[1]) * k; } return 100; };
  const host = svg.parentNode;
  function pin(m, crop, big) {
    const x = T(m), y = Y(at(m)), s = big ? 40 : 28, lift = big ? 12 : 9;
    el('line', { x1: x, x2: x, y1: y, y2: y - lift, stroke: big ? '#fff' : 'rgba(255,255,255,.55)', 'stroke-width': 1.2 });
    el('circle', { cx: x, cy: y, r: big ? 4.5 : 3, fill: big ? '#fff' : '#07080a', stroke: '#fff', 'stroke-width': 1.6 });
    const p = document.createElement('div');
    p.style.cssText = `position:absolute;left:${x - s / 2}px;top:${y - lift - s}px;width:${s}px;height:${s}px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 ${big ? 2.5 : 1.5}px ${big ? '#fff' : 'rgba(255,255,255,.6)'},0 6px 16px rgba(0,0,0,.55)`;
    p.dataset.crop = crop;
    host.appendChild(p);
  }
  pin(12, 'wrigley-night-2.jpg 1080 1100 480 480');
  pin(86, 'wrigley-night.jpg 980 940 420 420');
  pin(146, 'wrigley-night-2.jpg 1000 1200 500 500');
  pin(214, 'wrigley-night.jpg 300 980 600 600', true);

  document.querySelectorAll('[data-crop]').forEach(window.__crop);
})();
</script>
<script src="../../../kit/kit.js"></script>
</body></html>
