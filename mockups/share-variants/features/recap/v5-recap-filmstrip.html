<!doctype html><html><head><meta charset="utf-8"><title>Recap film, chapter strip</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);isolation:isolate}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1.3 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.crop{position:absolute;overflow:hidden}
.abs{position:absolute}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.kick{font:800 13px/1 var(--f-cond);letter-spacing:2.2px;text-transform:uppercase}

.card{background:#0a0a0d}
.row{position:absolute;left:0;right:0;height:106px}
.th{position:absolute;left:44px;top:0;width:148px;height:106px;overflow:hidden;border-radius:3px;outline:1px solid rgba(255,255,255,.12)}
.tx{position:absolute;left:208px;right:16px;top:6px}
.tm{font:800 15px/1 var(--f-cond);letter-spacing:1.6px;color:var(--signal);text-transform:uppercase}
.sc{font:400 48px/1 var(--f-anton);margin-top:6px}
.ds{font:500 14px/1.25 var(--f-ui);color:var(--text-2);margin-top:6px}
.spr{position:absolute;left:0;top:0;bottom:0;width:36px;background:#000;background-image:radial-gradient(circle,#0a0a0d 0 4.5px,transparent 5px);background-size:36px 28px;background-position:12px 8px}
.spr.r{left:auto;right:0}

</style></head><body class="phone" data-chrome="none">
<div class="card">

<div class="abs spr" style="width:30px;background-size:30px 28px;background-position:9px 8px"></div>
<div class="abs kick" style="left:44px;top:26px;color:var(--signal)">Recap film</div>
<div class="abs" style="left:44px;top:46px;font:400 44px/1 var(--f-anton);letter-spacing:.3px">3–1 AT LUMEN</div>
<div class="row" style="top:104px"><div class="th"><div class="crop abs" style="inset:0" data-crop="soldier-aerial.jpg 300 100 700 440" data-f="saturate(.95) contrast(1.05)"></div></div><div class="tx"><div class="tm">10:40</div><div class="sc">Arrival</div><div class="ds">Flags before kickoff</div></div></div><div class="row" style="top:222px"><div class="th"><div class="crop abs" style="inset:0" data-crop="soldier-soccer.jpg 0 880 760 500" data-f="saturate(.95) contrast(1.05)"></div></div><div class="tx"><div class="tm">29’</div><div class="sc">1–0</div><div class="ds">Alajbegovic, outside the box</div></div></div><div class="row" style="top:340px"><div class="th"><div class="crop abs" style="inset:0" data-crop="soldier-soccer.jpg 400 1000 800 500" data-f="saturate(.95) contrast(1.05)"></div></div><div class="tx"><div class="tm">80’</div><div class="sc">3–1</div><div class="ds">Mahmic closes it</div></div></div><div class="row" style="top:458px"><div class="th"><div class="crop abs" style="inset:0" data-crop="camp-nou-aerial.jpg 100 300 1000 600" data-f="saturate(.95) contrast(1.05)"></div></div><div class="tx"><div class="tm">FT</div><div class="sc">3–1</div><div class="ds">The group in the stands</div></div></div>
<div class="abs" style="left:44px;right:20px;top:580px;height:1px;background:var(--line-2)"></div>
<div class="abs" style="left:44px;top:592px;display:flex;align-items:center;gap:8px;font:600 14px/1 var(--f-ui);color:rgba(255,255,255,.85)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 4.5v15l13-7.5z" fill="#fff"/></svg>1:52 &nbsp;·&nbsp; Jun 24, 2026</div>

</div>
<div class="cap">Recap film. Direction C: the game drawn as a picture. Treatment 1: dark film strip of chapters</div>
<script>
(function(){
const N={'soldier-soccer.jpg':[1280,1707],'soldier-aerial.jpg':[1280,960],'camp-nou-aerial.jpg':[1280,960]};
document.querySelectorAll('[data-crop]').forEach(b=>{
const [src,sx,sy,sw,sh]=b.dataset.crop.split(/\s+/).map((v,i)=>i?+v:v);
const [nw,nh]=N[src],bw=b.clientWidth,bh=b.clientHeight,s=Math.max(bw/sw,bh/sh);
const i=document.createElement('img');i.src='../../../photos/'+src;
i.style.cssText=`position:absolute;max-width:none;width:${nw*s}px;height:${nh*s}px;left:${bw/2-(sx+sw/2)*s}px;top:${bh/2-(sy+sh/2)*s}px;filter:${b.dataset.f||'none'}`;
b.prepend(i);});

})();
</script><script src="../../../kit/kit.js"></script></body></html>
