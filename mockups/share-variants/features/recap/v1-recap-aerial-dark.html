<!doctype html><html><head><meta charset="utf-8"><title>Recap film, photo, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);isolation:isolate}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1.3 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.crop{position:absolute;overflow:hidden}
.abs{position:absolute}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.kick{font:800 13px/1 var(--f-cond);letter-spacing:2.2px;text-transform:uppercase}

.scr{inset:0;background:linear-gradient(180deg,rgba(5,6,10,.7) 0%,rgba(5,6,10,0) 22%,rgba(5,6,10,.1) 40%,rgba(5,6,10,.82) 62%,#05060a 86%)}
.tint{inset:0;background:#1a3fa8;mix-blend-mode:soft-light;opacity:.55}
.mega{left:22px;top:318px;font:400 214px/.9 var(--f-anton);letter-spacing:-2px;color:#fff}
.mega i{font-style:normal;color:var(--signal)}
.t1{left:24px;top:528px;font:700 26px/1.05 var(--f-cond);text-transform:uppercase;letter-spacing:.4px}
.t2{left:24px;top:210px;font:500 15px/1.3 var(--f-ui);color:rgba(255,255,255,.8)}
.segs{left:24px;right:24px;top:572px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.segs b{height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
.segs b:first-child,.segs b:nth-child(2){background:#fff}
.play{left:24px;right:24px;top:586px;display:flex;align-items:center;gap:10px;margin-top:0;height:34px}

</style></head><body class="phone" data-chrome="none">
<div class="card">

<div class="crop abs" style="inset:0" data-crop="soldier-aerial.jpg 400 0 540 960" data-f="saturate(.85) contrast(1.1) brightness(.8)"></div>
<div class="abs tint"></div><div class="abs scr"></div>
<div class="abs kick" style="left:24px;top:26px;color:var(--signal)">Recap film &nbsp;·&nbsp; 1:52</div>
<div class="abs mega">3<i>–</i>1</div>
<div class="abs t1" style="top:512px">Bosnia and Herzegovina<br><span style="color:var(--text-2);font-weight:600">beat Qatar</span></div>
<div class="abs segs" style="top:586px"><b></b><b></b><b></b><b></b><b></b></div>
<div class="abs" style="left:24px;right:24px;top:598px;font:500 13px/1.2 var(--f-ui);color:rgba(255,255,255,.7)"></div>
<div class="abs" style="left:24px;top:52px;font:600 15px/1.3 var(--f-ui);color:rgba(255,255,255,.82)">Lumen Field, Seattle &nbsp;·&nbsp; Jun 24, 2026</div>

</div>
<div class="cap">Recap film. Direction A: photo hero. Treatment 1: night blue</div>
<script>
(function(){
const N={'soldier-soccer.jpg':[1280,1707],'soldier-aerial.jpg':[1280,960],'camp-nou-aerial.jpg':[1280,960]};
document.querySelectorAll('[data-crop]').forEach(b=>{
const [src,sx,sy,sw,sh]=b.dataset.crop.split(/\s+/).map((v,i)=>i?+v:v);
const [nw,nh]=N[src],bw=b.clientWidth,bh=b.clientHeight,s=Math.max(bw/sw,bh/sh);
const i=document.createElement('img');i.src='../../../photos/'+src;
i.style.cssText=`position:absolute;max-width:none;width:${nw*s}px;height:${nh*s}px;left:${bw/2-(sx+sw/2)*s}px;top:${bh/2-(sy+sh/2)*s}px;filter:${b.dataset.f||'none'}`;
b.prepend(i);});

})();
</script><script src="../../../kit/kit.js"></script></body></html>
