<!doctype html><html><head><meta charset="utf-8"><title>You were there, paper print</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);isolation:isolate}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1.3 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.crop{position:absolute;overflow:hidden}
.abs{position:absolute}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.kick{font:800 13px/1 var(--f-cond);letter-spacing:2.2px;text-transform:uppercase}

.card{background:var(--paper);color:var(--paper-ink)}
.print{left:22px;top:22px;width:309px;height:372px;background:#fff;padding:10px 10px 0;box-shadow:0 8px 20px rgba(60,40,10,.22);transform:rotate(-1.2deg)}
.ph{position:absolute;left:10px;top:10px;right:10px;bottom:10px;overflow:hidden}
.score{left:26px;top:420px;font:400 104px/.9 var(--f-anton);color:#1f4fd0;letter-spacing:-1px}
.cl{left:26px;top:528px;right:26px;font:400 28px/1.12 var(--f-serif);font-style:italic;color:var(--paper-ink)}
.ft{left:26px;right:26px;top:588px;display:flex;justify-content:space-between;font:700 13px/1 var(--f-cond);letter-spacing:1.6px;text-transform:uppercase;color:rgba(29,26,22,.62)}

</style></head><body class="phone" data-chrome="none">
<div class="card">

<div class="abs print"><div class="ph"><div class="crop abs" style="inset:0" data-crop="soldier-soccer.jpg 0 900 700 800" data-f="saturate(1.05) contrast(1.05)"></div></div></div>
<div class="abs score">2<span style="color:rgba(29,26,22,.35)">–</span>0</div>
<div class="abs" style="left:176px;top:446px;font:700 14px/1.25 var(--f-cond);letter-spacing:1.4px;text-transform:uppercase;color:rgba(29,26,22,.62)">Bosnia and Herzegovina<br>2, Qatar 0</div>
<div class="abs cl">Taken 4 minutes after the own goal.</div>
<div class="abs ft"><span>You were there</span><span>Jun 24, 2026</span></div>

</div>
<div class="cap">You were there. Direction B: your photo with the score at that instant. Treatment 2: paper print</div>
<script>
(function(){
const N={'soldier-soccer.jpg':[1280,1707],'soldier-aerial.jpg':[1280,960],'camp-nou-aerial.jpg':[1280,960]};
document.querySelectorAll('[data-crop]').forEach(b=>{
const [src,sx,sy,sw,sh]=b.dataset.crop.split(/\s+/).map((v,i)=>i?+v:v);
const [nw,nh]=N[src],bw=b.clientWidth,bh=b.clientHeight,s=Math.max(bw/sw,bh/sh);
const i=document.createElement('img');i.src='../../../photos/'+src;
i.style.cssText=`position:absolute;max-width:none;width:${nw*s}px;height:${nh*s}px;left:${bw/2-(sx+sw/2)*s}px;top:${bh/2-(sy+sh/2)*s}px;filter:${b.dataset.f||'none'}`;
b.prepend(i);});

})();
</script><script src="../../../kit/kit.js"></script></body></html>
