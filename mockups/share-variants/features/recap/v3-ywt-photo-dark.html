<!doctype html><html><head><meta charset="utf-8"><title>You were there, photo, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);isolation:isolate}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1.3 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.crop{position:absolute;overflow:hidden}
.abs{position:absolute}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.kick{font:800 13px/1 var(--f-cond);letter-spacing:2.2px;text-transform:uppercase}

.scr{inset:0;background:linear-gradient(180deg,rgba(5,6,10,.7) 0%,rgba(5,6,10,0) 20%,rgba(5,6,10,0) 48%,rgba(5,6,10,.85) 72%,#05060a 100%)}
.num{left:20px;top:392px;font:400 150px/.9 var(--f-anton);color:#fff;letter-spacing:-1px}
.num i{font-style:normal;color:var(--signal)}

</style></head><body class="phone" data-chrome="none">
<div class="card">

<div class="crop abs" style="inset:0" data-crop="soldier-soccer.jpg 0 880 760 1350" data-f="saturate(1.05) contrast(1.08) brightness(.9)"></div>
<div class="abs scr"></div>
<div class="abs kick" style="left:24px;top:26px;color:var(--signal)">You were there</div>
<div class="abs" style="right:24px;top:24px;height:24px;padding:0 10px;border-radius:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);font:800 15px/24px var(--f-cond);letter-spacing:.8px">12:47 PM</div>
<div class="abs num">1<i>–</i>0</div>
<div class="abs" style="left:24px;top:540px;font:800 25px/1.05 var(--f-cond);text-transform:uppercase;letter-spacing:.3px">29’ &nbsp;Alajbegovic scores<br><span style="color:var(--text-2);font-weight:600">You shot this 2 minutes later</span></div>
<div class="abs" style="left:24px;top:360px;font:600 15px/1.3 var(--f-ui);color:rgba(255,255,255,.8)">Bosnia and Herzegovina v Qatar &nbsp;·&nbsp; 31’</div>

</div>
<div class="cap">You were there. Direction B: your photo with the score at that instant. Treatment 1: dark</div>
<script>
(function(){
const N={'soldier-soccer.jpg':[1280,1707],'soldier-aerial.jpg':[1280,960],'camp-nou-aerial.jpg':[1280,960]};
document.querySelectorAll('[data-crop]').forEach(b=>{
const [src,sx,sy,sw,sh]=b.dataset.crop.split(/\s+/).map((v,i)=>i?+v:v);
const [nw,nh]=N[src],bw=b.clientWidth,bh=b.clientHeight,s=Math.max(bw/sw,bh/sh);
const i=document.createElement('img');i.src='../../../photos/'+src;
i.style.cssText=`position:absolute;max-width:none;width:${nw*s}px;height:${nh*s}px;left:${bw/2-(sx+sw/2)*s}px;top:${bh/2-(sy+sh/2)*s}px;filter:${b.dataset.f||'none'}`;
b.prepend(i);});

})();
</script><script src="../../../kit/kit.js"></script></body></html>
