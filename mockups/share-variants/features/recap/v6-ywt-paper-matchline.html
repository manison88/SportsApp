<!doctype html><html><head><meta charset="utf-8"><title>You were there, match line</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);isolation:isolate}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1.3 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.crop{position:absolute;overflow:hidden}
.abs{position:absolute}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.kick{font:800 13px/1 var(--f-cond);letter-spacing:2.2px;text-transform:uppercase}

.card{background:var(--paper);color:var(--paper-ink)}
.ph{left:22px;top:22px;width:309px;height:300px;border-radius:6px;overflow:hidden}
.k{font:700 13px/1 var(--f-cond);letter-spacing:1.5px;text-transform:uppercase;color:rgba(29,26,22,.6)}

</style></head><body class="phone" data-chrome="none">
<div class="card">

<div class="crop abs ph" data-crop="soldier-soccer.jpg 0 900 760 740" data-f="saturate(1.05) contrast(1.05)"></div>
<div class="abs" style="left:34px;top:34px;height:26px;padding:0 10px;border-radius:5px;background:var(--paper-ink);color:#fff;font:800 15px/26px var(--f-cond);letter-spacing:1px">YOU WERE THERE</div>
<div class="abs" style="left:22px;top:340px;font:400 112px/.9 var(--f-anton);color:#1f4fd0;letter-spacing:-1px">1<span style="color:rgba(29,26,22,.3)">–</span>0</div>
<div class="abs" style="left:196px;top:356px;right:22px;font:400 23px/1.15 var(--f-serif);font-style:italic">2 minutes after Alajbegovic scored</div>
<svg class="abs" style="left:0;top:470px" width="353" height="158" viewBox="0 0 353 158" id="ln"></svg>

</div>
<div class="cap">You were there. Direction C: the game drawn as a picture. Treatment 2: paper, 104 photos on the match clock</div>
<script>
(function(){
const N={'soldier-soccer.jpg':[1280,1707],'soldier-aerial.jpg':[1280,960],'camp-nou-aerial.jpg':[1280,960]};
document.querySelectorAll('[data-crop]').forEach(b=>{
const [src,sx,sy,sw,sh]=b.dataset.crop.split(/\s+/).map((v,i)=>i?+v:v);
const [nw,nh]=N[src],bw=b.clientWidth,bh=b.clientHeight,s=Math.max(bw/sw,bh/sh);
const i=document.createElement('img');i.src='../../../photos/'+src;
i.style.cssText=`position:absolute;max-width:none;width:${nw*s}px;height:${nh*s}px;left:${bw/2-(sx+sw/2)*s}px;top:${bh/2-(sy+sh/2)*s}px;filter:${b.dataset.f||'none'}`;
b.prepend(i);});

const NS='http://www.w3.org/2000/svg',s=document.getElementById('ln');
const e=(n,a,t)=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);if(t)x.textContent=t;s.appendChild(x);return x};
const X0=22,X1=331,T0=640,T1=875; // minutes of day: 10:40 .. 14:35
const X=m=>X0+(m-T0)/(T1-T0)*(X1-X0);
const ky=720,full=835;
e('rect',{x:X(ky),y:50,width:X(full)-X(ky),height:44,fill:'rgba(31,79,208,.1)'});
e('line',{x1:X0,x2:X1,y1:94,y2:94,stroke:'#1d1a16','stroke-width':1.5});
let r=7;const R=()=>{r=(r*16807)%2147483647;return r/2147483647};
const put=(a,b,n)=>{for(let i=0;i<n;i++){const m=a+R()*(b-a);const h=8+R()*18;e('line',{x1:X(m),x2:X(m),y1:94,y2:94-h,stroke:'rgba(29,26,22,.5)','stroke-width':1.4,'stroke-linecap':'round'})}};
put(T0+2,ky-2,35);put(ky,full,38);put(full+3,T1,31);
// goals: 29' 34' 42' 80' (kickoff 12:00 = 720 min; second half offset)
const g=[[749,'1–0'],[754,'2–0'],[762,'2–1'],[815,'3–1']];
g.forEach(([m,t],i)=>{e('circle',{cx:X(m),cy:94,r:i==0?6:4.2,fill:i==0?'#1f4fd0':'#1d1a16',stroke:'#f3ece0','stroke-width':2})});
e('text',{x:X(749),y:126,'text-anchor':'middle','font-family':'Barlow Condensed','font-weight':800,'font-size':14,fill:'#1f4fd0'},"29’");
e('text',{x:X(815),y:126,'text-anchor':'middle','font-family':'Barlow Condensed','font-weight':800,'font-size':14,fill:'#1d1a16'},"80’");
e('text',{x:X0,y:146,'font-family':'Barlow Condensed','font-weight':700,'font-size':13,fill:'rgba(29,26,22,.6)'},'10:40 ARRIVAL');
e('text',{x:X1,y:146,'text-anchor':'end','font-family':'Barlow Condensed','font-weight':700,'font-size':13,fill:'rgba(29,26,22,.6)'},'14:35 LEAVING');
e('text',{x:X0,y:34,'font-family':'Barlow Condensed','font-weight':800,'font-size':15,fill:'#1d1a16','letter-spacing':1},'104 PHOTOS, 38 DURING PLAY');

})();
</script><script src="../../../kit/kit.js"></script></body></html>
