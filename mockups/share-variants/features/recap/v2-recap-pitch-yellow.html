<!doctype html><html><head><meta charset="utf-8"><title>Recap film, photo, yellow</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);isolation:isolate}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1.3 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.crop{position:absolute;overflow:hidden}
.abs{position:absolute}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.kick{font:800 13px/1 var(--f-cond);letter-spacing:2.2px;text-transform:uppercase}

.scr{inset:0;background:linear-gradient(180deg,rgba(0,12,50,.55) 0%,rgba(0,12,50,0) 30%,rgba(0,12,50,.15) 45%,rgba(4,16,60,.88) 74%,#041040 100%)}
.ring{left:50%;top:210px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.8);display:grid;place-items:center;backdrop-filter:blur(6px)}
.big{left:24px;right:24px;top:384px;font:400 54px/1.02 var(--f-anton);text-transform:uppercase;color:#fff;letter-spacing:.2px}
.big em{font-style:normal;color:#F4E04D}

</style></head><body class="phone" data-chrome="none">
<div class="card">

<div class="crop abs" style="inset:0" data-crop="soldier-soccer.jpg 0 880 760 1350" data-f="saturate(1.15) contrast(1.05) brightness(.95)"></div>
<div class="abs scr"></div>
<div class="abs kick" style="left:24px;top:26px;color:#F4E04D">Recap film</div>
<div class="abs kick" style="right:24px;top:26px;color:rgba(255,255,255,.85)">1:52</div>
<div class="abs ring"><svg viewBox="0 0 24 24" width="38" height="38"><path d="M7 4.5v15l13-7.5z" fill="#fff"/></svg></div>
<div class="abs big">Three goals.<br><em>One group</em><br>in the stands.</div>
<div class="abs" style="left:24px;right:24px;top:560px;font:600 15px/1.35 var(--f-ui);color:rgba(255,255,255,.82)">Bosnia and Herzegovina 3, Qatar 1<br><span style="color:rgba(255,255,255,.6);font-weight:500">Lumen Field &nbsp;·&nbsp; Jun 24, 2026</span></div>

</div>
<div class="cap">Recap film. Direction A: photo hero. Treatment 2: pitch level, play ring, yellow</div>
<script>
(function(){
const N={'soldier-soccer.jpg':[1280,1707],'soldier-aerial.jpg':[1280,960],'camp-nou-aerial.jpg':[1280,960]};
document.querySelectorAll('[data-crop]').forEach(b=>{
const [src,sx,sy,sw,sh]=b.dataset.crop.split(/\s+/).map((v,i)=>i?+v:v);
const [nw,nh]=N[src],bw=b.clientWidth,bh=b.clientHeight,s=Math.max(bw/sw,bh/sh);
const i=document.createElement('img');i.src='../../../photos/'+src;
i.style.cssText=`position:absolute;max-width:none;width:${nw*s}px;height:${nh*s}px;left:${bw/2-(sx+sw/2)*s}px;top:${bh/2-(sy+sh/2)*s}px;filter:${b.dataset.f||'none'}`;
b.prepend(i);});

})();
</script><script src="../../../kit/kit.js"></script></body></html>
