<!doctype html>
<html><head><meta charset="utf-8"><title>Locker plaque, two sports, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0}
body.phone{background:var(--ink);display:block}
.stage{position:absolute;left:0;top:0;width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}
.cap{font:500 12px var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.card *{box-sizing:border-box}
.abs{position:absolute}
.k{font:700 12px var(--f-ui);letter-spacing:1.8px;text-transform:uppercase}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.card{background:radial-gradient(120% 80% at 50% 0%,#1b1410,#050506 70%);color:var(--text)}
.pl{left:20px;right:20px;top:52px;bottom:52px;border-radius:10px;background:linear-gradient(145deg,#f1c77c,#c98a2b 45%,#e8b865 70%,#b97a22);box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.25),inset 0 0 0 7px rgba(60,35,5,.25);color:#2a1904}
.scr{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3d0,#7a4a0b)}
.k{left:0;right:0;top:34px;text-align:center;color:#5a3507}
.nm{left:0;right:0;top:56px;text-align:center;font-size:50px;line-height:1;font-weight:800}
.rec{left:0;right:0;top:118px;text-align:center;font:800 150px/.85 var(--f-cond);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.lab{left:0;right:0;top:262px;text-align:center;font:700 13px var(--f-ui);letter-spacing:1.8px;text-transform:uppercase;color:#5a3507}
.rows{left:24px;right:24px;top:300px}
.r{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:2px solid rgba(60,35,5,.35)}
.r b{font:800 32px var(--f-cond);text-transform:uppercase;letter-spacing:.4px}
.r span{display:block;font:700 14px var(--f-ui);letter-spacing:.3px}
.r em{font:800 52px var(--f-cond);font-style:normal}
.dt{left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;font:800 17px var(--f-cond);text-transform:uppercase;letter-spacing:.4px;border-top:2px solid rgba(60,35,5,.35);padding-top:12px}
</style></head>
<body class="phone" data-chrome="none" data-homebar="none">
<div class="stage"><div class="card"><div class="abs pl">
<i class="abs scr" style="left:12px;top:12px"></i><i class="abs scr" style="right:12px;top:12px"></i><i class="abs scr" style="left:12px;bottom:12px"></i><i class="abs scr" style="right:12px;bottom:12px"></i>
<div class="abs k">Your record at</div><div class="abs c nm">United Center</div>
<div class="abs rec">8–3</div><div class="abs lab">11 games · two sports</div>
<div class="abs rows">
<div class="r"><div><b>Basketball</b><span>Section 118 · 5 nights</span></div><em>4–1</em></div>
<div class="r"><div><b>Hockey</b><span>Section 205 · 6 nights</span></div><em>4–2</em></div>
</div>
<div class="abs dt" style="bottom:22px"><span>Mar 22, 2014</span><span>Feb 15, 2026</span></div>
</div></div><div class="cap">Locker plaque · dark brass · basketball + hockey</div></div>

<script src="../../../kit/kit.js"></script>
</body></html>
