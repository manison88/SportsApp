<!doctype html>
<html><head><meta charset="utf-8"><title>Soldier Field, photo hero, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0}
body.phone{background:var(--ink);display:block}
.stage{position:absolute;left:0;top:0;width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}
.cap{font:500 12px var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.card *{box-sizing:border-box}
.abs{position:absolute}
.k{font:700 12px var(--f-ui);letter-spacing:1.8px;text-transform:uppercase}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.card{background:var(--ink);color:var(--text)}
.ph{left:0;right:0;top:0;height:470px}
.ph img{width:100%;height:100%;object-fit:cover;object-position:38% 50%;filter:saturate(.8) contrast(1.05) brightness(.82)}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,5,6,.55),rgba(5,5,6,0) 28%,rgba(5,5,6,.1) 50%,var(--ink) 98%)}
.t{left:22px;top:22px;color:var(--signal)}
.nm{left:22px;top:46px;font-size:58px;line-height:.92;color:#fff;font-weight:800}
.rec{left:18px;top:318px;display:flex;align-items:flex-end;gap:12px}
.rec b{font:800 148px/.8 var(--f-cond);color:var(--signal);letter-spacing:-1px}
.rec span{font:700 17px/1.15 var(--f-ui);padding-bottom:8px;color:var(--text);}
.rec span i{display:block;font-style:normal;font-weight:500;color:var(--text-2)}
.row{left:22px;right:22px;top:480px;display:flex;gap:10px;align-items:baseline;font:700 22px var(--f-cond);text-transform:uppercase;letter-spacing:.6px}
.row em{font-style:normal;color:var(--text-2);font-weight:600;font-size:17px}
.ft{left:22px;right:22px;bottom:22px;display:flex;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:14px}
.ft b{display:block;font:800 22px var(--f-cond);text-transform:uppercase;letter-spacing:.3px}
.ft span{font:500 12px var(--f-ui);color:var(--text-2)}
</style></head>
<body class="phone" data-chrome="none" data-homebar="none">
<div class="stage"><div class="card"><div class="abs ph"><img src="../../../photos/soldier-skyline.jpg"></div>
<div class="abs k t">Your record at</div>
<div class="abs c nm">Soldier<br>Field</div>
<div class="abs rec"><b>6–3</b><span>Bears<i>9 games</i></span></div>
<div class="abs row">Soccer 2–1–1 <em>· 4 games</em></div>
<div class="abs ft"><div><b>Nov 16, 2014</b><span>First visit</span></div><div style="text-align:right"><b>Nov 2, 2025</b><span>Last visit</span></div></div></div><div class="cap">Photo hero · dark · football + soccer</div></div>

<script src="../../../kit/kit.js"></script>
</body></html>
