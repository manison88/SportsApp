.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}

.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.card{background:var(--paper-2);color:var(--paper-ink)}
.tk{left:22px;right:22px;top:40px;bottom:40px;background:var(--paper);border-radius:8px;box-shadow:0 8px 24px rgba(40,30,15,.25);overflow:hidden}

.perf{left:-8px;right:-8px;top:420px;border-top:2px dashed rgba(29,26,22,.35)}
.perf:before,.perf:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper-2)}

.st{left:20px;right:20px;top:440px;display:flex;justify-content:space-between}

.st span{font:600 12px var(--f-ui);letter-spacing:1.2px;text-transform:uppercase;color:rgba(29,26,22,.6)}
.dt{left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;font:italic 400 16px var(--f-serif)}
