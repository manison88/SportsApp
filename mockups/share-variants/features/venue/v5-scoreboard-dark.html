<!doctype html>
<html><head><meta charset="utf-8"><title>Scoreboard poster, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0}
body.phone{background:var(--ink);display:block}
.stage{position:absolute;left:0;top:0;width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}
.cap{font:500 12px var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.card *{box-sizing:border-box}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
 
.card{background:#07070a}
.t{position:absolute;left:24px;top:28px}
.t .k{font:600 12px var(--f-ui);letter-spacing:1.6px;text-transform:uppercase;color:var(--signal)}
.t .n{font-size:44px;line-height:1;color:#fff;margin-top:4px}
.board{position:absolute;left:14px;right:14px;top:120px;height:390px;background:#16382c;border-radius:6px;border:4px solid #0c2219;box-shadow:inset 0 0 40px rgba(0,0,0,.45);padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.board .hd{display:flex;justify-content:space-between;font:800 15px var(--f-cond);letter-spacing:2px;color:rgba(255,255,255,.85);text-transform:uppercase}
.rw{flex:1;display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(255,255,255,.75);padding-top:6px}
.rw .l{font:800 24px var(--f-cond);letter-spacing:1px;color:#fff;text-transform:uppercase}
.rw .v{font:800 118px/.9 var(--f-cond);color:#fff}
.rw.w .v{color:#ffd9a0}
.rw.sm{flex:.5}.rw.sm .v{font-size:44px}
.foot{position:absolute;left:24px;right:24px;bottom:30px;display:flex;justify-content:space-between}
.foot b{display:block;font:800 26px var(--f-cond);color:#fff;text-transform:uppercase}
.foot span{font:500 12px var(--f-ui);color:var(--text-2)}

</style></head>
<body class="phone" data-chrome="none" data-homebar="none">
<div class="stage"><div class="card"><div class="t"><div class="k">Your record at</div><div class="n cond">Wrigley Field</div></div>
<div class="board"><div class="rw w"><span class="l">Wins</span><span class="v">11</span></div>
<div class="rw"><span class="l">Losses</span><span class="v">6</span></div>
<div class="rw sm"><span class="l">Nights</span><span class="v">11</span></div>
<div class="rw sm"><span class="l">Section</span><span class="v">314</span></div></div>
<div class="foot"><div><b>Jun 14, 2014</b><span>First visit</span></div><div style="text-align:right"><b>Jul 4, 2026</b><span>Last visit</span></div></div></div><div class="cap">Scoreboard · dark, green board</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script></script>
<script src="../../../kit/kit.js"></script>
</body></html>
