<!doctype html>
<html><head><meta charset="utf-8"><title>Seat map, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0}
body.phone{background:var(--ink);display:block}
.stage{position:absolute;left:0;top:0;width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}
.cap{font:500 12px var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.card *{box-sizing:border-box}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
 
#m{position:absolute;left:0;top:92px;width:353px;height:340px}
.card{background:radial-gradient(120% 70% at 50% 40%,#17130d 0%,#07070a 70%)}
.t{position:absolute;left:24px;top:28px}
.t .k{font:600 12px var(--f-ui);letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3)}
.t .n{font-size:40px;line-height:1;color:#fff;margin-top:4px}
.big{position:absolute;left:24px;bottom:78px;font-size:128px;line-height:.82;color:var(--signal)}
.big i{font-style:normal;color:#fff}
.side{position:absolute;right:24px;bottom:84px;text-align:right}
.side b{display:block;font:800 26px var(--f-cond);color:#fff;text-transform:uppercase}
.side span{font:500 12px var(--f-ui);color:var(--text-2)}
.foot{position:absolute;left:24px;right:24px;bottom:26px;display:flex;justify-content:space-between;font:500 12px var(--f-ui);color:var(--text-2)}

</style></head>
<body class="phone" data-chrome="none" data-homebar="none">
<div class="stage"><div class="card"><svg id="m"></svg>
<div class="t"><div class="k">Your seats at</div><div class="n cond">Wrigley Field</div></div>
<div class="big cond">11<i>–</i>6</div>
<div class="side"><b>Section 314</b><span>11 nights</span></div>
<div class="foot"><span>First · Jun 14, 2014</span><span>Last · Jul 4, 2026</span></div></div><div class="cap">Seat map · dark, 314 lit</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script>
function seatMap(sel,o){
  const svg=d3.select(sel).attr('viewBox',o.vb);
  const g=svg.append('g');
  const rad=d=>d*Math.PI/180, arc=d3.arc(), S2=Math.SQRT1_2;
  g.append('path').attr('d',arc({innerRadius:0,outerRadius:132,startAngle:rad(-45),endAngle:rad(45)})).attr('fill',o.field);
  g.append('path').attr('d',`M0 0 L${132*S2} ${-132*S2} M0 0 L${-132*S2} ${-132*S2}`).attr('stroke',o.line).attr('stroke-width',1.2).attr('fill','none');
  const b=30;
  g.append('path').attr('d',`M0 0 L${b*S2} ${-b*S2} L0 ${-b*Math.SQRT2} L${-b*S2} ${-b*S2} Z`).attr('fill','none').attr('stroke',o.line).attr('stroke-width',1.2);
  const S=[];
  const ring=(a0,a1,r0,r1,ids)=>{const st=(a1-a0)/ids.length;ids.forEach((id,i)=>S.push({a0:a0+i*st,a1:a0+(i+1)*st,r0,r1,id}));};
  ring(-44,44,142,172,['301','303','306','309','314','316','318']);
  ring(52,118,46,74,['104','107','112','115']);
  ring(-118,-52,46,74,['133','130','127','124']);
  ring(52,118,82,106,['203','206','209','213']);
  ring(-118,-52,82,106,['236','233','230','227']);
  const lit=o.lit||{'314':1,'209':.55,'112':.35};
  g.selectAll('path.s').data(S).enter().append('path')
    .attr('d',d=>arc.padAngle(rad(1.6))({innerRadius:d.r0,outerRadius:d.r1,startAngle:rad(d.a0),endAngle:rad(d.a1)}))
    .attr('fill',d=>lit[d.id]?o.on.replace('A',lit[d.id]):o.off)
    .attr('style',d=>d.id==='314'&&o.glow?`filter:drop-shadow(0 0 ${o.glow}px rgba(255,181,71,.9))`:'');
  const mid=d=>{const a=rad((d.a0+d.a1)/2),r=(d.r0+d.r1)/2;return[Math.sin(a)*r,-Math.cos(a)*r];};
  (o.labels||['314']).forEach(id=>{const d=S.find(s=>s.id===id);const[x,y]=mid(d);
    g.append('text').attr('x',x).attr('y',y+(id==='314'?7:5)).attr('text-anchor','middle').attr('fill',o.lab).attr('font-family','Barlow Condensed').attr('font-weight',800).attr('font-size',id==='314'?20:15).text(id);});
  if(o.mound) g.append('circle').attr('r',3).attr('cy',-18).attr('fill',o.line);
}
seatMap('#m',{vb:'-178 -205 356 345',field:'rgba(255,255,255,.04)',line:'rgba(255,255,255,.2)',on:'rgba(255,181,71,A)',off:'rgba(255,255,255,.09)',lab:'#000',glow:14,mound:1});</script>
<script src="../../../kit/kit.js"></script>
</body></html>
