<!doctype html>
<html><head><meta charset="utf-8"><title>Photo hero, golden hour</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0}
body.phone{background:var(--ink);display:block}
.stage{position:absolute;left:0;top:0;width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}
.cap{font:500 12px var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.card *{box-sizing:border-box}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}

.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:14% 50%;filter:contrast(1.06) saturate(.95) brightness(.88)}
.card .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.1) 0%,rgba(5,5,6,0) 35%,rgba(5,5,6,.55) 58%,rgba(5,5,6,.95) 82%)}
.t{position:absolute;left:24px;top:28px;font:600 12px var(--f-ui);letter-spacing:1.6px;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.nm{position:absolute;left:22px;right:20px;bottom:150px;font-size:92px;line-height:.9;color:#fff;font-family:var(--f-anton);font-weight:400;text-transform:uppercase}
.nm em{font-style:normal;color:var(--signal)}
.row{position:absolute;left:24px;right:24px;bottom:28px;display:flex;gap:26px;align-items:flex-end}
.row .r{font-size:76px;line-height:.85;color:var(--signal)}
.row .s{font:500 12px/1.4 var(--f-ui);color:var(--text-2);padding-bottom:4px}
.row .s b{display:block;font:800 22px var(--f-cond);color:#fff;text-transform:uppercase;letter-spacing:.3px}

</style></head>
<body class="phone" data-chrome="none" data-homebar="none">
<div class="stage"><div class="card"><img src="../../../photos/wrigley-bleachers.jpg"><div class="sh"></div>
<div class="t">11 nights in the 314</div>
<div class="nm">Wrigley<br><em>Field</em></div>
<div class="row"><div class="r cond" style="white-space:nowrap">11–6</div><div class="s"><b>Your record</b>Since Jun 14, 2014</div></div></div><div class="cap">Photo hero · golden hour, name as hero</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script></script>
<script src="../../../kit/kit.js"></script>
</body></html>
