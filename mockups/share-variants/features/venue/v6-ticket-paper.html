<!doctype html>
<html><head><meta charset="utf-8"><title>Ticket stub, paper</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0}
body.phone{background:var(--ink);display:block}
.stage{position:absolute;left:0;top:0;width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);flex:none}
.cap{font:500 12px var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.card *{box-sizing:border-box}
.cond{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
 
.card{background:var(--paper-2);color:var(--paper-ink)}
.tk{position:absolute;left:22px;right:22px;top:48px;bottom:48px;background:var(--paper);border-radius:8px;box-shadow:0 8px 24px rgba(40,30,15,.25);overflow:hidden}
.ph{position:absolute;left:0;right:0;top:0;height:150px}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;filter:sepia(.25) contrast(1.05)}
.ph:after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--paper))}
.nm{position:absolute;left:20px;top:184px;font:400 44px/1 var(--f-serif)}
.k{position:absolute;left:20px;top:164px;font:700 12px var(--f-ui);letter-spacing:1.8px;text-transform:uppercase;color:#7a4a0b;z-index:2}
.rec{position:absolute;left:20px;top:240px;font:800 120px/.85 var(--f-cond);color:var(--paper-ink)}
.rec i{font-style:normal;color:#c9791a}
.perf{position:absolute;left:-8px;right:-8px;top:372px;border-top:2px dashed rgba(29,26,22,.35)}
.perf:before,.perf:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper-2)}
.perf:before{left:0}.perf:after{right:0}
.st{position:absolute;left:20px;right:20px;top:396px;display:flex;justify-content:space-between}
.st b{display:block;font:800 52px/1 var(--f-cond);color:var(--paper-ink)}
.st span{font:600 12px var(--f-ui);letter-spacing:1.2px;text-transform:uppercase;color:rgba(29,26,22,.6)}
.dt{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:space-between;font:italic 400 16px var(--f-serif)}

</style></head>
<body class="phone" data-chrome="none" data-homebar="none">
<div class="stage"><div class="card"><div class="tk"><div class="ph"><img src="../../../photos/wrigley-scoreboard-wide.jpg"></div>
<div class="k">Your record</div><div class="nm">Wrigley Field</div>
<div class="rec">11<i>–</i>6</div>
<div class="perf"></div>
<div class="st"><div><b>314</b><span>Usual section</span></div><div style="text-align:right"><b>11</b><span>Nights</span></div></div>
<div class="dt"><span>First, Jun 14, 2014</span><span>Last, Jul 4, 2026</span></div></div></div><div class="cap">Ticket stub · paper keepsake</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script></script>
<script src="../../../kit/kit.js"></script>
</body></html>
