<!doctype html>
<html><head><meta charset="utf-8"><title>Photo postcard, paper</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body{background:#07080a;color:#fff;font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);color:rgba(245,241,234,.42);letter-spacing:.2px}
.abs{position:absolute}
.cond{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}

.card{background:#f3ece0}
.tex{inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 60%);}
.print{left:30px;top:44px;width:293px;height:290px;background:#fff;padding:12px 12px 12px;box-shadow:0 8px 22px rgba(60,40,10,.28);transform:rotate(-2.2deg)}
.print img{width:100%;height:100%;object-fit:cover;object-position:46% 82%;filter:saturate(.9) sepia(.12)}
.tape{left:130px;top:34px;width:90px;height:26px;background:rgba(255,220,140,.7);transform:rotate(3deg)}
.hand{left:28px;top:356px;font:600 46px/.9 var(--f-hand);color:#1b1712;transform:rotate(-1.5deg)}
.sub{left:30px;top:458px;font:500 12px/1 var(--f-mono);letter-spacing:1.4px;text-transform:uppercase;color:rgba(27,23,18,.6)}
.list{left:30px;right:30px;bottom:26px;border-top:1.5px solid #1b1712;color:#1b1712}
.list div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(27,23,18,.2);font:400 24px/1 var(--f-dm)}
.list span{font:500 13px/1 var(--f-mono);color:rgba(27,23,18,.6);letter-spacing:.5px}
.stamp{right:24px;top:350px;width:80px;height:80px;border-radius:50%;border:2.5px solid #d97a00;color:#d97a00;display:grid;place-items:center;text-align:center;font:800 15px/1.05 "Barlow Condensed";letter-spacing:1.6px;text-transform:uppercase;transform:rotate(10deg)}
.stamp b{display:block;font:800 30px/.9 "Barlow Condensed"}

</style></head>
<body data-chrome="none">
<div class="stage"><div class="card" id="card">
<div class="abs tex"></div>
<div class="abs print"><img src="../../../photos/camp-nou-aerial.jpg"></div><div class="abs tape"></div>
<div class="abs hand">Spain, before<br>the quiet</div>
<div class="abs stamp"><div><b>2</b>games<br>12 days</div></div>
<div class="abs sub">Feb 20 – Mar 2, 2020 · 9,000 mi</div>
<div class="abs list"><div>Camp Nou<span>Feb 22 · 5–0</span></div><div style="border-bottom:0">Bernabéu<span>Mar 1 · 2–0</span></div></div>
</div><div class="cap">Photo keepsake, paper print</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script src="../../../kit/vendor/topojson-client.min.js"></script>
<script src="../../../kit/vendor/countries-110m.js"></script>
<script>

</script>
<script src="../../../kit/kit.js"></script>
</body></html>
