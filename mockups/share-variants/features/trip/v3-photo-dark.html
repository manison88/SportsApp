<!doctype html>
<html><head><meta charset="utf-8"><title>Photo hero, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body{background:#07080a;color:#fff;font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);color:rgba(245,241,234,.42);letter-spacing:.2px}
.abs{position:absolute}
.cond{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}

.photo{left:0;top:0;width:353px;height:628px;object-fit:cover;object-position:46% 82%;filter:saturate(.75) contrast(1.08) brightness(.8)}
.scrim{inset:0;background:linear-gradient(180deg,rgba(7,8,10,.65) 0%,rgba(7,8,10,0) 24%,rgba(7,8,10,.55) 45%,rgba(7,8,10,.92) 74%,#07080a 100%)}
.eyebrow{left:22px;top:22px;font:700 14px/1 "Barlow Condensed";letter-spacing:2.6px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.big{left:20px;top:262px;font:800 170px/.8 "Barlow Condensed";letter-spacing:-3px;text-transform:uppercase}
.sub{left:100px;top:268px;font:800 32px/1.08 "Barlow Condensed";letter-spacing:1.4px;text-transform:uppercase;color:#ffb547}
.rows{left:22px;right:22px;bottom:96px}
.row{display:flex;align-items:baseline;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}
.row b{font:800 26px/1 "Barlow Condensed";letter-spacing:.8px;text-transform:uppercase}
.row i{font:700 26px/1 "Barlow Condensed";font-style:normal;font-variant-numeric:tabular-nums}
.row span{font:600 13px/1 var(--f-ui);color:rgba(255,255,255,.65);margin-left:10px}
.quote{left:22px;right:22px;bottom:30px;font:600 26px/1 var(--f-hand);color:rgba(255,255,255,.88)}

</style></head>
<body data-chrome="none">
<div class="stage"><div class="card" id="card">
<img class="abs photo" src="../../../photos/camp-nou-aerial.jpg">
<div class="abs scrim"></div>
<div class="abs eyebrow">Feb 20 – Mar 2, 2020</div>
<div class="abs big">2</div>
<div class="abs sub">Games<br>12 days<br>9,000 miles</div>
<div class="abs rows">
<div class="row"><div><b>Camp Nou</b><span>Feb 22</span></div><i>5–0</i></div>
<div class="row"><div><b>Bernabéu</b><span>Mar 1</span></div><i>2–0</i></div></div>
<div class="abs quote">“the last game before the world went quiet.”</div>
</div><div class="cap">Photo hero, dark grade</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script src="../../../kit/vendor/topojson-client.min.js"></script>
<script src="../../../kit/vendor/countries-110m.js"></script>
<script>

</script>
<script src="../../../kit/kit.js"></script>
</body></html>
