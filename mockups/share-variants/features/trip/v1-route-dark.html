<!doctype html>
<html><head><meta charset="utf-8"><title>Route map, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body{background:#07080a;color:#fff;font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);color:rgba(245,241,234,.42);letter-spacing:.2px}
.abs{position:absolute}
.cond{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}

.eyebrow{left:22px;top:22px;font:700 14px/1 "Barlow Condensed";letter-spacing:2.6px;text-transform:uppercase;color:rgba(255,255,255,.7)}
.fade{left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(10,12,16,0),#0a0c10 52%)}
.big{left:20px;bottom:128px;font:800 124px/.8 "Barlow Condensed";letter-spacing:-2px;text-transform:uppercase}
.dates{left:22px;bottom:100px;font:700 16px/1 "Barlow Condensed";letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.7)}
.stats{left:22px;right:22px;bottom:24px;display:flex}
.stats div{flex:1}.stats div+div{padding-left:16px;box-shadow:inset 1px 0 0 rgba(255,255,255,.12)}
.stats b{display:block;font:800 34px/1 "Barlow Condensed"}
.stats span{display:block;margin-top:6px;font:700 12px/1 "Barlow Condensed";letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.55)}

</style></head>
<body data-chrome="none">
<div class="stage"><div class="card" id="card">
<svg id="map" class="abs" style="left:0;top:0" width="353" height="628" viewBox="0 0 353 628"></svg>
<div class="abs fade"></div>
<div class="abs eyebrow">Road trip · Chicago to Spain and back</div>
<div class="abs big">Spain</div><div class="abs dates">Feb 20 – Mar 2, 2020</div>
<div class="abs stats"><div><b>2</b><span>Games</span></div><div><b>12</b><span>Days</span></div><div><b>9,000</b><span>Miles</span></div></div>
</div><div class="cap">Route map, dark ink</div></div>
<script src="../../../kit/vendor/d3.min.js"></script>
<script src="../../../kit/vendor/topojson-client.min.js"></script>
<script src="../../../kit/vendor/countries-110m.js"></script>
<script>

const topo=window.__atlas['countries-110m'];
const all=topojson.feature(topo,topo.objects.countries).features;
const spain=all.find(f=>f.properties&&f.properties.name==='Spain');
const proj=d3.geoMercator().center([-1.6,40.4]).scale(2000).translate([176,235]);
const path=d3.geoPath(proj);
const svg=d3.select('#map');
const P={"sea": "#0a0c10", "grat": "rgba(255,255,255,.05)", "spain": "#222836", "other": "#13161d", "coast": "#07080a", "flight": "rgba(255,255,255,.4)", "route": "#ffb547", "stop": "#fff", "t1": "#fff", "t2": "rgba(255,255,255,.7)"};
svg.append('rect').attr('width',353).attr('height',628).attr('fill',P.sea);
const grat=d3.geoGraticule().step([2,2]);
svg.append('path').attr('d',path(grat())).attr('fill','none').attr('stroke',P.grat).attr('stroke-width',.7);
svg.append('g').selectAll('path').data(all).join('path').attr('d',path)
  .attr('fill',d=>d===spain?P.spain:P.other).attr('stroke',P.coast).attr('stroke-width',d=>d===spain?1.4:1);
const b=proj([2.17,41.39]),v=proj([-0.38,39.47]),m=proj([-3.70,40.42]);
// flights
svg.append('path').attr('d',`M-10 40 Q ${b[0]-110} ${b[1]-120} ${b[0]} ${b[1]}`).attr('fill','none').attr('stroke',P.flight).attr('stroke-width',2).attr('stroke-dasharray','5 6');
svg.append('path').attr('d',`M${m[0]} ${m[1]} Q ${m[0]-70} ${m[1]+40} -10 ${m[1]+120}`).attr('fill','none').attr('stroke',P.flight).attr('stroke-width',2).attr('stroke-dasharray','5 6');
// rail
svg.append('path').attr('d',d3.line().curve(d3.curveCatmullRom)([b,v,m])).attr('fill','none').attr('stroke',P.route).attr('stroke-width',4).attr('stroke-linecap','round');
svg.append('circle').attr('cx',v[0]).attr('cy',v[1]).attr('r',5.5).attr('fill',P.stop).attr('stroke',P.sea).attr('stroke-width',2.5);
[b,m].forEach(p=>{svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',17).attr('fill',P.route).attr('opacity',.22);
 svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',9).attr('fill',P.route).attr('stroke',P.stop).attr('stroke-width',2.5);});
function lab(p,dx,dy,anchor,t1,t2){const g=svg.append('g').attr('transform',`translate(${p[0]+dx},${p[1]+dy})`);
 g.append('text').text(t1).attr('text-anchor',anchor).attr('font-family','Barlow Condensed').attr('font-weight',800).attr('font-size',22).attr('letter-spacing',.6).attr('fill',P.t1).style('text-transform','uppercase');
 g.append('text').text(t2).attr('y',20).attr('text-anchor',anchor).attr('font-family','Barlow Condensed').attr('font-weight',700).attr('font-size',17).attr('letter-spacing',.6).attr('fill',P.t2).style('text-transform','uppercase');}
lab(b,-4,-44,'end','Camp Nou','Barcelona 5, Eibar 0');
lab(m,60,40,'end','Bernabéu','Madrid 2, Barcelona 0');
lab(v,16,10,'start','Valencia','');

</script>
<script src="../../../kit/kit.js"></script>
</body></html>
