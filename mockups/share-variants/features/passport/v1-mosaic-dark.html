<!doctype html>
<html><head><meta charset="utf-8"><title>Mosaic, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.cond{font-family:var(--f-cond)}

.card.dk{background:#0a0a0c;color:#fff}
.dk .top{position:absolute;left:24px;right:24px;top:26px;display:flex;justify-content:space-between;font:700 13px/1 var(--f-cond);letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.dk .top b{color:var(--signal);font-weight:700}
.dk .big{position:absolute;left:18px;top:50px;font:800 215px/.8 var(--f-cond);letter-spacing:-8px;color:#fff;font-variant-numeric:tabular-nums}
.dk .of{position:absolute;left:24px;top:236px;font:800 38px/.92 var(--f-cond);text-transform:uppercase;letter-spacing:-.2px}
.dk .of span{color:var(--signal)}
.mo{position:absolute;left:24px;right:24px;top:322px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.t{height:42px;border-radius:7px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.13);display:grid;place-items:center;font:800 15px/1 var(--f-cond);letter-spacing:.6px}
.t.on{background:var(--c);color:var(--f);box-shadow:none}
.dk .foot{position:absolute;left:24px;right:24px;bottom:24px;display:flex;justify-content:space-between;align-items:flex-end}
.dk .foot .l{font:600 14px/1.3 var(--f-ui);color:rgba(255,255,255,.62)}
.dk .foot .l b{color:#fff;font-weight:700}
.dk .foot .w{font:800 15px/1 var(--f-cond);letter-spacing:3px;color:rgba(255,255,255,.5)}
/* paper */
.card.pp{background:var(--paper);color:var(--paper-ink)}
.pp .mo{top:24px;gap:4px;grid-template-columns:repeat(6,1fr)}
.pp .t{height:46px;box-shadow:inset 0 0 0 1.5px rgba(29,26,22,.18);border-radius:5px}
.pp .t.on{box-shadow:inset 0 0 0 2px rgba(29,26,22,.0)}
.pp .cap2{position:absolute;left:24px;top:366px;font:700 13px/1 var(--f-cond);letter-spacing:2.4px;text-transform:uppercase;color:rgba(29,26,22,.55)}
.pp .big{position:absolute;left:20px;top:392px;font:800 170px/.82 var(--f-cond);letter-spacing:-6px;font-variant-numeric:tabular-nums}
.pp .of{position:absolute;left:214px;top:420px;font:800 34px/.95 var(--f-cond);text-transform:uppercase}
.pp .of em{font-style:normal;display:block;color:rgba(29,26,22,.5);font-size:34px}
.pp .rule{position:absolute;left:24px;right:24px;bottom:78px;height:2px;background:var(--paper-ink)}
.pp .foot{position:absolute;left:24px;right:24px;bottom:26px;display:flex;justify-content:space-between;font:600 14px/1.3 var(--f-ui);color:rgba(29,26,22,.7)}
.pp .foot b{color:var(--paper-ink)}
.pp .foot .w{font:800 15px/1 var(--f-cond);letter-spacing:3px;align-self:flex-end}

</style></head>
<body class="phone" data-chrome="none">
<div class="card dk"><div class="top"><span>Stadium Passport</span><b>MLB</b></div>
<div class="big">14</div>
<div class="of">of 30 MLB parks<br><span>visited</span></div>
<div class="mo"><div class="t on" style="--c:#2f6bff;--f:#fff">CHC</div><div class="t on" style="--c:#4a4f58;--f:#fff">CWS</div><div class="t on" style="--c:#c41e3a;--f:#fff">STL</div><div class="t on" style="--c:#0c2c56;--f:#fff">DET</div><div class="t on" style="--c:#e31937;--f:#fff">CLE</div><div class="t on" style="--c:#bd3039;--f:#fff">BOS</div><div class="t on" style="--c:#fdb827;--f:#000">PIT</div><div class="t on" style="--c:#c6011f;--f:#fff">CIN</div><div class="t on" style="--c:#1c2c5b;--f:#fff">NYY</div><div class="t on" style="--c:#004687;--f:#fff">KC</div><div class="t on" style="--c:#005a9c;--f:#fff">LAD</div><div class="t on" style="--c:#fd5a1e;--f:#fff">SF</div><div class="t on" style="--c:#ffc52f;--f:#000">MIL</div><div class="t on" style="--c:#d31145;--f:#fff">MIN</div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div></div>
<div class="foot"><div class="l">Latest stamp <b>MIN</b><br>AUG 9, 2025</div><div class="w">WITNESS</div></div></div>
<div class="cap">A &middot; Stamp mosaic &middot; dark</div>
<script src="../../../kit/kit.js"></script>
</body></html>
