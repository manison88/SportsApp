<!doctype html>
<html><head><meta charset="utf-8"><title>Passport cover, navy</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);color:var(--text-3);letter-spacing:.2px}
.cond{font-family:var(--f-cond)}

.sps{position:absolute;left:0;right:0;top:196px;height:330px}
.sp{position:absolute;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(var(--r))}
.sp b{font:800 24px/.9 var(--f-cond);letter-spacing:.6px}
.sp span{font:700 12px/1 var(--f-cond);letter-spacing:.8px}
/* paper */
.card.pg{background:var(--paper);color:var(--paper-ink)}
.pg .sp{color:var(--c);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 5px var(--paper),inset 0 0 0 6.5px var(--c);mix-blend-mode:multiply}
.pg .sp.dk2 b,.pg .sp.dk2 span{}
.pg .sp.nw{box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 5px var(--paper),inset 0 0 0 6.5px var(--c),0 0 0 3px var(--paper),0 0 0 4.5px var(--paper-ink)}
.pg .hd{position:absolute;left:24px;right:24px;top:26px;display:flex;justify-content:space-between;font:700 13px/1 var(--f-cond);letter-spacing:2.4px;text-transform:uppercase;color:rgba(29,26,22,.55)}
.pg .n{position:absolute;left:20px;top:48px;font:800 150px/.86 var(--f-cond);letter-spacing:-4px}
.pg .t2{position:absolute;left:190px;top:76px;font:800 34px/.95 var(--f-cond);text-transform:uppercase}
.pg .t2 em{font-style:normal;display:block;color:rgba(29,26,22,.5)}
.pg .mrz{position:absolute;left:24px;right:24px;bottom:24px;font:600 12px/1.5 var(--f-mono);letter-spacing:.4px;color:rgba(29,26,22,.6);display:flex;justify-content:space-between}
.pg .lines{position:absolute;inset:0;opacity:.5;background:repeating-radial-gradient(circle at 50% 120%,transparent 0 9px,rgba(29,26,22,.05) 9px 10px)}
.pg .ft{position:absolute;left:24px;right:24px;top:556px;font:600 14px/1.3 var(--f-ui);color:rgba(29,26,22,.7)}
.pg .ft b{color:var(--paper-ink)}
/* cover */
.card.cv{background:radial-gradient(120% 70% at 50% 35%,#16233d 0,#0b1424 70%);color:var(--signal)}
.cv .frame{position:absolute;inset:14px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(255,181,71,.55),inset 0 0 0 5px #0b1424,inset 0 0 0 6px rgba(255,181,71,.3)}
.cv .tp{position:absolute;left:0;right:0;top:50px;text-align:center;font:700 14px/1 var(--f-cond);letter-spacing:5px;text-transform:uppercase}
.cv .tp2{position:absolute;left:0;right:0;top:78px;text-align:center;font:800 44px/.9 var(--f-cond);letter-spacing:3px;text-transform:uppercase;color:var(--signal-soft)}
.cv .em{position:absolute;left:50%;top:170px;width:230px;height:230px;margin-left:-115px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--signal),inset 0 0 0 8px #0b1424,inset 0 0 0 9.5px rgba(255,181,71,.55)}
.cv .em b{font:800 150px/.8 var(--f-cond);letter-spacing:-3px;color:var(--signal);margin-top:-8px;font-variant-numeric:tabular-nums}
.cv .of{position:absolute;left:0;right:0;top:420px;text-align:center;font:800 34px/.95 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:var(--signal-soft)}
.cv .dots{position:absolute;left:36px;right:36px;top:492px;display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.cv .dots i{aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1.5px #0b1424}
.cv .dots i.o{background:none;box-shadow:inset 0 0 0 1.5px rgba(255,181,71,.35)}
.cv .yrs{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:700 14px/1 var(--f-cond);letter-spacing:4px;color:rgba(255,181,71,.8)}

</style></head>
<body class="phone" data-chrome="none">
<div class="card cv"><div class="frame"></div>
<div class="tp">Witness</div><div class="tp2">Stadium<br>Passport</div>
<div class="em"><b>14</b></div>
<div class="of">of 30 MLB parks</div>
<div class="dots"><i style="background:#2f6bff"></i><i style="background:#4a4f58"></i><i style="background:#c41e3a"></i><i style="background:#0c2c56"></i><i style="background:#e31937"></i><i style="background:#bd3039"></i><i style="background:#fdb827"></i><i style="background:#c6011f"></i><i style="background:#1c2c5b"></i><i style="background:#004687"></i><i style="background:#005a9c"></i><i style="background:#fd5a1e"></i><i style="background:#ffc52f"></i><i style="background:#d31145"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i></div>
<div class="yrs">2014 &ndash; 2025</div></div>
<div class="cap">C &middot; Passport cover &middot; foil on navy</div>
<script src="../../../kit/kit.js"></script>
</body></html>
