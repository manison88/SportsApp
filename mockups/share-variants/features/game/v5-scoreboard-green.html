<!doctype html>
<html><head><meta charset="utf-8"><title>Scoreboard poster, green</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0;background:var(--ink);}
body{width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;color:var(--text);font-family:var(--f-ui)}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.card img.bg{position:absolute;max-width:none}
.num{font-family:var(--f-cond);font-weight:800;font-variant-numeric:tabular-nums;line-height:.8}
.eb{font:700 12px/1 var(--f-cond);letter-spacing:3px;text-transform:uppercase}

.card{background:#0f2a1d}
.tex{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 40%,rgba(80,150,100,.22),rgba(0,0,0,0) 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 6px)}
.brd{position:absolute;left:18px;right:18px;top:64px;border:3px solid #e9efe6;border-radius:3px;padding:0}
.row{display:flex;align-items:center;height:178px;padding:0 16px;border-bottom:3px solid #e9efe6}
.row:last-child{border:0}
.row .nm{flex:1;font:700 36px/1 var(--f-cond);letter-spacing:1.5px;color:#f1f5ee;text-transform:uppercase}
.row .sl{width:112px;height:146px;background:#0a1d14;border:2px solid #e9efe6;display:grid;place-items:center;font:800 136px/1 var(--f-cond);color:#fff;font-variant-numeric:tabular-nums}
.row.w .sl{color:#ffd24a}
.row.w .nm::after{content:"WIN";display:block;margin-top:8px;font:700 14px/1 var(--f-cond);letter-spacing:4px;color:#ffd24a}
.inn{display:flex;justify-content:space-between;padding:10px 16px;border-top:3px solid #c43a2f;background:#0a1d14;font:700 17px/1 var(--f-cond);color:#e9efe6;letter-spacing:1px}
.inn span{opacity:.9}
.top{position:absolute;left:24px;top:24px;right:24px;font:700 12px/1 var(--f-cond);letter-spacing:4px;color:#b8cdbd;text-transform:uppercase}
.foot{position:absolute;left:24px;right:24px;bottom:28px;color:#f1f5ee}
.foot .a{font:800 30px/1 var(--f-cond);text-transform:uppercase;letter-spacing:1px}
.foot .b{margin-top:10px;font:500 15px/1.45 var(--f-ui);color:#b8cdbd}
.foot .b b{color:#ffd24a;font-weight:600}

</style></head><body>
<div class="card"><div class="tex"></div>
<div class="top">World Series · Game 5</div>
<div class="brd"><div class="row w"><div class="nm">Chicago</div><div class="sl">3</div></div><div class="row"><div class="nm">Cleveland</div><div class="sl">2</div></div>
<div class="inn"><span>FINAL</span><span>Oct 30, 2016</span><span>Wrigley Field</span></div></div>
<div class="foot"><div class="a">Down 3–1. Not done.</div><div class="b">Bleachers Sec 314 · 63°F, clear · <b>with Dad</b></div></div></div>
<div class="cap">Scoreboard · Wrigley manual board, drawn</div>
<script src="../../../kit/kit.js"></script>
</body></html>
