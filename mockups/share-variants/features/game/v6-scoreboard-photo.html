<!doctype html>
<html><head><meta charset="utf-8"><title>Scoreboard on photo</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0;background:var(--ink);}
body{width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;color:var(--text);font-family:var(--f-ui)}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.card img.bg{position:absolute;max-width:none}
.num{font-family:var(--f-cond);font-weight:800;font-variant-numeric:tabular-nums;line-height:.8}
.eb{font:700 12px/1 var(--f-cond);letter-spacing:3px;text-transform:uppercase}

.bg{left:-59px;top:0;width:471px;height:628px;filter:brightness(.55) saturate(.9)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.35),rgba(5,5,6,.1) 40%,rgba(5,5,6,.9) 100%)}
.brd{position:absolute;left:24px;right:24px;top:170px;background:#0d3a2a;border:3px solid #e9efe6;border-radius:4px;box-shadow:0 0 0 6px rgba(13,58,42,.5),0 20px 50px rgba(0,0,0,.6),0 0 60px rgba(60,200,140,.2)}
.r{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:140px}
.r+.r{border-top:3px solid #e9efe6}
.r .nm{font:700 34px/1 var(--f-cond);letter-spacing:2px;color:#f1f5ee;text-transform:uppercase}
.r .v{font:800 108px/1 var(--f-cond);color:#f1f5ee;font-variant-numeric:tabular-nums}
.r.w .v{color:#ffb547;text-shadow:0 0 24px rgba(255,181,71,.5)}
.top{position:absolute;left:24px;top:28px;right:24px;font:700 12px/1 var(--f-cond);letter-spacing:3px;color:var(--signal);text-transform:uppercase}
.hd{position:absolute;left:24px;right:24px;top:52px;font:400 40px/1.05 var(--f-serif);font-style:italic;color:#fff}
.bot{position:absolute;left:24px;right:24px;bottom:28px}
.bot .a{font:800 22px/1 var(--f-cond);letter-spacing:1.5px;text-transform:uppercase}
.bot .b{margin-top:10px;font:500 15px/1.45 var(--f-ui);color:rgba(255,255,255,.78)}

</style></head><body>
<div class="card"><img class="bg" src="../../../photos/wrigley-night.jpg"><div class="sh"></div>
<div class="top">Game 5 · Final</div>
<div class="hd">Not done yet.</div>
<div class="brd"><div class="r w"><span class="nm">Chicago</span><span class="v">3</span></div><div class="r"><span class="nm">Cleveland</span><span class="v">2</span></div></div>
<div class="bot"><div class="a">Wrigley Field · Oct 30, 2016</div><div class="b">Bleachers Sec 314 · 63°F, clear · with Dad</div></div></div>
<div class="cap">Scoreboard · lit board over your photo</div>
<script src="../../../kit/kit.js"></script>
</body></html>
