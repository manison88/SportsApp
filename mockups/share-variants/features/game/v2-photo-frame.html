<!doctype html>
<html><head><meta charset="utf-8"><title>Photo frame, ink</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0;background:var(--ink);}
body{width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;color:var(--text);font-family:var(--f-ui)}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.card img.bg{position:absolute;max-width:none}
.num{font-family:var(--f-cond);font-weight:800;font-variant-numeric:tabular-nums;line-height:.8}
.eb{font:700 12px/1 var(--f-cond);letter-spacing:3px;text-transform:uppercase}

.card{background:#050506}
.win{position:absolute;left:16px;right:16px;top:16px;height:372px;border-radius:6px;overflow:hidden}
.win img{left:-70px;top:-70px;width:470px;height:627px;filter:contrast(1.04) saturate(1.05)}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,0) 70%,rgba(5,5,6,.5))}
.tag{position:absolute;left:12px;bottom:12px;z-index:2;font:700 12px/1 var(--f-cond);letter-spacing:2px;color:#fff;background:rgba(5,5,6,.7);padding:6px 9px;border-radius:4px;text-transform:uppercase}
.tag span{color:var(--signal)}
.txt{position:absolute;left:24px;right:24px;top:410px}
.sc{display:flex;align-items:flex-end;justify-content:space-between}
.sc .n{font:400 104px/.82 var(--f-serif);letter-spacing:-2px}
.sc .n em{color:var(--signal);font-style:italic}
.sc .t{font:700 14px/1.3 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:var(--text-2);text-align:right;padding-bottom:4px}
.sc .t b{display:block;color:#fff;font-size:20px;letter-spacing:1px}
.hr{height:1px;background:rgba(255,255,255,.14);margin:20px 0 14px}
.ln{font:500 15px/1.4 var(--f-ui);color:rgba(255,255,255,.78)}
.ln b{color:#fff;font-weight:600}

</style></head><body>
<div class="card"><div class="win"><img class="bg" src="../../../photos/wrigley-night.jpg"><div class="tag"><span>●</span> Taken 40 seconds after the final out</div></div>
<div class="txt"><div class="sc"><div class="n">3<em>–</em>2</div><div class="t"><b>Chicago</b>Cleveland</div></div>
<div class="hr"></div>
<div class="ln"><b>World Series Game 5</b> · Wrigley Field<br>Oct 30, 2016 · Bleachers Sec 314<br><b style="color:var(--signal)">With Dad</b></div></div></div>
<div class="cap">Photo hero · framed window, serif score</div>
<script src="../../../kit/kit.js"></script>
</body></html>
