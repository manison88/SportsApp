<!doctype html>
<html><head><meta charset="utf-8"><title>Paper ticket, type</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0;background:var(--ink);}
body{width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;color:var(--text);font-family:var(--f-ui)}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none}
.cap{font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.card img.bg{position:absolute;max-width:none}
.num{font-family:var(--f-cond);font-weight:800;font-variant-numeric:tabular-nums;line-height:.8}
.eb{font:700 12px/1 var(--f-cond);letter-spacing:3px;text-transform:uppercase}

.card{background:#f3ece0;color:#241d14}
.tex{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(90,70,40,.03) 0 1px,transparent 1px 3px)}
.in{position:absolute;inset:20px;border:2px solid #241d14;padding:20px 18px}
.in::before{content:"";position:absolute;inset:4px;border:1px solid rgba(36,29,20,.5);pointer-events:none}
.eb{text-align:center;color:#6a5a44;letter-spacing:4px}
.ttl{margin-top:14px;text-align:center;font:400 38px/1 var(--f-serif);font-style:italic}
.big{margin-top:30px;display:flex;justify-content:center;align-items:center;gap:18px}
.big .t{text-align:center}
.big .t div{font:800 20px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.big .t span{font:800 150px/.85 var(--f-cond)}
.big .t.w span{color:#c2551d}
.big .t.l span{color:#241d14;opacity:.45}
.big .d{font:400 36px/1 var(--f-serif);opacity:.5;padding-top:26px}
.dash{border-top:2px dashed rgba(36,29,20,.55);margin:34px -18px 0}
.rows{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:24px 12px}
.rows div{font:700 12px/1 var(--f-cond);letter-spacing:2.5px;color:#6a5a44;text-transform:uppercase}
.rows b{display:block;margin-top:6px;font:700 20px/1.05 var(--f-cond);letter-spacing:.8px;color:#241d14}
.sig{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end}
.sig .n{font:500 32px/1 var(--f-hand);color:#c2551d}
.sig .p{width:110px;height:74px;border-radius:3px;overflow:hidden;position:relative;transform:rotate(3deg);box-shadow:0 2px 6px rgba(0,0,0,.3);border:3px solid #fbf8f1}
.sig .p img{left:-40px;top:-80px;width:200px;height:267px}

</style></head><body>
<div class="card"><div class="tex"></div><div class="in">
<div class="eb">World Series · Game 5</div>
<div class="ttl">Wrigley Field</div>
<div class="big"><div class="t w"><div>Chicago</div><span>3</span></div><div class="d">–</div><div class="t l"><div>Cleveland</div><span>2</span></div></div>
<div class="dash"></div>
<div class="rows"><div>Date<b>Oct 30, 2016</b></div><div>Section<b>Sec 314 · Bleachers</b></div><div>Weather<b>63°F · Clear</b></div><div>With<b>Dad</b></div></div>
<div class="sig"><div class="n">I was there.</div><div class="p"><img class="bg" src="../../../photos/wrigley-night.jpg"></div></div>
</div></div>
<div class="cap">Paper keepsake · the ticket, typeset</div>
<script src="../../../kit/kit.js"></script>
</body></html>
