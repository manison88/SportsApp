<!doctype html>
<html><head><meta charset="utf-8"><title>Football, photo hero</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
html,body{margin:0;background:var(--ink);}
body{width:393px;height:852px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;color:var(--text);font-family:var(--f-ui)}
.card{position:relative;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);flex:none;background:#050506}
.cap{font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.card img.bg{position:absolute;max-width:none}
.num{font-family:var(--f-cond);font-weight:800;font-variant-numeric:tabular-nums;line-height:.8}
.eb{font:700 12px/1 var(--f-cond);letter-spacing:3px;text-transform:uppercase}

.bg{left:-215px;top:0;width:789px;height:628px;filter:saturate(1.05) brightness(.95)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.55) 0%,rgba(5,5,6,0) 22%,rgba(5,5,6,0) 22%,rgba(5,5,6,0) 52%,rgba(5,5,6,.82) 82%,#050506 100%)}
.top{position:absolute;left:24px;right:24px;top:28px;color:var(--signal)}
.score{position:absolute;left:24px;top:56px;font-size:118px;letter-spacing:-2px;color:#fff;display:flex;align-items:baseline;gap:10px}
.score i{font-style:normal;color:var(--signal);font-size:80px;font-weight:700}
.score .l{color:rgba(255,255,255,.8)}
.bot{position:absolute;left:24px;right:24px;bottom:28px}
.bot .h{font:800 34px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.5px}
.bot .s{margin-top:10px;font:500 16px/1.35 var(--f-ui);color:rgba(255,255,255,.78)}
.bot .w{margin-top:16px;display:flex;align-items:center;gap:10px;font:700 14px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:var(--signal)}
.bot .w b{width:22px;height:22px;border-radius:50%;background:#8fe3a0;color:#000;display:grid;place-items:center;font-size:13px;letter-spacing:0}
.fact{margin-top:14px;font:700 13px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.62)}
</style></head><body>
<div class="card"><img class="bg" src="../../../photos/soldier-skyline.jpg"><div class="sh"></div>
<div class="top eb">NFL · Regular season</div>
<div class="score num"><span>27</span><i>–</i><span class="l">24</span></div>
<div class="bot"><div class="h">Chicago over Minnesota</div>
<div class="s">Soldier Field · Nov 2, 2025<br>52,584 in the stands · 43°F, clear</div><div class="fact">Q4 final · decided by 3</div>
<div class="w"><b>L</b>With Leo</div></div></div>
<div class="cap">Template 1 · football · full-bleed photo, number in the sky</div>
<script src="../../../kit/kit.js"></script>
</body></html>
