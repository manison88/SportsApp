<!doctype html>
<html><head><meta charset="utf-8"><title>Ticket stub, paper</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08);}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}

.notch{position:absolute;width:30px;height:30px;border-radius:50%;background:#050506;top:380px}
.notch.l{left:-15px}.notch.r{right:-15px}
.perf{position:absolute;left:22px;right:22px;top:395px;border-top:2px dashed rgba(29,26,22,.4)}

.card{background:var(--paper);color:var(--paper-ink)}
.tex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='4'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .80  0 0 0 0 .72  0 0 0 .35 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>")}
.band{position:absolute;left:0;right:0;top:0;height:64px;background:var(--paper-ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.band .eb:last-child{color:var(--signal)}
.lab{position:absolute;left:28px;font:700 13px/1 var(--f-cond);letter-spacing:3px;text-transform:uppercase;color:rgba(29,26,22,.6)}
.seat{position:absolute;left:24px;top:134px;font:800 92px/.86 var(--f-cond);letter-spacing:-2px;text-transform:uppercase;white-space:nowrap}
.venue{position:absolute;left:28px;top:318px;font:800 30px/1 var(--f-cond);letter-spacing:4px;text-transform:uppercase;color:#c8374f}
.stub{position:absolute;left:28px;right:28px;top:424px}
.stub b{display:block;font:800 124px/.8 var(--f-cond);letter-spacing:-2px}
.stub span{display:block;margin-top:14px;font:800 26px/1.05 var(--f-cond);letter-spacing:3px;text-transform:uppercase;color:rgba(29,26,22,.75)}

</style></head>
<body class="phone">
<div class="card">
<div class="tex"></div>
<div class="band"><span class="eb">Lucky charm</span><span class="eb">Admit one</span></div>
<div class="lab" style="top:104px">Your seat</div>
<div class="seat">Bleachers<br>314</div>
<div class="venue">Wrigley Field</div>
<div class="notch l"></div><div class="notch r"></div><div class="perf"></div>
<div class="stub"><b>11–6</b><span>With Maya beside you<br>17 games together</span></div>
</div>
<div class="cap">Ticket stub · paper, seat and Maya</div>
<script src="../../../kit/kit.js"></script>
</body></html>
