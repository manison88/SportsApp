<!doctype html>
<html><head><meta charset="utf-8"><title>Lucky charm poster, photo</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08);}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}

.ph{background-image:url(../../../photos/wrigley-bleachers.jpg);background-position:62% 50%}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.6) 0,rgba(5,5,6,.1) 24%,rgba(5,5,6,.1) 30%,rgba(5,5,6,.88) 66%,rgba(5,5,6,.97) 100%)}
.top{position:absolute;left:26px;right:26px;top:28px;display:flex;justify-content:space-between;color:#fff}
.top .eb:last-child{color:rgba(255,255,255,.7)}
.big{position:absolute;left:18px;bottom:196px;font:800 230px/.74 var(--f-cond);letter-spacing:-6px;color:#ff7a8a;white-space:nowrap}
.big sup{font-size:96px;vertical-align:top;position:relative;top:6px;margin-left:4px;letter-spacing:0}
.name{position:absolute;left:26px;bottom:140px;font:800 44px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:#fff}
.sub{position:absolute;left:26px;right:26px;bottom:28px;border-top:1px solid rgba(255,255,255,.22);padding-top:16px;display:flex;justify-content:space-between;align-items:flex-end}
.sub b{font:800 36px/1 var(--f-cond);color:#fff}
.sub span{display:block;margin-top:6px;font:700 13px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.62)}

</style></head>
<body class="phone">
<div class="card">
<div class="ph"></div><div class="scrim"></div>
<div class="top"><span class="eb">Lucky charm</span><span class="eb">Wrigley bleachers</span></div>
<div class="big">65<sup>%</sup></div><div class="name">Win rate with Maya</div>
<div class="sub"><div><b>11–6</b><span>Record</span></div><div style="text-align:right"><b>17</b><span>Games together</span></div></div>
</div>
<div class="cap">Lucky charm poster · bleachers photo</div>
<script src="../../../kit/kit.js"></script>
</body></html>
