<!doctype html>
<html><head><meta charset="utf-8"><title>Hero number, paper record</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08);}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}

.card{background:var(--paper);color:var(--paper-ink)}
.tex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='4'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .80  0 0 0 0 .72  0 0 0 .35 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>")}
.top{position:absolute;left:28px;right:28px;top:30px;display:flex;justify-content:space-between;color:rgba(29,26,22,.6)}
.hero{position:absolute;left:22px;top:52px;font:800 250px/.8 var(--f-cond);letter-spacing:-8px;color:var(--paper-ink)}
.lbl{position:absolute;left:28px;top:262px;font:800 30px/1 var(--f-cond);letter-spacing:5px;text-transform:uppercase;color:#b4620a}
.dots{position:absolute;left:28px;right:28px;top:330px;display:grid;grid-template-columns:repeat(10,1fr);row-gap:14px;justify-items:center}
.dots i{display:block;width:22px;height:22px;border-radius:50%}
.dots .w{background:var(--paper-ink)}
.dots .l{box-shadow:inset 0 0 0 2.5px rgba(29,26,22,.5)}
.dots .d{background:linear-gradient(90deg,var(--paper-ink) 50%,transparent 50%);box-shadow:inset 0 0 0 2.5px var(--paper-ink)}
.dots .r{width:16px;height:16px;margin-top:3px;border-radius:3px;transform:rotate(45deg);background:#b4620a}
.rec{position:absolute;left:28px;right:28px;bottom:30px;border-top:1.5px solid var(--paper-ink);padding-top:16px;display:flex;align-items:flex-end;justify-content:space-between}
.rec b{font:800 50px/.9 var(--f-cond);letter-spacing:-.5px;margin-right:14px}
.rec span{font:700 13px/1.25 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(29,26,22,.62);text-align:right}

</style></head>
<body class="phone">
<div class="card">
<div class="tex"></div>
<div class="top"><span class="eb">My numbers</span><span class="eb">2014 – 2026</span></div>
<div class="hero">60</div><div class="lbl">Games witnessed</div>
<div class="dots"><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="l"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="r"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="d"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="l"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="d"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="l"></i><i class="w"></i><i class="w"></i><i class="l"></i><i class="l"></i><i class="w"></i></div>
<div class="rec"><b>35–22–2</b><span>Won · lost · drawn<br>plus one race</span></div>
</div>
<div class="cap">Hero number · paper keepsake</div>
<script src="../../../kit/kit.js"></script>
</body></html>
