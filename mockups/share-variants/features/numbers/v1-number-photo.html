<!doctype html>
<html><head><meta charset="utf-8"><title>Hero number, night photo</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08);}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}

.ph{background-image:url(../../../photos/wrigley-night.jpg);background-position:50% 30%}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.55) 0,rgba(5,5,6,0) 22%,rgba(5,5,6,0) 34%,rgba(5,5,6,.82) 62%,rgba(5,5,6,.96) 100%)}
.top{position:absolute;left:26px;right:26px;top:28px;display:flex;justify-content:space-between;color:#fff}
.top .eb:last-child{color:rgba(255,255,255,.7)}
.hero{position:absolute;left:20px;bottom:150px;font:800 262px/.74 var(--f-cond);letter-spacing:-8px;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.lbl{position:absolute;left:26px;bottom:116px;font:800 30px/1 var(--f-cond);letter-spacing:5px;text-transform:uppercase;color:var(--signal)}
.row{position:absolute;left:26px;right:26px;bottom:28px;display:flex;gap:0;border-top:1px solid rgba(255,255,255,.22);padding-top:16px}
.row div{flex:1}
.row b{display:block;font:800 36px/1 var(--f-cond);color:#fff;letter-spacing:.3px}
.row span{display:block;margin-top:6px;font:700 13px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.62)}

</style></head>
<body class="phone">
<div class="card">
<div class="ph"></div><div class="scrim"></div>
<div class="top"><span class="eb">My numbers</span><span class="eb">Jun 2014 – Jul 2026</span></div>
<div class="hero">60</div><div class="lbl">Games witnessed</div>
<div class="row"><div><b>42,900</b><span>Miles</span></div><div><b>21</b><span>Venues</span></div><div><b>12</b><span>Years</span></div></div>
</div>
<div class="cap">Hero number · night photo</div>
<script src="../../../kit/kit.js"></script>
</body></html>
