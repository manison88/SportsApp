<!doctype html>
<html><head><meta charset="utf-8"><title>Ticket stub, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08);}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.c{font-family:var(--f-cond);font-weight:800;text-transform:uppercase}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}

.notch{position:absolute;width:30px;height:30px;border-radius:50%;background:#050506;top:370px}
.notch.l{left:-15px}.notch.r{right:-15px}
.perf{position:absolute;left:22px;right:22px;top:385px;border-top:2px dashed rgba(255,255,255,.35)}

.card{background:#121215}
.ph{height:400px;bottom:auto;background-image:url(../../../photos/wrigley-scoreboard.jpg);background-position:48% 50%}
.scrim{position:absolute;left:0;right:0;top:0;height:400px;background:linear-gradient(180deg,rgba(5,5,6,.65) 0,rgba(5,5,6,0) 30%,rgba(5,5,6,0) 45%,rgba(18,18,21,.95) 100%)}
.top{position:absolute;left:26px;right:26px;top:28px;display:flex;justify-content:space-between;color:#fff}
.top .eb:last-child{color:var(--signal)}
.hero{position:absolute;left:22px;top:224px;font:800 172px/.8 var(--f-cond);letter-spacing:-5px;color:#fff;white-space:nowrap}
.hero small{font-size:44px;letter-spacing:4px;margin-left:12px;color:var(--signal);vertical-align:bottom}
.grid{position:absolute;left:26px;right:26px;top:424px;display:grid;grid-template-columns:1fr 1fr;row-gap:22px;column-gap:20px}
.grid b{display:block;font:800 54px/.9 var(--f-cond);color:#fff}
.grid b i{font-style:normal;font-size:28px;color:rgba(255,255,255,.55)}
.grid span{display:block;margin-top:6px;font:700 13px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6)}

</style></head>
<body class="phone">
<div class="card">
<div class="ph"></div><div class="scrim"></div>
<div class="top"><span class="eb">My numbers</span><span class="eb">Admit one</span></div>
<div class="hero">60<small>Games</small></div>
<div class="notch l"></div><div class="notch r"></div><div class="perf"></div>
<div class="grid">
<div><b>42,900</b><span>Miles</span></div><div><b>12</b><span>Years</span></div>
<div><b>21</b><span>Venues</span></div><div><b>14<i>/30</i></b><span>MLB parks</span></div></div>
</div>
<div class="cap">Ticket stub · dark, scoreboard photo</div>
<script src="../../../kit/kit.js"></script>
</body></html>
