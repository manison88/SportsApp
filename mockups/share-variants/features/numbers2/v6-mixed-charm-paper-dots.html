<!doctype html>
<html><head><meta charset="utf-8"><title>Lucky charm, mixed sports, paper</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08)}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.abs{position:absolute}

.card{background:var(--paper);color:var(--paper-ink)}
.eb{color:var(--paper-ink)}
.top{position:absolute;left:30px;right:30px;top:30px;display:flex;justify-content:space-between}
.top .eb:last-child{color:rgba(29,26,22,.55)}
.av{position:absolute;left:30px;top:78px;width:64px;height:64px;border-radius:50%;background:#B79CFF;color:#1a1230;font:800 38px/64px var(--f-cond);text-align:center}
.nm{position:absolute;left:110px;top:82px;font:800 58px/1 var(--f-cond);letter-spacing:1px;text-transform:uppercase}
.nm2{position:absolute;left:110px;top:140px;font:700 13px/1 var(--f-cond);letter-spacing:2.4px;text-transform:uppercase;color:rgba(29,26,22,.6)}
.hero{position:absolute;left:22px;top:156px;font:800 190px/.8 var(--f-cond);letter-spacing:-5px}
.lbl{position:absolute;left:30px;top:306px;font:800 24px/1 var(--f-cond);letter-spacing:4px;text-transform:uppercase;color:#b4660a}
.grid{position:absolute;left:30px;right:30px;top:348px;display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid i{display:block;aspect-ratio:1;border-radius:50%}
.grid i.off{background:rgba(29,26,22,.11)}
.grid i.l{border:2.5px solid;background:transparent}
.sico{position:absolute;left:30px;right:30px;top:530px;display:flex;gap:18px}
.ic{display:flex;align-items:center;gap:6px}.ic b{font:800 20px/1 var(--f-cond)}
.foot{position:absolute;left:30px;right:30px;bottom:20px;border-top:1px solid rgba(29,26,22,.25);padding-top:10px;font:600 13px/1.3 var(--f-ui);color:rgba(29,26,22,.66)}
.foot b{display:block;font:800 20px/1.1 var(--f-cond);letter-spacing:.5px;color:var(--paper-ink);margin-bottom:3px}

</style></head><body class="phone">
