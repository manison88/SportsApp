<!doctype html>
<html><head><meta charset="utf-8"><title>Lucky charm, person, photo dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08)}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.abs{position:absolute}

.ph{background-image:url(../../../photos/united-center-court.jpg);background-position:50% 40%}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.65) 0,rgba(5,5,6,.1) 26%,rgba(5,5,6,.25) 36%,rgba(5,5,6,.9) 55%,rgba(5,5,6,.97) 100%)}
.top{position:absolute;left:26px;right:26px;top:28px;display:flex;justify-content:space-between;color:#fff}
.top .eb:last-child{color:rgba(255,255,255,.72)}
.av{position:absolute;left:26px;top:226px;width:64px;height:64px;border-radius:50%;background:#B79CFF;color:#1a1230;font:800 38px/64px var(--f-cond);text-align:center}
.nm{position:absolute;left:104px;top:232px;font:800 54px/1 var(--f-cond);letter-spacing:1px;text-transform:uppercase;color:#fff}
.nm2{position:absolute;left:104px;top:288px;font:700 13px/1 var(--f-cond);letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.62)}
.hero{position:absolute;left:18px;top:310px;font:800 200px/.8 var(--f-cond);letter-spacing:-5px;color:#fff}
.lbl{position:absolute;left:26px;top:470px;font:800 26px/1 var(--f-cond);letter-spacing:5px;text-transform:uppercase;color:var(--signal)}
.cmp{position:absolute;left:26px;right:26px;top:512px}
.c{display:flex;align-items:center;gap:10px;height:26px}
.c span{width:70px;font:700 13px/1 var(--f-cond);letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.66)}
.c .t{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.14)}
.c .t i{display:block;height:100%;border-radius:5px}
.c b{width:46px;text-align:right;font:800 22px/1 var(--f-cond);color:#fff}
.foot{position:absolute;left:26px;right:26px;bottom:24px;border-top:1px solid rgba(255,255,255,.22);padding-top:10px;font:600 13px/1.3 var(--f-ui);color:rgba(255,255,255,.7)}
.foot b{display:block;font:800 18px/1.1 var(--f-cond);letter-spacing:1px;text-transform:uppercase;color:#ff4d6d;margin-bottom:3px}

</style></head><body class="phone">
<div class="card"><div class="ph"></div><div class="scrim"></div>
<div class="top"><span class="eb">Lucky charm</span><span class="eb">13 games together</span></div>
<div class="av">D</div><div class="nm">Dana</div><div class="nm2">Best record in my library</div>
<div class="hero">11–2</div><div class="lbl">When she is there</div>
<div class="cmp">
<div class="c"><span>With Dana</span><span class="t"><i style="width:85%;background:var(--signal)"></i></span><b>85%</b></div>
<div class="c"><span>Without</span><span class="t"><i style="width:65%;background:rgba(255,255,255,.45)"></i></span><b>65%</b></div></div>
<div class="foot"><b>Chicago 112, Miami 109</b>United Center · Feb 15 2026 · Dana was there</div>
</div><div class="cap">Lucky charm, a person · basketball · dark photo</div><script src="../../../kit/kit.js"></script></body></html>
