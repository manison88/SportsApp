<!doctype html>
<html><head><meta charset="utf-8"><title>Lucky charm, place, paper</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08)}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.abs{position:absolute}

.card{background:var(--paper);color:var(--paper-ink)}
.eb{color:var(--paper-ink)}
.top{position:absolute;left:30px;right:30px;top:30px;display:flex;justify-content:space-between}
.top .eb:last-child{color:rgba(29,26,22,.55)}
.pin{position:absolute;left:30px;top:84px;width:56px;height:56px;border-radius:50%;border:2px solid #1f8fc4;display:flex;align-items:center;justify-content:center;color:#1f8fc4}
.hero{position:absolute;left:22px;top:140px;font:800 214px/.8 var(--f-cond);letter-spacing:-6px;color:var(--paper-ink)}
.nm{position:absolute;left:30px;top:322px;font:800 48px/1 var(--f-cond);letter-spacing:1px;text-transform:uppercase}
.lbl{position:absolute;left:30px;top:378px;font:800 24px/1 var(--f-cond);letter-spacing:4px;text-transform:uppercase;color:#b4660a}
.pips{position:absolute;left:30px;right:30px;top:430px;display:flex;gap:5px}
.pips i{flex:1;aspect-ratio:1;max-width:25px;border:2px solid;border-radius:50%;font:800 13px/21px var(--f-cond);font-style:normal;text-align:center;color:#fff}
.pk{position:absolute;left:30px;right:30px;top:472px;display:flex;gap:16px;font:700 13px/1 var(--f-cond);letter-spacing:1.6px;text-transform:uppercase;color:rgba(29,26,22,.62)}
.pk span{display:flex;align-items:center;gap:6px}
.pk em{width:10px;height:10px;border-radius:50%;display:block}
.cmp{position:absolute;left:30px;right:30px;top:508px;font:600 14px/1.3 var(--f-ui);color:rgba(29,26,22,.7)}
.foot{position:absolute;left:30px;right:30px;bottom:24px;border-top:1px solid rgba(29,26,22,.25);padding-top:12px}
.foot b{display:block;font:800 22px/1.1 var(--f-cond);letter-spacing:.5px}
.foot span{display:block;margin-top:5px;font:600 13px/1.2 var(--f-ui);color:rgba(29,26,22,.62)}

</style></head><body class="phone">
<div class="card">
<div class="top"><span class="eb">Lucky charm</span><span class="eb">11 games here</span></div>

<div class="cmp">73% wins here, against 69% everywhere else.</div>
<div class="foot"><b>Chicago 4, St. Louis 1</b><span>Best hockey night here · Mar 2 2025</span></div>
</div><div class="cap">Lucky charm, a place · hockey · paper</div><script src="../../../kit/kit.js"></script></body></html>
