<!doctype html>
<html><head><meta charset="utf-8"><title>Numbers, paper bars</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08)}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.abs{position:absolute}

.card{background:var(--paper);color:var(--paper-ink)}
.win{position:absolute;left:18px;right:18px;top:18px;height:160px;border-radius:6px;background:url(../../../photos/soldier-aerial.jpg) 50% 45%/cover}
.win:after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.eb{color:var(--paper-ink)}
.tag{position:absolute;left:30px;top:30px;background:var(--paper);padding:7px 10px 6px;border-radius:3px}
.hero{position:absolute;left:14px;top:176px;font:800 188px/.8 var(--f-cond);letter-spacing:-6px;color:var(--paper-ink)}
.lbl{position:absolute;left:30px;top:330px;font:800 24px/1 var(--f-cond);letter-spacing:4px;text-transform:uppercase;color:#b4660a}
.side{position:absolute;right:30px;top:196px;text-align:right}
.side b{display:block;font:800 52px/1 var(--f-cond)}
.side span{display:block;margin-top:4px;font:700 13px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(29,26,22,.6)}
.side div+div{margin-top:12px}
.bars{position:absolute;left:30px;right:30px;top:374px}
.br{display:flex;align-items:center;gap:10px;height:26px}
.br .n{display:flex;align-items:center;gap:8px;width:116px;font:700 14px/1 var(--f-cond);letter-spacing:1.4px;text-transform:uppercase}
.br .t{flex:1;height:10px;border-radius:5px;background:rgba(29,26,22,.08)}
.br .t i{display:block;height:100%;border-radius:5px}
.br b{width:26px;text-align:right;font:800 20px/1 var(--f-cond)}
.foot{position:absolute;left:30px;right:30px;bottom:22px;border-top:1px solid rgba(29,26,22,.25);padding-top:12px}
.foot b{display:block;font:800 22px/1.1 var(--f-cond);letter-spacing:.5px}
.foot span{display:block;margin-top:5px;font:600 13px/1.2 var(--f-ui);color:rgba(29,26,22,.62)}

</style></head><body class="phone">
