<!doctype html>
<html><head><meta charset="utf-8"><title>Numbers, dot grid, dark</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:var(--ink)}
.card{position:absolute;left:20px;top:100px;width:353px;height:628px;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08)}
.cap{position:absolute;left:0;right:0;top:744px;text-align:center;font:500 12px/1 var(--f-ui);letter-spacing:.3px;color:var(--text-3)}
.eb{font:700 13px/1 var(--f-cond);letter-spacing:2.6px;text-transform:uppercase}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.abs{position:absolute}

.card{background:#07070a}
.top{position:absolute;left:26px;right:26px;top:28px;display:flex;justify-content:space-between;color:#fff}
.top .eb:last-child{color:var(--text-3)}
.hero{position:absolute;left:20px;top:64px;font:800 200px/.8 var(--f-cond);letter-spacing:-6px;color:#fff}
.lbl{position:absolute;left:26px;top:222px;font:800 28px/1 var(--f-cond);letter-spacing:5px;text-transform:uppercase;color:var(--signal)}
.grid{position:absolute;left:26px;right:26px;top:276px;display:grid;grid-template-columns:repeat(10,1fr);gap:9px 9px}
.grid i{display:block;aspect-ratio:1;border-radius:50%}
.grid i.rc{box-shadow:0 0 0 3px #07070a,0 0 0 5px #ffe14d,0 0 16px 5px rgba(255,225,77,.55)}
.icons{position:absolute;left:26px;right:26px;top:440px;display:flex;justify-content:space-between}
.ic{display:flex;align-items:center;gap:6px}
.ic b{font:800 20px/1 var(--f-cond);color:#fff}
.callout{position:absolute;left:26px;right:26px;top:488px}
.callout b{display:block;font:800 26px/1.05 var(--f-cond);letter-spacing:.8px;text-transform:uppercase;color:#ffe14d}
.callout span{display:block;margin-top:6px;font:600 14px/1.3 var(--f-ui);color:rgba(255,255,255,.66)}
.row{position:absolute;left:26px;right:26px;bottom:28px;display:flex;border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
.row div{flex:1}
.row b{display:block;font:800 34px/1 var(--f-cond);color:#fff}
.row span{display:block;margin-top:6px;font:700 13px/1 var(--f-cond);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6)}

</style></head><body class="phone">
