<!doctype html>
<html><head><meta charset="utf-8"><title>Timeline first run</title>
<link rel="stylesheet" href="../../../../kit/kit.css">
<link rel="stylesheet" href="../../../../round2/system/broadcast.css">
<link rel="stylesheet" href="../../../../final/system/final.css">
<style>
  body.b { --b-text-3: rgba(255,255,255,.62); --amber: #ffb547; }
  .b-body { font-size: 15px; }
  .crop { position: relative; overflow: hidden; }
  .crop img { filter: contrast(1.06) saturate(.9) brightness(.9); }
  .abs { position: absolute; inset: 0; }
  .amber { color: var(--amber); }
  .cta { position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; flex-direction: column; gap: 6px; }
  .cta .b-btn { width: 100%; height: 54px; font-size: 17px; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.25); }
  .cta .b-btn.ghost { box-shadow: inset 0 0 0 1px var(--b-line); }
  .cta .row2 { display: flex; gap: 10px; }
  .cta .row2 .b-btn { flex: 1; }
  .link { height: 44px; display: flex; align-items: center; justify-content: center; font: 700 15px/1 var(--b-cond); letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.86); }
  .lock { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--b-text-2); font: 500 13px/1.3 var(--b-ui); }
  .lock svg, .ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .skipbtn { height: 40px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; font: 800 14px/1 var(--b-cond); letter-spacing: 1.4px; text-transform: uppercase; background: var(--b-panel-2); box-shadow: inset 0 0 0 1px var(--b-line); }
  .scrim { position: absolute; inset: 0; }
  .note { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--b-panel); box-shadow: inset 0 0 0 1px var(--b-line); }
  .note .b-body { font-size: 14px; color: rgba(255,255,255,.78); flex: 1; }
  .note .x { width: 28px; height: 28px; margin: -4px -4px 0 0; display: grid; place-items: center; flex: none; }
  .note .x svg { width: 16px; height: 16px; stroke: rgba(255,255,255,.7); fill: none; stroke-width: 2.4; stroke-linecap: round; }

  .check { position: absolute; left: 20px; right: 20px; top: 112px; padding: 16px 16px 6px; border-radius: 16px; background: var(--b-panel); box-shadow: inset 0 0 0 1px var(--b-line); }
  .check .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .check .hd .b-h2 { font-size: 20px; }
  .check .hd .r { display: flex; align-items: center; gap: 10px; color: var(--b-text-2); font: 700 13px/1 var(--b-cond); letter-spacing: 1.4px; }
  .check .hd .x { width: 28px; height: 28px; display: grid; place-items: center; margin-right: -6px; }
  .check .hd .x svg { width: 16px; height: 16px; stroke: rgba(255,255,255,.7); fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .check .bar { height: 3px; margin: 10px 0 4px; border-radius: 2px; background: rgba(255,255,255,.1); }
  .check .bar i { display: block; height: 100%; width: 0%; background: var(--amber); }
  .st { display: flex; align-items: center; gap: 12px; min-height: 48px; box-shadow: inset 0 -1px 0 var(--b-line); font: 700 17px/1 var(--b-cond); letter-spacing: .5px; text-transform: uppercase; }
  .st:last-child { box-shadow: none; }
  .st .n { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); display: grid; place-items: center; font-size: 13px; flex: none; }
  .st .go { margin-left: auto; width: 16px; height: 16px; stroke: rgba(255,255,255,.55); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .card { position: absolute; left: 20px; right: 20px; top: 334px; }
  .card .b-frame { height: 300px; border-radius: 16px 16px 0 0; }
  .card .scrim { background: linear-gradient(180deg, rgba(7,8,10,0) 40%, rgba(7,8,10,.94) 100%); }
  .card .copy { position: absolute; left: 18px; right: 18px; bottom: 16px; }
  .card .copy .b-display { font-size: 46px; }
  .stub { position: relative; height: 70px; background: var(--b-panel-2); border-radius: 0 0 16px 16px; display: flex; align-items: center; padding: 0 18px; gap: 16px;
    -webkit-mask: radial-gradient(circle 10px at 0 0, transparent 9.5px, #000 10px) top left / 51% 100% no-repeat, radial-gradient(circle 10px at 100% 0, transparent 9.5px, #000 10px) top right / 51% 100% no-repeat; }
  .stub::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; border-top: 1.5px dashed rgba(255,255,255,.18); }
  .stub b { font: 700 18px/1 var(--b-cond); letter-spacing: .4px; text-transform: uppercase; white-space: nowrap; }
  .stub .b-bug { margin-left: auto; height: 32px; font-size: 16px; }

</style></head>
<body class="phone b">

<div class="b-nav"><div class="f-title">Timeline</div><div class="b-icon-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></div></div>
<div class="check">
  <div class="hd"><div class="b-h2">Get started</div><div class="r">0 OF 3<span class="x"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div></div>
  <div class="bar"><i></i></div>
  <div class="st"><span class="n">1</span>Review 47 games<svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
  <div class="st"><span class="n">2</span>Add a trip album<svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
  <div class="st"><span class="n">3</span>Try Check in live<svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
</div>
<div class="card">
  <div class="b-frame"><div class="crop abs" data-crop="wrigley-bleachers.jpg 120 60 1000 700"></div><div class="scrim"></div>
    <div class="copy"><div class="b-display">Bleachers.<br>Golden hour.</div></div></div>
  <div class="stub"><b>Jul 4, 2026</b><b>Sec 314</b><div class="b-bug"><span class="team" style="--c:var(--chc)">CHC</span><span class="score">4</span><span class="team" style="--c:var(--mil)">MIL</span><span class="score">3</span></div></div>
</div>
<nav class="b-tabs">
  <span class="on"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="9" rx="2"/><path d="M4 17h16M4 21h10"/></svg>Timeline</span>
  <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.4 3.2 14.6 0 18M12 3c-3.2 3.4-3.2 14.6 0 18"/></svg>Map</span>
  <span><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="11" r="3.5"/><path d="M9 17.5h6"/></svg>Passport</span>
  <span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4.4-6 8-6s6.6 2 8 6"/></svg>You</span>
</nav>

<script>
(function () {
  const N = { 'wrigley-night.jpg': [1920, 2560], 'wrigley-night-2.jpg': [1920, 2560], 'lambeau-concourse.jpg': [1920, 1288], 'wrigley-bleachers.jpg': [1280, 853] };
  document.querySelectorAll('[data-crop]').forEach(b => {
    const [src, sx, sy, sw, sh] = b.dataset.crop.split(/\s+/).map((v, i) => i ? +v : v);
    const [nw, nh] = N[src], bw = b.clientWidth, bh = b.clientHeight, s = Math.max(bw / sw, bh / sh);
    const i = document.createElement('img');
    i.src = '../../../../photos/' + src;
    i.style.cssText = `position:absolute;max-width:none;width:${nw * s}px;height:${nh * s}px;left:${bw / 2 - (sx + sw / 2) * s}px;top:${bh / 2 - (sy + sh / 2) * s}px`;
    b.prepend(i);
  });
})();
</script>
<script src="../../../../kit/kit.js"></script>
</body></html>
