.rt{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}

.mega{font:800 150px/.8 var(--b-cond);letter-spacing:-4px;font-variant-numeric:tabular-nums}
