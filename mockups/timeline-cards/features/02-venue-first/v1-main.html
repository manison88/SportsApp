<!doctype html>
<html><head><meta charset="utf-8"><title>Venue First</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
:root{--trophy:#e6c887;--stub:#171a26;}
body.phone{background:var(--ink)}
.hdr{position:absolute;left:16px;right:16px;top:58px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font:800 34px/1 var(--f-cond);letter-spacing:.2px}
.hdr svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.search{position:absolute;left:16px;right:16px;top:104px;height:38px;border-radius:11px;background:#1b1c22;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-3);font:400 16px/1 var(--f-ui)}
.search svg{width:16px;height:16px;stroke:var(--text-3);stroke-width:2.2;fill:none;stroke-linecap:round}
.fade{position:absolute;left:0;right:0;top:0;height:60px;z-index:50;background:linear-gradient(var(--ink) 40%,transparent);pointer-events:none}
.card{position:absolute;left:16px;width:361px;border-radius:22px;overflow:hidden;background:var(--stub)}
.ph-wrap{position:relative;width:100%;overflow:hidden;background:#0b0c10}
.ph-wrap img{display:block}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,8,.38) 0%,rgba(5,5,8,0) 22%,rgba(5,5,8,0) 42%,rgba(8,9,14,.72) 78%,var(--stub) 100%)}
.tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(125,135,152,.28),rgba(20,24,34,.55))}
.stub{position:relative;height:92px;background:var(--stub)}
.stub::before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:1.5px dashed rgba(255,255,255,.2)}
.notch{position:absolute;top:-8px;width:16px;height:16px;border-radius:8px;background:var(--ink);z-index:5}
.notch.l{left:-8px}.notch.r{right:-8px}
.tile{display:inline-grid;place-items:center;border-radius:7px;font-family:var(--f-cond);font-weight:800;letter-spacing:.3px;line-height:1}
.chip{position:absolute;z-index:6;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;font:700 11px/1 var(--f-ui);letter-spacing:1.3px;color:#fff;background:rgba(24,24,28,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:.5px solid rgba(255,255,255,.2)}
.badge{position:absolute;z-index:6;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;gap:6px;font:800 10.5px/1 var(--f-ui);letter-spacing:1.4px;color:#1d1608;background:linear-gradient(135deg,#f3dba3,#d9b568)}
.badge i{width:6px;height:6px;border-radius:3px;background:#1d1608;display:block;transform:rotate(45deg)}
.keyline{position:absolute;inset:0;border-radius:22px;border:1.5px solid var(--trophy);pointer-events:none;z-index:20;box-shadow:inset 0 0 18px rgba(230,200,135,.14)}
h2.hl{position:absolute;z-index:6;left:18px;right:18px;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}

.eyebrow-v{position:absolute;z-index:6;left:18px;font:700 11px/1 var(--f-ui);letter-spacing:2.2px;color:rgba(255,255,255,.85);text-shadow:0 1px 10px rgba(0,0,0,.6)}
h2.hl{font-size:50px;line-height:.9;letter-spacing:.1px;left:18px;bottom:16px}
.cells{position:absolute;left:18px;top:0;bottom:0;display:flex;align-items:center}
.cell{padding:0 13px;border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.cell:first-child{padding-left:0;border-left:0}
.cell small{font:700 8.5px/1 var(--f-ui);letter-spacing:1.5px;color:var(--text-3)}
.cell b{font:700 17px/1 var(--f-cond);letter-spacing:.4px;color:var(--text);display:flex;align-items:center;gap:5px;white-space:nowrap}
.cell b svg{width:16px;height:16px;stroke:var(--signal);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bug{position:absolute;right:16px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:6px;border-left:1px solid rgba(255,255,255,.1);padding-left:12px}
.bug .r{display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 21px/1 var(--f-cond);min-width:74px}
.bug .lo{color:var(--text-2)}
</style></head>
<body class="phone">
<div class="hdr"><h1>TIMELINE</h1><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></div>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>Teams, places, years</div>
<div class="card" style="top:164px">
  <div class="ph-wrap" style="height:420px">
    <img class="ph graded" src="../../../photos/wrigley-scoreboard.jpg" style="position:absolute;left:-260.7px;top:-15.3px;width:802.2px;height:450.6px;max-width:none">
    <div class="scrim"></div>
    <div class="chip" style="left:14px;top:14px">SAT · JUL 4</div>
    
    <div class="eyebrow-v" style="bottom:118px">WRIGLEY FIELD · CHICAGO</div>
    <h2 class="hl">CHICAGO 5,<br>MILWAUKEE 4.</h2>
  </div>
  <div class="stub">
    <i class="notch l"></i><i class="notch r"></i>
    <div class="cells">
      <div class="cell"><small>FIRST PITCH</small><b>1:20 PM</b></div>
      <div class="cell"><small>SECTION</small><b>314</b></div>
      <div class="cell"><small>WEATHER</small><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></svg>84°F</b></div>
    </div>
    <div class="bug"><div class="r"><span class="tile" style="background:#f4c24b;color:#1a1405;width:34px;height:22px;font-size:13px;">MIL</span><span class="tnum lo">4</span></div><div class="r"><span class="tile" style="background:#2f6bff;color:#fff;width:34px;height:22px;font-size:13px;">CHC</span><span class="tnum ">5</span></div></div>
  </div>
  
</div>
<div class="card" style="top:700px">
  <div class="ph-wrap" style="height:420px">
    <img class="ph graded" src="../../../photos/wrigley-night.jpg" style="position:absolute;left:-180.5px;top:-592.2px;width:859.5px;height:1146.0px;max-width:none">
    <div class="scrim"></div>
    <div class="chip" style="left:14px;top:14px">SUN · OCT 30</div>
    <div class="badge" style="right:14px;top:14px"><i></i>WORLD SERIES</div>
    <div class="eyebrow-v" style="bottom:118px">WRIGLEY FIELD · CHICAGO</div>
    <h2 class="hl">CHICAGO 3,<br>CLEVELAND 2.</h2>
  </div>
  <div class="stub">
    <i class="notch l"></i><i class="notch r"></i>
    <div class="cells">
      <div class="cell"><small>FIRST PITCH</small><b>7:08 PM</b></div>
      <div class="cell"><small>SECTION</small><b>314</b></div>
      <div class="cell"><small>WEATHER</small><b><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>63°F</b></div>
    </div>
    <div class="bug"><div class="r"><span class="tile" style="background:#e8344a;color:#fff;width:34px;height:22px;font-size:13px;">CLE</span><span class="tnum lo">2</span></div><div class="r"><span class="tile" style="background:#2f6bff;color:#fff;width:34px;height:22px;font-size:13px;">CHC</span><span class="tnum ">3</span></div></div>
  </div>
  <div class="keyline"></div>
</div>
<script src="../../../kit/kit.js"></script>
</body></html>
