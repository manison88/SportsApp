<!doctype html>
<html><head><meta charset="utf-8"><title>Result Stripe States</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
:root{--trophy:#e6c887;--stub:#171a26;}
body.phone{background:var(--ink)}
.hdr{position:absolute;left:16px;right:16px;top:58px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font:800 34px/1 var(--f-cond);letter-spacing:.2px}
.hdr svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.search{position:absolute;left:16px;right:16px;top:104px;height:38px;border-radius:11px;background:#1b1c22;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-3);font:400 16px/1 var(--f-ui)}
.search svg{width:16px;height:16px;stroke:var(--text-3);stroke-width:2.2;fill:none;stroke-linecap:round}
.fade{position:absolute;left:0;right:0;top:0;height:60px;z-index:50;background:linear-gradient(var(--ink) 40%,transparent);pointer-events:none}
.card{position:absolute;left:16px;width:361px;border-radius:22px;overflow:hidden;background:var(--stub)}
.ph-wrap{position:relative;width:100%;overflow:hidden;background:#0b0c10}
.ph-wrap img{display:block}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,8,.38) 0%,rgba(5,5,8,0) 22%,rgba(5,5,8,0) 42%,rgba(8,9,14,.72) 78%,var(--stub) 100%)}
.tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(125,135,152,.28),rgba(20,24,34,.55))}
.stub{position:relative;height:92px;background:var(--stub)}
.stub::before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:1.5px dashed rgba(255,255,255,.2)}
.notch{position:absolute;top:-8px;width:16px;height:16px;border-radius:8px;background:var(--ink);z-index:5}
.notch.l{left:-8px}.notch.r{right:-8px}
.tile{display:inline-grid;place-items:center;border-radius:7px;font-family:var(--f-cond);font-weight:800;letter-spacing:.3px;line-height:1}
.chip{position:absolute;z-index:6;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;font:700 11px/1 var(--f-ui);letter-spacing:1.3px;color:#fff;background:rgba(24,24,28,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:.5px solid rgba(255,255,255,.2)}
.badge{position:absolute;z-index:6;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;gap:6px;font:800 10.5px/1 var(--f-ui);letter-spacing:1.4px;color:#1d1608;background:linear-gradient(135deg,#f3dba3,#d9b568)}
.badge i{width:6px;height:6px;border-radius:3px;background:#1d1608;display:block;transform:rotate(45deg)}
.keyline{position:absolute;inset:0;border-radius:22px;border:1.5px solid var(--trophy);pointer-events:none;z-index:20;box-shadow:inset 0 0 18px rgba(230,200,135,.14)}
h2.hl{position:absolute;z-index:6;left:18px;right:18px;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}

.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;z-index:8;background:var(--sc)}
.tab{position:absolute;z-index:7;left:0;top:14px;width:58px;height:48px;border-radius:0 12px 12px 0;background:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:5px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tab b{font:800 27px/.9 var(--f-cond)}
.tab span{font:800 8.5px/1 var(--f-ui);letter-spacing:1.6px;margin-top:3px;padding-left:1.6px}
.card.loss .tab{color:#eef1f6;background:linear-gradient(160deg,#8c95a6,#6b7486)}
.card.loss::before{background:#7d8798}
h2.hl{font-size:44px;line-height:.92;letter-spacing:.1px;left:22px;bottom:14px}
.stub .lucky{position:absolute;left:22px;top:0;bottom:0;width:172px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.lucky .eb{display:flex;align-items:center;gap:6px;font:700 9.5px/1 var(--f-ui);letter-spacing:1.6px;color:var(--signal)}
.lucky .eb svg{width:12px;height:12px;fill:var(--signal)}
.lucky p{font:600 12.5px/1.28 var(--f-ui);color:var(--text);letter-spacing:-.1px}
.lucky p em{font-style:normal;font-family:var(--f-cond);font-weight:800;font-size:17px;letter-spacing:.2px;color:var(--signal-soft);margin-right:1px}
.bug{position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center;gap:5px;font:800 21px/1 var(--f-cond)}
.bug .sc{min-width:14px}
.bug .lo{color:var(--text-2)}
.bug .gap{width:4px}
</style></head>
<body class="phone">

<div class="card" style="top:62px;--sc:#2f6bff">
  <div class="ph-wrap" style="height:260px">
    <img class="ph graded" src="../../../photos/wrigley-night.jpg" style="position:absolute;left:-180.5px;top:-672.2px;width:859.5px;height:1146.0px;max-width:none">
    <div class="scrim"></div>
    <div class="tab"><b>W</b><span>WIN</span></div>
    <div class="badge" style="left:70px;top:25px"><i></i>WORLD SERIES</div>
    <div class="chip" style="right:14px;top:25px">OCT 30, 2016</div>
    <h2 class="hl">CHICAGO 3,<br>CLEVELAND 2.</h2>
  </div>
  <div class="stub">
    <i class="notch l"></i><i class="notch r"></i>
    <div class="lucky"><div class="eb"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>LUCKY CHARM</div><p>Game 5, down 3–1. You saw the comeback start</p></div>
    <div class="bug"><span class="tile" style="background:#e8344a;color:#fff;width:34px;height:22px;font-size:13px;">CLE</span><span class="sc tnum lo" style="color:">2</span><span class="gap"></span><span class="tile" style="background:#2f6bff;color:#fff;width:34px;height:22px;font-size:13px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9);">CHC</span><span class="sc tnum " style="color:#fff">3</span></div>
  </div>
  <div class="keyline"></div>
</div>
<div class="card loss" style="top:434px;--sc:#7d8798">
  <div class="ph-wrap" style="height:260px">
    <canvas class="photo" data-style="arena" data-seed="11" data-accent="#e8213f" data-secondary="#7a4fd0"></canvas><div class="tint"></div>
    <div class="scrim"></div>
    <div class="tab"><b>L</b><span>LOSS</span></div>
    
    <div class="chip" style="right:14px;top:25px">JAN 3, 2025</div>
    <h2 class="hl">LOS ANGELES 118,<br>CHICAGO 104.</h2>
  </div>
  <div class="stub">
    <i class="notch l"></i><i class="notch r"></i>
    <div class="lucky"><div class="eb"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>LUCKY CHARM</div><p>Chicago is 2–3 at United Center with you</p></div>
    <div class="bug"><span class="tile" style="background:#7a4fd0;color:#fff;width:34px;height:22px;font-size:13px;">LAL</span><span class="sc tnum " style="color:#fff">118</span><span class="gap"></span><span class="tile" style="background:#e8213f;color:#fff;width:34px;height:22px;font-size:13px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9);">CHI</span><span class="sc tnum lo" style="color:">104</span></div>
  </div>
  
</div><div class="fade"></div>
<script src="../../../kit/kit.js"></script>
</body></html>
