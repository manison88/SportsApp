<style>
  .bar { position:absolute; top:56px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; z-index:10; }
  .ys { --chip:#171a21; }
  .poster { position:absolute; left:20px; right:20px; top:112px; height:624px; border-radius:18px; background:#f05a1a; color:#fff; overflow:hidden; padding:16px 16px; box-shadow:0 18px 40px rgba(0,0,0,.5); }
  .yr { font:800 148px/.78 var(--b-cond); letter-spacing:-3px; margin-left:-3px; }
  .ln { font:800 36px/.92 var(--b-cond); text-transform:uppercase; color:#0b162a; margin-top:14px; }
  .col { display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:122px; gap:6px; margin-top:18px; }
  .t { position:relative; border-radius:10px; overflow:hidden; background:#111; }
  .t img { position:absolute; max-width:none; filter:contrast(1.05) saturate(.9); }
  .t canvas { position:absolute; inset:0; width:100%; height:100%; }
  .t::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.7)); }
  .t .d { position:absolute; left:8px; bottom:7px; z-index:2; font:800 14px/1 var(--b-cond); letter-spacing:1px; text-transform:uppercase; }
  .t .W { position:absolute; right:6px; top:6px; z-index:2; width:22px; height:22px; border-radius:6px; font-size:13px; }
  .t.m { background:#0b162a; display:flex; flex-direction:column; justify-content:flex-end; padding:8px; }
  .t.m::after { display:none; }
  .t.m b { font:800 34px/.9 var(--b-cond); font-variant-numeric:tabular-nums; }
  .t.m span { font:800 14px/1 var(--b-cond); letter-spacing:2px; color:#ffb547; margin-top:2px; }
  .stats { display:flex; margin-top:16px; color:#0b162a; }
  .stats div { flex:1; }
  .stats div + div { padding-left:14px; box-shadow:inset 1px 0 0 rgba(11,22,42,.3); }
  .stats b { display:block; font:800 44px/.9 var(--b-cond); }
  .stats span { display:block; margin-top:5px; font:700 13px/1 var(--b-cond); letter-spacing:1.6px; text-transform:uppercase; }
  .credit { position:absolute; left:16px; right:16px; bottom:18px; text-align:center; font:600 14px/1 var(--b-cond); letter-spacing:2.6px; text-transform:uppercase; color:#0b162a; }
  .credit b { font-weight:800; }
</style></head>
