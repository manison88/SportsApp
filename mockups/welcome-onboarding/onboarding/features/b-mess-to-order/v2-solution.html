:root{--amber:#ffb547;--ink2:#07080a;--cond:"Barlow Condensed","Oswald",sans-serif}
body.phone{background:#07080a;color:#fff;font-family:Inter,sans-serif}
.ph{position:absolute;inset:0;background-repeat:no-repeat;background-color:#15171c}
