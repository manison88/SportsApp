<style>
.top{position:absolute;left:20px;right:20px;top:112px}
.h{font-size:46px;line-height:.92}
.tk{position:absolute;left:36px;width:320px;top:206px;transform:rotate(-3deg);filter:drop-shadow(0 24px 30px rgba(0,0,0,.6))}
.tk .a{height:330px;border-radius:16px 16px 0 0;background:#14161b;position:relative;overflow:hidden}
.tk .a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) contrast(1.05)}
.tk .a .in{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.sc{display:flex;align-items:center;gap:10px}
.sc b{font:800 64px/.9 var(--b-cond)}

.tk .m{height:86px;background:var(--champ);color:#14110a;border-radius:0 0 16px 16px;position:relative;padding:20px 18px 0;margin-top:0}
.tk .m::before{content:"";position:absolute;left:14px;right:14px;top:0;border-top:2px dashed rgba(20,17,10,.35)}
.tk .m i{position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:#07080a}.tk .m i:first-child{left:-11px}.tk .m i+i{right:-11px}
.tk .m::after{display:none;content:"";position:absolute;left:-10px;right:-10px;top:-10px;height:20px;background:radial-gradient(circle at 0 10px,#07080a 9px,transparent 9.5px) left/20px 20px no-repeat,radial-gradient(circle at 20px 10px,#07080a 9px,transparent 9.5px) right/20px 20px no-repeat}
.m .r{display:flex;justify-content:space-between;font:800 16px/1 var(--b-cond);letter-spacing:1.4px;text-transform:uppercase}
.m .s{font:600 12px/1.2 var(--b-ui);margin-top:8px;opacity:.7}
.samp{position:absolute;left:0;right:0;top:690px;text-align:center}

<div class="m"><i></i><i></i><div class="r"><span>Wrigley Field</span><span>Jun 14, 2025</span></div><div class="s">Found from 14 photos on this iPhone</div></div></div>
