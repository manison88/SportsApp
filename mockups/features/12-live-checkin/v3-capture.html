<!doctype html>
<html><head><meta charset="utf-8"><title>Capture</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #07070a; }
  .bg { position: absolute; inset: -40px; }
  .bg img { filter: blur(26px) brightness(.42) saturate(1.2); transform: scale(1.1); }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 40% at 50% 50%, rgba(255,170,50,.18), transparent 70%), linear-gradient(180deg, rgba(7,7,10,.55), rgba(7,7,10,.2) 40%, rgba(7,7,10,.85) 82%); }

  .top { position: absolute; top: 60px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  .chk { display: flex; align-items: center; gap: 10px; }
  .chk .ic { width: 34px; height: 34px; border-radius: 50%; background: rgba(57,226,122,.16); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(57,226,122,.45); }
  .chk .ic svg { width: 16px; height: 16px; stroke: #4be38a; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .chk b { display: block; font: 600 15px/1.15 var(--f-ui); letter-spacing: -.15px; }
  .chk span { display: block; font: 500 12px/1.3 var(--f-ui); color: var(--text-2); margin-top: 1px; }
  .btn-circle svg { width: 16px; height: 16px; }

  .score { position: absolute; top: 120px; left: 20px; right: 20px; height: 56px; border-radius: 18px; display: flex; align-items: center; padding: 0 16px; z-index: 5; gap: 14px; }
  .score .t { display: flex; align-items: center; gap: 8px; font: 700 15px/1 var(--f-ui); letter-spacing: .6px; }
  .score .t i { width: 8px; height: 8px; border-radius: 2px; }
  .score .n { font: 700 24px/1 var(--f-tight); letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
  .score .dim { color: var(--text-2); }
  .score .inn { margin-left: auto; text-align: right; font: 600 12px/1.25 var(--f-ui); color: var(--text-2); }
  .score .inn b { display: block; color: #fff; font-size: 13px; }
  .score .vr { width: 1px; height: 22px; background: rgba(255,255,255,.14); }

  .stage { position: absolute; left: 0; right: 0; top: 214px; height: 380px; display: grid; place-items: center; z-index: 4; }
  .halo { position: absolute; width: 420px; height: 420px; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,176,60,.42) 0%, rgba(255,150,40,.12) 38%, transparent 64%); }
  .ring2 { position: absolute; left: 50%; top: 50%; width: 352px; height: 352px; transform: translate(-50%,-50%); border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,200,120,.12); }
  .ticks { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .btn { position: relative; width: 252px; height: 252px; border-radius: 50%;
    background: radial-gradient(120% 120% at 30% 22%, #ffe0a3 0%, #ffb547 38%, #f08a16 78%, #c4650a 100%);
    box-shadow: 0 0 0 8px rgba(7,7,10,.65), 0 0 0 9px rgba(255,200,120,.35), 0 40px 90px rgba(255,140,30,.45), inset 0 -10px 30px rgba(140,60,0,.35), inset 0 6px 16px rgba(255,255,255,.45);
    display: grid; place-items: center; text-align: center; color: #1c1105; }
  .btn::before { content: ""; position: absolute; left: 34px; right: 34px; top: 16px; height: 90px; border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0)); }
  .btn .e { font: 700 10.5px/1 var(--f-ui); letter-spacing: 2.2px; text-transform: uppercase; opacity: .7; }
  .btn h1 { font: 400 46px/.94 var(--f-serif); letter-spacing: -.8px; margin-top: 10px; }
  .btn h1 em { font-style: italic; }
  .btn .tm { font: 600 12.5px/1 var(--f-ui); margin-top: 14px; opacity: .72; font-variant-numeric: tabular-nums; }

  .cap { position: absolute; top: 612px; left: 40px; right: 40px; text-align: center; z-index: 5;
    font: 400 14px/1.45 var(--f-ui); color: var(--text-2); }
  .cap b { color: var(--text); font-weight: 600; }

  .rail { position: absolute; left: 24px; right: 24px; top: 704px; z-index: 5; }
  .rail .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .rail .hd .eyebrow { color: var(--text-2); }
  .rail .hd span:last-child { font: 600 12px/1 var(--f-ui); color: var(--signal); }
  .track { position: relative; height: 34px; }
  .track .ln { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: rgba(255,255,255,.12); border-radius: 1px; }
  .track .pr { position: absolute; left: 0; width: 75%; top: 10px; height: 2px; background: linear-gradient(90deg, rgba(255,181,71,.25), rgba(255,181,71,.8)); border-radius: 1px; }
  .track .m { position: absolute; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--signal); transform: translateX(-50%);
    box-shadow: 0 0 0 3px #0d0b0a, 0 0 12px rgba(255,181,71,.7); }
  .track .now { position: absolute; top: 1px; width: 20px; height: 20px; border-radius: 50%; transform: translateX(-50%); left: 75%;
    box-shadow: inset 0 0 0 2px #fff, 0 0 0 6px rgba(255,255,255,.1); background: #0d0b0a; }
  .track .now::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--live); }
  .track .lb { position: absolute; top: 24px; transform: translateX(-50%); font: 600 10px/1 var(--f-ui); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .track .lb.on { color: #fff; }
</style></head>
<body class="phone">
  <div class="bg"><img class="ph" src="../../photos/wrigley-night-2.jpg"></div>
  <div class="grain" style="opacity:.25"></div>

  <div class="top">
    <div class="chk">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div><b>Wrigley Field</b><span>Checked in · Sec 209, Row 8 · with Maya</span></div>
    </div>
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></svg></div>
  </div>

  <div class="score glass">
    <span class="t"><i style="background:#2f6bff"></i>CHC</span><span class="n">4</span>
    <span class="vr"></span>
    <span class="t dim"><i style="background:#ffc52f"></i>MIL</span><span class="n dim">3</span>
    <div class="inn"><b>▾ Bot 7th</b>1 out · runner on 2nd</div>
  </div>

  <div class="stage">
    <div class="halo"></div>
    <div class="ring2"></div>
    <svg class="ticks" width="330" height="330" viewBox="0 0 330 330" id="ticks"></svg>
    <div class="btn">
      <div>
        <div class="e">Tap to keep</div>
        <h1>Save this<br><em>moment</em></h1>
        <div class="tm">Last 0:30 · ready</div>
      </div>
    </div>
  </div>

  <div class="cap">Keeps the <b>last 30 seconds</b>: the score, the crowd’s roar, and the next photos you take.</div>

  <div class="rail">
    <div class="hd"><span class="eyebrow">Tonight’s moments</span><span>6 saved</span></div>
    <div class="track" id="track">
      <div class="ln"></div><div class="pr"></div>
    </div>
  </div>
<script>
  // 60 ticks: the 30-second buffer, full
  const svg = document.getElementById('ticks'); let h = '';
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2, r1 = 152, r2 = i % 5 === 0 ? 162 : 158;
    const lit = i < 60;
    const op = 0.25 + 0.75 * (i / 59);
    h += `<line x1="${165 + Math.cos(a) * r1}" y1="${165 + Math.sin(a) * r1}" x2="${165 + Math.cos(a) * r2}" y2="${165 + Math.sin(a) * r2}" stroke="rgba(255,200,120,${op.toFixed(2)})" stroke-width="${i % 5 === 0 ? 2.4 : 1.6}" stroke-linecap="round"/>`;
  }
  svg.innerHTML = h;
  // innings rail 1..9, moments saved
  const tr = document.getElementById('track'); const pos = n => ((n - 1) / 8 * 100);
  let t = '';
  for (let n = 1; n <= 9; n++) t += `<span class="lb ${n === 7 ? 'on' : ''}" style="left:${pos(n)}%">${n}</span>`;
  [1.4, 2.5, 3.2, 5.4, 6.1, 6.6].forEach(m => t += `<span class="m" style="left:${pos(m)}%"></span>`);
  t += `<span class="now"></span>`;
  tr.insertAdjacentHTML('beforeend', t);
</script>
<script src="../../kit/kit.js"></script>
</body></html>
