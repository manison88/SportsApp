<!doctype html>
<html><head><meta charset="utf-8"><title>Ambient Glow</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #020818; }
  .bloom { position: absolute; inset: 0;
    background:
      radial-gradient(42% 26% at 50% 44%, rgba(120,170,255,.75), transparent 70%),
      radial-gradient(70% 44% at 50% 44%, rgba(47,107,255,.85), transparent 72%),
      radial-gradient(110% 70% at 50% 46%, rgba(20,60,190,.9), transparent 80%),
      radial-gradient(90% 40% at 50% 112%, rgba(204,52,51,.55), transparent 70%),
      linear-gradient(180deg, #020818, #04123a 50%, #0a0b26); }
  .rings { position: absolute; left: -104px; top: 76px; width: 600px; height: 600px; -webkit-mask-image: linear-gradient(180deg, #000 0, #000 350px, transparent 372px, transparent 424px, #000 452px); }
  .rings i { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%,-50%);
    box-shadow: inset 0 0 0 1.5px rgba(200,220,255,var(--a)), 0 0 30px rgba(120,170,255,calc(var(--a) * .8)), inset 0 0 30px rgba(120,170,255,calc(var(--a) * .6)); }

  .top { position: absolute; top: 62px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .top .eyebrow { color: rgba(220,232,255,.75); }
  .top .x { font: 600 13px/1 var(--f-ui); color: rgba(220,232,255,.75); height: 32px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center;
    background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.2); }

  .run { position: absolute; top: 176px; left: 0; right: 0; text-align: center; z-index: 5; }
  .run span { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 15px;
    background: rgba(255,255,255,.95); color: #0a1f5c; font: 800 11px/1 var(--f-ui); letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 0 30px rgba(170,200,255,.8); }
  .run span i { width: 7px; height: 7px; border-radius: 50%; background: #cc3433; }

  .big { position: absolute; top: 226px; left: 0; right: 0; text-align: center; z-index: 5;
    font: 800 250px/.82 var(--f-tight); letter-spacing: -10px; color: #fff; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(170,205,255,.9), 0 0 120px rgba(90,140,255,.8); }
  .code { position: absolute; top: 450px; left: 0; right: 0; text-align: center; z-index: 5;
    font: 700 15px/1 var(--f-ui); letter-spacing: 6px; color: rgba(235,242,255,.92); padding-left: 6px; }
  .opp { position: absolute; top: 478px; left: 0; right: 0; text-align: center; z-index: 5;
    font: 600 14px/1 var(--f-ui); letter-spacing: 3px; color: rgba(220,232,255,.55); }
  .opp b { color: #ffd35a; font-weight: 700; }

  .line { position: absolute; top: 548px; left: 32px; right: 32px; text-align: center; z-index: 5;
    font: italic 400 30px/1.1 var(--f-serif); color: #fff; letter-spacing: -.3px; }
  .meta { position: absolute; top: 590px; left: 0; right: 0; text-align: center; z-index: 5;
    font: 500 13px/1.3 var(--f-ui); color: rgba(220,232,255,.62); }

  .pulses { position: absolute; left: 32px; right: 32px; top: 662px; z-index: 5; }
  .pulses .row { display: grid; grid-template-columns: 36px repeat(9, 1fr); align-items: center; height: 22px; }
  .pulses .row span { font: 700 10px/1 var(--f-ui); letter-spacing: 1.4px; color: rgba(220,232,255,.55); }
  .pulses .c { display: grid; place-items: center; }
  .pulses .c i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .pulses .c i.chc { width: 10px; height: 10px; background: #a9c6ff; box-shadow: 0 0 10px #6f9dff, 0 0 20px #2f6bff; }
  .pulses .c i.mil { width: 10px; height: 10px; background: #ffd35a; box-shadow: 0 0 10px rgba(255,197,47,.8); }
  .pulses .c i.now { width: 14px; height: 14px; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.18), 0 0 18px #fff, 0 0 30px #6f9dff; }
  .pulses .nums { display: grid; grid-template-columns: 36px repeat(9, 1fr); margin-top: 4px; }
  .pulses .nums span { text-align: center; font: 600 10px/1 var(--f-ui); color: rgba(220,232,255,.4); font-variant-numeric: tabular-nums; }
  .pulses .nums span.on { color: #fff; }

  .hint { position: absolute; left: 0; right: 0; top: 758px; text-align: center; z-index: 5; font: 600 12.5px/1 var(--f-ui); color: rgba(235,242,255,.8); }
  .hint b { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); margin-right: 8px; vertical-align: 1px; box-shadow: 0 0 8px var(--signal); }
</style></head>
<body class="phone">
  <div class="bloom"></div>
  <div class="rings" id="rings"></div>
  <div class="grain" style="opacity:.3"></div>

  <div class="top">
    <span class="eyebrow">Wrigley · Sec 209 · Ambient</span>
    <span class="x">Done</span>
  </div>

  <div class="run"><span><i></i>Run · Chicago</span></div>
  <div class="big">4</div>
  <div class="code">CHICAGO</div>
  <div class="opp">MILWAUKEE <b>3</b></div>

  <div class="line">Go-ahead double off the ivy.</div>
  <div class="meta">Bottom 7th · 1 out · 9:38 PM</div>

  <div class="pulses" id="pulses"></div>

  <div class="hint"><b></b>Tap anywhere to save this moment</div>
<script>
  const R = document.getElementById('rings'); let h = '';
  [[236,.55],[316,.32],[404,.18],[500,.09]].forEach(([d,a]) => h += `<i style="width:${d}px;height:${d}px;--a:${a}"></i>`);
  R.innerHTML = h;
  const runs = { MIL: [1,0,0,0,2,0,0], CHC: [0,2,0,0,0,1,1] };
  let p = '';
  ['MIL','CHC'].forEach(t => {
    p += `<div class="row"><span>${t}</span>`;
    for (let i = 0; i < 9; i++) {
      const v = runs[t][i]; let cls = v ? t.toLowerCase() : '';
      if (t === 'CHC' && i === 6) cls = 'now';
      p += `<div class="c"><i class="${cls}"></i></div>`;
    }
    p += `</div>`;
  });
  p += `<div class="nums"><span></span>${[1,2,3,4,5,6,7,8,9].map(n => `<span class="${n===7?'on':''}">${n}</span>`).join('')}</div>`;
  document.getElementById('pulses').innerHTML = p;
</script>
<script src="../../kit/kit.js"></script>
</body></html>
