<!doctype html>
<html><head><meta charset="utf-8"><title>Win-prob curve</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: radial-gradient(120% 60% at 50% 42%, #0d1426 0%, #070809 60%, #050506 100%); }
  .topbar { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .topbar .mid { font: 600 15px/1 var(--f-ui); letter-spacing: -.2px; }
  .head { position: absolute; left: 24px; right: 24px; top: 116px; }
  .head .eyebrow { color: var(--signal); }
  h1 { margin-top: 10px; font: 400 36px/1.0 var(--f-serif); letter-spacing: -.5px; }
  h1 em { color: #ffd9a0; }
  .sub { margin-top: 10px; font: 400 13px/1.35 var(--f-ui); color: var(--text-2); }
  .score { position: absolute; right: 24px; top: 118px; text-align: right; }
  .score .ln { display: flex; gap: 8px; justify-content: flex-end; align-items: baseline; font: 700 13px/1 var(--f-ui); letter-spacing: .4px; }
  .score .ln b { font: 800 22px/1 var(--f-cond); width: 16px; text-align: right; }
  .score .ln.lose { color: var(--text-3); }
  .score .ln + .ln { margin-top: 6px; }
  .score .fin { margin-top: 8px; font: 600 9.5px/1 var(--f-ui); letter-spacing: 1.6px; color: var(--text-3); }
  svg#chart { position: absolute; left: 0; top: 0; width: 393px; height: 852px; overflow: visible; }
  .pin { position: absolute; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px #fff, 0 8px 18px rgba(0,0,0,.6); }
  .pin.sel { box-shadow: 0 0 0 2.5px var(--signal), 0 0 0 7px rgba(255,181,71,.18), 0 12px 30px rgba(0,0,0,.7); }
  .tag { position: absolute; font: 600 9.5px/1 var(--f-mono); color: var(--text-2); white-space: nowrap; transform: translateX(-50%); letter-spacing: .2px; }
  .card { position: absolute; left: 16px; right: 16px; top: 640px; height: 148px; border-radius: 24px; background: rgba(22,23,28,.9);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.1), 0 24px 50px rgba(0,0,0,.5); display: flex; padding: 12px; gap: 14px; }
  .card .ph { width: 96px; height: 124px; border-radius: 14px; overflow: hidden; flex: none; position: relative; }
  .card .ph::after { content: "+14s"; position: absolute; left: 6px; bottom: 6px; font: 700 9px/1 var(--f-mono); padding: 4px 5px; border-radius: 5px; background: rgba(0,0,0,.55); color: var(--signal); }
  .card .tx { padding-top: 6px; flex: 1; min-width: 0; }
  .card .eyebrow { color: var(--signal); letter-spacing: 1.4px; font-size: 10px; }
  .card h2 { margin-top: 8px; font: 400 23px/1.05 var(--f-serif); letter-spacing: -.2px; }
  .card .delta { margin-top: 12px; display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--f-ui); color: var(--text-2); }
  .card .delta .chip { padding: 5px 8px; border-radius: 8px; background: rgba(47,107,255,.18); color: #8fb0ff; font: 700 11px/1 var(--f-mono); }
  .nav { position: absolute; right: 26px; top: 652px; display: flex; gap: 4px; }
  .nav i { width: 5px; height: 5px; border-radius: 3px; background: var(--text-4); }
  .nav i.on { width: 14px; background: var(--signal); }
</style></head>
<body class="phone">
  <div class="topbar">
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="mid">World Series · Game 5</div>
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>

  <div class="head">
    <div class="eyebrow">◆ You were there · 6 photos</div>
    <h1>Where your night<br>met <em>the game.</em></h1>
    <div class="sub">Wrigley Field · Sun, Oct 30, 2016 · with Dad</div>
  </div>
  <div class="score">
    <div class="ln lose"><span>CLE</span><b class="tnum">2</b></div>
    <div class="ln"><span>CHC</span><b class="tnum">3</b></div>
    <div class="fin">FINAL</div>
  </div>

  <svg id="chart"></svg>
  <div id="pins"></div>

  <div class="card">
    <div class="ph"><img class="ph graded" src="../../photos/wrigley-night.jpg" style="object-position:62% 30%"></div>
    <div class="tx">
      <div class="eyebrow">Bot 4th · 8:34:26 PM</div>
      <h2>Bryant ties it. You took this 14 seconds later.</h2>
      <div class="delta"><span class="chip">33% → 48%</span><span>Chicago win probability</span></div>
    </div>
  </div>
  <div class="nav"><i></i><i class="on"></i><i></i><i></i><i></i></div>

<script>
  // Chicago win probability by minutes after first pitch (7:08 PM)
  const WP = [[0,.54],[6,.52],[12,.50],[18,.53],[24,.51],[27,.39],[34,.37],[40,.38],[48,.39],[56,.36],[62,.38],[72,.35],[80,.33],[86,.48],[88,.55],[90,.61],[92,.69],[95,.75],[100,.77],[108,.79],[116,.81],[124,.82],[127,.76],[129,.67],[134,.66],[142,.69],[148,.71],[150,.73],[160,.76],[170,.80],[178,.79],[186,.84],[194,.86],[200,.90],[206,.93],[210,.96],[214,1.0]];
  const X0 = 24, X1 = 356, T = 214, Y100 = 352, Y0 = 592, YM = (Y100 + Y0) / 2;
  const x = m => X0 + (X1 - X0) * m / T, y = p => Y0 - (Y0 - Y100) * p;
  const wpAt = m => { for (let i = 1; i < WP.length; i++) if (WP[i][0] >= m) { const [a, pa] = WP[i-1], [b, pb] = WP[i]; return pa + (pb - pa) * (m - a) / (b - a); } return 1; };
  const line = WP.map(([m, p], i) => (i ? 'L' : 'M') + x(m).toFixed(1) + ' ' + y(p).toFixed(1)).join(' ');
  const area = line + ` L${x(T)} ${YM} L${x(0)} ${YM} Z`;
  let s = `<defs>
    <linearGradient id="gc" x1="0" y1="${Y100}" x2="0" y2="${YM}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2f6bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f6bff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="${YM}" x2="0" y2="${Y0}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e8344a" stop-opacity=".04"/><stop offset="1" stop-color="#e8344a" stop-opacity=".5"/></linearGradient>
    <linearGradient id="ln" x1="${X0}" x2="${X1}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cfd8ff"/><stop offset=".9" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
    <clipPath id="top"><rect x="0" y="0" width="393" height="${YM}"/></clipPath>
    <clipPath id="bot"><rect x="0" y="${YM}" width="393" height="400"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  // innings grid
  const starts = [0,24,48,72,96,120,146,170,194];
  starts.forEach((m, i) => {
    s += `<line x1="${x(m)}" x2="${x(m)}" y1="${Y100 - 6}" y2="${Y0}" stroke="rgba(255,255,255,${i ? .06 : .12})"/>`;
    s += `<text x="${x(m) + (i < 8 ? (x(starts[i+1]) - x(m)) / 2 : (x(T) - x(m)) / 2)}" y="${Y0 + 20}" fill="rgba(245,241,234,.4)" font-family="Inter" font-weight="600" font-size="10" text-anchor="middle">${i + 1}</text>`;
  });
  s += `<line x1="${X0}" x2="${X1}" y1="${YM}" y2="${YM}" stroke="rgba(255,255,255,.22)" stroke-dasharray="2 4"/>`;
  s += `<text x="${X0}" y="${Y100 - 14}" fill="#8fb0ff" font-family="Inter" font-weight="700" font-size="9.5" letter-spacing="1.4">CHC WINS ↑</text>`;
  s += `<text x="${X0}" y="${Y0 + 40}" fill="rgba(245,241,234,.4)" font-family="JetBrains Mono" font-weight="600" font-size="9.5">7:08 PM</text>`;
  s += `<text x="${X1}" y="${Y0 + 40}" fill="rgba(245,241,234,.4)" font-family="JetBrains Mono" font-weight="600" font-size="9.5" text-anchor="end">10:42 PM</text>`;
  s += `<text x="${(X0+X1)/2}" y="${Y0 + 40}" fill="rgba(245,241,234,.4)" font-family="Inter" font-weight="600" font-size="9.5" letter-spacing="1.4" text-anchor="middle">INNING</text>`;
  s += `<text x="${X0}" y="${Y0 - 10}" fill="#ff8a98" font-family="Inter" font-weight="700" font-size="9.5" letter-spacing="1.4">CLE WINS ↓</text>`;
  s += `<path d="${area}" fill="url(#gc)" clip-path="url(#top)"/><path d="${area}" fill="url(#gl)" clip-path="url(#bot)"/>`;
  s += `<path d="${line}" fill="none" stroke="#9db6ff" stroke-width="5" opacity=".35" filter="url(#glow)"/>`;
  s += `<path d="${line}" fill="none" stroke="url(#ln)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  // game events (small labels on curve)
  const ev = [[27, 'Ramírez HR', 'b'], [129, 'Lindor RBI', 'b'], [150, 'Chapman in', 'b']];
  ev.forEach(([m, t]) => {
    const px = x(m), py = y(wpAt(m));
    s += `<circle cx="${px}" cy="${py}" r="3" fill="#050506" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>`;
    s += `<text x="${px}" y="${py + 18}" fill="rgba(245,241,234,.62)" font-family="Inter" font-weight="600" font-size="9.5" text-anchor="middle">${t}</text>`;
  });
  // photo pins
  const P = [
    { m: 0, r: 17, src: 'wrigley-night-2.jpg', pos: '50% 40%', t: '7:06' },
    { m: 86.4, r: 26, src: 'wrigley-night.jpg', pos: '62% 30%', t: '8:34', sel: 1 },
    { m: 150.5, r: 17, canvas: 'lightTower', seed: 4, t: '9:38' },
    { m: 196, r: 17, canvas: 'scoreboard', seed: 6, board: 'CLE 2|CHC 3', t: '10:24' },
    { m: 214.6, r: 20, src: 'wrigley-night-2.jpg', pos: '30% 70%', t: '10:42' },
  ];
  let pins = '';
  P.forEach(p => {
    const px = Math.min(x(p.m), X1), py = y(wpAt(Math.min(p.m, T)));
    const gap = p.r + 16, cy = py - gap;
    const col = p.sel ? '#ffb547' : 'rgba(255,255,255,.9)';
    s += `<line x1="${px}" x2="${px}" y1="${cy + p.r}" y2="${py}" stroke="${col}" stroke-width="${p.sel ? 2 : 1.5}"/>`;
    s += `<circle cx="${px}" cy="${py}" r="${p.sel ? 8 : 5}" fill="${p.sel ? 'rgba(255,181,71,.25)' : 'none'}"/><circle cx="${px}" cy="${py}" r="${p.sel ? 4 : 3.2}" fill="${col}"/>`;
    const inner = p.src ? `<img class="ph graded" src="../../photos/${p.src}" style="object-position:${p.pos}">`
      : `<canvas class="photo" data-style="${p.canvas}" data-seed="${p.seed}" data-accent="#2f6bff" data-secondary="#cc3433" ${p.board ? `data-board="${p.board}"` : ''}></canvas>`;
    pins += `<div class="pin${p.sel ? ' sel' : ''}" style="left:${px - p.r}px;top:${cy - p.r}px;width:${p.r*2}px;height:${p.r*2}px">${inner}</div>`;
  });
  // final out flag
  s += `<circle cx="${x(T)}" cy="${y(1)}" r="14" fill="#ffb547" opacity=".22" filter="url(#glow)"/>`;
  document.getElementById('chart').innerHTML = s;
  document.getElementById('pins').innerHTML = pins;
</script>
<script src="../../kit/kit.js"></script>
</body></html>
