<!doctype html>
<html><head><meta charset="utf-8"><title>Photo Booth</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #2a0508; }
  .curtain { position: absolute; inset: 0;
    background:
      radial-gradient(70% 50% at 50% 40%, rgba(255,90,80,.22), transparent 70%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.42) 0, rgba(0,0,0,.05) 14px, rgba(255,120,110,.10) 24px, rgba(0,0,0,.05) 34px, rgba(0,0,0,.42) 46px),
      linear-gradient(180deg, #5a0b12, #3d0609 60%, #1c0204); }
  .curtain::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 22%, transparent 70%, rgba(0,0,0,.7)); }

  .sign { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); z-index: 5; height: 34px; padding: 0 16px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
    background: #140203; box-shadow: inset 0 0 0 1.5px #c8a45a, 0 6px 18px rgba(0,0,0,.5); }
  .sign span { font: 400 19px/1 var(--f-bebas); letter-spacing: 4px; color: #ffe2a8; text-shadow: 0 0 8px rgba(255,200,110,.9); padding-top: 2px; }
  .sign i { width: 6px; height: 6px; border-radius: 50%; background: #ffdf9a; box-shadow: 0 0 8px #ffc35c; }
  .nav { position: absolute; top: 59px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 5; }
  .nav .btn-circle { background: rgba(0,0,0,.3); }

  .strip { position: absolute; width: 166px; padding: 9px 9px 0; background: #f6f2ea; z-index: 4;
    box-shadow: 0 30px 50px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.4); }
  .strip .f { position: relative; width: 148px; height: 112px; overflow: hidden; margin-bottom: 8px; background: #222; }
  .strip .f img, .strip .f canvas { filter: grayscale(1) contrast(1.28) brightness(1.04); }
  .strip .f::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 22px rgba(0,0,0,.55); }
  .strip .f .c { position: absolute; left: 7px; bottom: 6px; z-index: 2; font: 400 9.5px/1 var(--f-type); color: #fff; letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .strip .foot { height: 44px; display: flex; align-items: center; justify-content: center; font: 400 21px/1 var(--f-marker); color: #1d1a16; }
  .strip .foot small { font: 400 9px/1 var(--f-type); color: #6d6253; letter-spacing: .8px; display: block; text-align: center; }
  .strip.a { left: 26px; top: 118px; transform: rotate(-4deg); }
  .strip.b { left: 200px; top: 132px; transform: rotate(3.2deg); }
  .strip.b .foot { flex-direction: column; gap: 3px; }
  .tape { position: absolute; width: 64px; height: 20px; background: rgba(255,240,200,.55); z-index: 6; box-shadow: 0 1px 2px rgba(0,0,0,.2); }

  .bottom { position: absolute; left: 20px; right: 20px; top: 728px; z-index: 6; display: flex; gap: 10px; }
  .bt { flex: 1; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px/1 var(--f-ui); letter-spacing: -.1px; }
  .bt.p { background: #f6f2ea; color: #2a0508; }
  .bt.s { background: rgba(255,255,255,.12); color: #fff; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25); }
  .bt svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cap { position: absolute; left: 0; right: 0; top: 700px; text-align: center; z-index: 6; font: 600 10.5px/1 var(--f-ui); letter-spacing: 2px; text-transform: uppercase; color: rgba(255,226,200,.6); }
</style></head>
<body class="phone">
  <div class="curtain"></div>
  <div class="nav">
    <div class="btn-circle"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="btn-circle"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>
  <div class="sign"><i></i><span>Sam &amp; Maya · 8 poses</span><i></i></div>

  <div class="strip a">
    <div class="f"><img class="ph" src="../../photos/wrigley-bleachers.jpg"><span class="c">WRIGLEY · JUN 14 ’14</span></div>
    <div class="f"><img class="ph" src="../../photos/soldier-skyline.jpg"><span class="c">SOLDIER FIELD · ’18</span></div>
    <div class="f"><img class="ph" src="../../photos/camp-nou-aerial.jpg" style="object-position:50% 70%"><span class="c">CAMP NOU · FEB 22 ’20</span></div>
    <div class="f"><canvas class="photo" data-style="nightField" data-seed="21" data-accent="#febe10" data-secondary="#ffffff"></canvas><span class="c">BERNABÉU · MAR 1 ’20</span></div>
    <div class="foot">Sam + Maya</div>
  </div>
  <div class="tape" style="left:72px;top:106px;transform:rotate(-8deg)"></div>

  <div class="strip b">
    <div class="f"><img class="ph" src="../../photos/soldier-soccer.jpg"><span class="c">SOLDIER · OCT 4 ’23</span></div>
    <div class="f"><img class="ph" src="../../photos/lambeau-concourse.jpg"><span class="c">LAMBEAU · 19° · ’25</span></div>
    <div class="f"><img class="ph" src="../../photos/united-center-court.jpg"><span class="c">UNITED CENTER · ’25</span></div>
    <div class="f"><img class="ph" src="../../photos/wrigley-night.jpg" style="object-position:50% 52%"><span class="c">WRIGLEY · TONIGHT</span></div>
    <div class="foot">17 games<small>2014 — 2026</small></div>
  </div>
  <div class="tape" style="left:258px;top:122px;transform:rotate(6deg)"></div>

  <div class="cap">Developed from 17 games together</div>
  <div class="bottom">
    <div class="bt s"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Send to Maya</div>
    <div class="bt p"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v7H7z"/></svg>Print strip</div>
  </div>
<script src="../../kit/kit.js"></script>
</body></html>
