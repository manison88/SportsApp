<!doctype html>
<html><head><meta charset="utf-8"><title>Braided Map</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #05060a; }
  svg#map { position: absolute; left: 0; top: 0; width: 393px; height: 560px; }
  .topfade { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(#05060a 10%, rgba(5,6,10,0)); z-index: 2; }
  .botfade { position: absolute; left: 0; right: 0; top: 420px; height: 150px; background: linear-gradient(rgba(5,6,10,0), #05060a 85%); z-index: 2; }
  .nav { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .legend { display: flex; gap: 12px; height: 32px; padding: 0 14px; border-radius: 16px; align-items: center; font: 600 11.5px/1 var(--f-ui); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: block; }

  .lbl { position: absolute; z-index: 3; font: 600 10px/1 var(--f-ui); letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,.75); white-space: nowrap; }
  .lbl b { display: block; font: 400 15px/1 var(--f-serif); letter-spacing: 0; text-transform: none; color: #fff; margin-bottom: 3px; }

  .panel { position: absolute; left: 0; right: 0; top: 500px; z-index: 4; padding: 0 24px; }
  .panel .eyebrow { color: var(--text-3); }
  .panel h1 { font: 400 36px/1.02 var(--f-serif); letter-spacing: -.5px; margin-top: 8px; }
  .panel h1 em { background: linear-gradient(90deg, #ffb547, #ff7a8a); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: italic; padding-right: 4px; }
  .stats { display: flex; margin-top: 18px; }
  .stats div { flex: 1; }
  .stats div + div { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.1); }
  .stats b { display: block; font: 700 24px/1 var(--f-tight); letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
  .stats span { display: block; font: 500 11.5px/1.3 var(--f-ui); color: var(--text-3); margin-top: 5px; }
  .legs { margin-top: 20px; }
  .leg { display: flex; align-items: center; gap: 12px; height: 46px; border-top: 1px solid rgba(255,255,255,.07); }
  .leg svg { flex: none; }
  .leg .t { flex: 1; font: 600 14px/1.2 var(--f-ui); letter-spacing: -.1px; }
  .leg .d { font: 500 12px/1 var(--f-ui); color: var(--text-3); font-variant-numeric: tabular-nums; }
</style></head>
<body class="phone">
  <svg id="map" viewBox="0 0 393 560"></svg>
  <div class="topfade"></div>
  <div class="botfade"></div>
  <div id="labels"></div>

  <div class="nav">
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="legend glass">
      <span><i style="background:#ffb547"></i>Sam</span>
      <span><i style="background:#ff7a8a"></i>Maya</span>
    </div>
  </div>

  <div class="panel">
    <div class="eyebrow">Shared passport · Sam &amp; Maya</div>
    <h1>Where your roads <em>braid.</em></h1>
    <div class="stats">
      <div><b>17</b><span>games together</span></div>
      <div><b>9,480</b><span>miles side by side</span></div>
      <div><b>2</b><span>countries</span></div>
    </div>
    <div class="legs" id="legs"></div>
  </div>

<script src="../../kit/vendor/d3.min.js"></script>
<script src="../../kit/vendor/topojson-client.min.js"></script>
<script src="../../kit/vendor/land-50m.js"></script>
<script>
(function () {
  const W = 393, H = 560;
  const proj = d3.geoOrthographic().rotate([43, -34, 0]).scale(268).translate([196, 404]).clipAngle(90);
  const path = d3.geoPath(proj);
  const land = topojson.feature(window.__atlas['land-50m'], window.__atlas['land-50m'].objects.land);
  const svg = d3.select('#map');
  const defs = svg.append('defs');
  const g1 = defs.append('radialGradient').attr('id', 'ocean').attr('cx', '42%').attr('cy', '30%').attr('r', '70%');
  g1.append('stop').attr('offset', 0).attr('stop-color', '#141a2c');
  g1.append('stop').attr('offset', 1).attr('stop-color', '#07080e');
  const g2 = defs.append('radialGradient').attr('id', 'rim').attr('r', '50%');
  g2.append('stop').attr('offset', .9).attr('stop-color', 'rgba(110,140,255,0)');
  g2.append('stop').attr('offset', .985).attr('stop-color', 'rgba(110,140,255,.22)');
  g2.append('stop').attr('offset', 1).attr('stop-color', 'rgba(110,140,255,0)');
  const f = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
  f.append('feGaussianBlur').attr('stdDeviation', 3.5);

  svg.append('circle').attr('cx', 196).attr('cy', 404).attr('r', 280).attr('fill', 'url(#rim)');
  svg.append('path').datum({ type: 'Sphere' }).attr('d', path).attr('fill', 'url(#ocean)').attr('stroke', 'rgba(140,160,255,.18)');
  svg.append('path').datum(d3.geoGraticule10()).attr('d', path).attr('fill', 'none').attr('stroke', 'rgba(255,255,255,.035)');
  svg.append('path').datum(land).attr('d', path).attr('fill', '#1b1f2b').attr('stroke', 'rgba(255,255,255,.14)').attr('stroke-width', .5);

  const P = {
    CHI: [-87.65, 41.88], GB: [-88.06, 44.50], BCN: [2.12, 41.38], VLC: [-0.38, 39.47], MAD: [-3.69, 40.45],
    BOS: [-71.10, 42.35], DOR: [7.45, 51.49], AUS: [-97.63, 30.13], STL: [-90.19, 38.62], MIL: [-87.97, 43.03],
    MSP: [-93.28, 44.98], PIT: [-80.0, 40.45], NYC: [-73.93, 40.83], DET: [-83.05, 42.34], CIN: [-84.51, 39.10],
    KC: [-94.48, 39.05], DEN: [-104.99, 39.76], ATL: [-84.47, 33.89], PHI: [-75.17, 39.91],
  };
  // project a great-circle leg, lifted off the surface for long hops
  function arcPts(a, b, n = 90, liftK) {
    const interp = d3.geoInterpolate(a, b), dist = d3.geoDistance(a, b);
    const lift = liftK != null ? liftK : Math.min(0.16, dist * 0.17);
    const c = proj.translate(), r = proj.scale();
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, p = proj(interp(t));
      const k = 1 + lift * Math.sin(Math.PI * t);
      pts.push([c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k]);
    }
    return pts;
  }
  const line = d3.line().curve(d3.curveBasis);
  const solo = svg.append('g'), braid = svg.append('g'), dots = svg.append('g');

  // Sam's solo travels: single amber strands
  ['BOS', 'DOR', 'AUS', 'STL', 'MSP', 'PIT', 'NYC', 'DET', 'CIN', 'KC', 'DEN', 'ATL', 'PHI', 'MIL'].forEach(k => {
    const pts = arcPts(P.CHI, P[k]);
    solo.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#ffb547').attr('stroke-opacity', .5).attr('stroke-width', 1.1);
  });

  // braids: two strands twisting around the shared route
  function drawBraid(a, b, twists, amp, liftK) {
    const pts = arcPts(a, b, 260, liftK);
    const strands = [0, Math.PI].map(ph => pts.map((p, i) => {
      const t = i / (pts.length - 1);
      const q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(i - 1, 0)];
      let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const env = Math.pow(Math.sin(Math.PI * t), .6);
      const s = Math.sin(t * twists * 2 * Math.PI + ph) * amp * env;
      return { x: p[0] - dy * s, y: p[1] + dx * s, z: Math.cos(t * twists * 2 * Math.PI + ph) };
    }));
    // soft glow under the braid
    braid.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#ff9a80').attr('stroke-opacity', .35).attr('stroke-width', amp * 2.6).attr('filter', 'url(#glow)');
    // segments, drawn back-to-front so the strands weave over and under
    // split each strand into runs that pass behind (z<0) or in front (z>=0)
    const runs = { back: [], front: [] };
    strands.forEach((st, si) => {
      let cur = [st[0]], front = st[0].z >= 0;
      for (let i = 1; i < st.length; i++) {
        const f = st[i].z >= 0; cur.push(st[i]);
        if (f !== front || i === st.length - 1) { runs[front ? 'front' : 'back'].push({ si, pts: cur }); cur = [st[i]]; front = f; }
      }
    });
    const ln = d3.line().x(p => p.x).y(p => p.y).curve(d3.curveCatmullRom);
    runs.back.forEach(r => braid.append('path').attr('d', ln(r.pts)).attr('fill', 'none').attr('stroke', r.si ? '#ff7a8a' : '#ffb547').attr('stroke-width', 2.2).attr('stroke-linecap', 'round').attr('opacity', .55));
    runs.front.forEach(r => {
      braid.append('path').attr('d', ln(r.pts)).attr('fill', 'none').attr('stroke', '#05060a').attr('stroke-width', 5.2).attr('stroke-linecap', 'butt').attr('opacity', .9);
      braid.append('path').attr('d', ln(r.pts)).attr('fill', 'none').attr('stroke', r.si ? '#ff8b99' : '#ffc061').attr('stroke-width', 2.6).attr('stroke-linecap', 'round');
    });
  }
  drawBraid(P.CHI, P.BCN, 5.5, 5.5, 0.34);
  drawBraid(P.BCN, P.VLC, 1.5, 3);
  drawBraid(P.VLC, P.MAD, 1.5, 3);
  drawBraid(P.MAD, P.CHI, 5.5, 4.5, 0.12);
  drawBraid(P.CHI, P.GB, 1.5, 2.6, 0.04);

  // venues
  const dot = (k, r, col, ring) => { const [x, y] = proj(P[k]);
    if (ring) dots.append('circle').attr('cx', x).attr('cy', y).attr('r', r + 6).attr('fill', 'none').attr('stroke', col).attr('stroke-opacity', .35);
    dots.append('circle').attr('cx', x).attr('cy', y).attr('r', r).attr('fill', col).attr('stroke', '#05060a').attr('stroke-width', 1.5); };
  ['BOS', 'DOR', 'STL', 'MSP', 'PIT', 'NYC', 'DET', 'CIN', 'KC', 'DEN', 'ATL', 'PHI', 'MIL', 'AUS'].forEach(k => dot(k, 2.2, '#ffb547'));
  dot('VLC', 2.2, '#ffd2c0');
  ['GB', 'BCN', 'MAD'].forEach(k => dot(k, 4, '#fff', true));
  dot('CHI', 6, '#fff', true);

  // labels
  const L = document.getElementById('labels'); const lab = (k, t, s, dx, dy, right) => { const [x, y] = proj(P[k]);
    L.insertAdjacentHTML('beforeend', `<div class="lbl" style="left:${(x + dx).toFixed(0)}px;top:${(y + dy).toFixed(0)}px;${right ? 'transform:translateX(-100%);text-align:right' : ''}"><b>${t}</b>${s}</div>`); };
  lab('CHI', 'Chicago', 'Home · 14 together', 4, 14, false);
  lab('GB', 'Lambeau', 'Jan 2025', -8, -56, false);
  lab('BCN', 'Camp Nou', 'Feb 2020', 14, -60, true);
  lab('MAD', 'Bernabéu', 'Mar 2020', 0, 12, true);

  // legs list with mini braids
  const legs = [['Chicago ⇄ Spain', 'Feb–Mar ’20 · 8,690 mi'], ['Chicago → Green Bay', 'Jan ’25 · 410 mi'], ['Home: Wrigley, Soldier, UC', '14 games']];
  const mini = `<svg width="30" height="14" viewBox="0 0 30 14"><path d="M1 7 C5 1, 9 1, 13 7 S21 13, 25 7 29 3, 29 3" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round"/><path d="M1 7 C5 13, 9 13, 13 7 S21 1, 25 7 29 11, 29 11" fill="none" stroke="#ff7a8a" stroke-width="2" stroke-linecap="round"/></svg>`;
  document.getElementById('legs').innerHTML = legs.map(([a, b]) => `<div class="leg">${mini}<div class="t">${a}</div><div class="d">${b}</div></div>`).join('');
})();
</script>
<script src="../../kit/kit.js"></script>
</body></html>
