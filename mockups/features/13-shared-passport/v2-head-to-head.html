<!doctype html>
<html><head><meta charset="utf-8"><title>Head to Head</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #0b0a0c; }
  .split { position: absolute; left: 0; right: 0; top: 0; height: 404px; overflow: hidden; }
  .half { position: absolute; top: 0; bottom: 0; width: 260px; }
  .half.s { left: 0; background: linear-gradient(160deg, #ffc566 0%, #ff9f1c 55%, #d46f00 100%); clip-path: polygon(0 0, 100% 0, 66% 100%, 0 100%); }
  .half.m { right: 0; background: linear-gradient(200deg, #ff9aa6 0%, #ff6d80 55%, #c63d58 100%); clip-path: polygon(34% 0, 100% 0, 100% 100%, 0 100%); }
  .half::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 2px, transparent 2px 14px); }
  .split::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: linear-gradient(transparent, rgba(11,10,12,.0)); }

  .nav { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 5; }
  .nav .btn-circle { background: rgba(0,0,0,.22); }
  .tag { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 5; font: 800 11px/1 var(--f-ui); letter-spacing: 3px; color: rgba(0,0,0,.55); }

  .p { position: absolute; top: 118px; z-index: 4; }
  .p .nm { font: 400 30px/1 var(--f-anton); letter-spacing: 1px; text-transform: uppercase; }
  .p .num { font: 400 196px/.8 var(--f-anton); letter-spacing: -6px; margin-top: 14px; }
  .p .sub { font: 700 10px/1.3 var(--f-ui); letter-spacing: 1.6px; text-transform: uppercase; margin-top: 14px; }
  .p.s { left: 22px; color: #2a1600; }
  .p.m { right: 22px; text-align: right; color: #33060f; }
  .p .sub { opacity: .7; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font: 400 18px/1 var(--f-serif); color: #fff; vertical-align: -6px; margin: 0 8px 0 0; box-shadow: 0 0 0 2px rgba(0,0,0,.2); }
  .p.m .av { margin: 0 0 0 8px; }

  .vs { position: absolute; left: 50%; top: 232px; transform: translate(-50%,-50%); width: 64px; height: 64px; border-radius: 50%; z-index: 6;
    background: #0b0a0c; display: grid; place-items: center; font: 400 26px/1 var(--f-anton); color: #fff; letter-spacing: 1px;
    box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 12px 30px rgba(0,0,0,.4); }

  .tape { position: absolute; left: 20px; right: 20px; top: 428px; z-index: 5; }
  .tape .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .tape .hd .eyebrow { color: var(--text-2); }
  .tape .hd span:last-child { font: 500 12px/1 var(--f-ui); color: var(--text-3); }
  .r { display: grid; grid-template-columns: 72px 1fr 92px 1fr 72px; align-items: center; height: 44px; border-top: 1px solid rgba(255,255,255,.07); }
  .r .v { font: 700 19px/1 var(--f-cond); letter-spacing: .2px; font-variant-numeric: tabular-nums; }
  .r .v.l { text-align: left; color: var(--signal); }
  .r .v.rr { text-align: right; color: #ff8b99; }
  .r .k { text-align: center; font: 600 9.5px/1 var(--f-ui); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-2); }
  .r .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
  .r .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .r .bar.l i { right: 0; background: linear-gradient(270deg, #ffb547, rgba(255,181,71,.35)); }
  .r .bar.rr i { left: 0; background: linear-gradient(90deg, #ff7a8a, rgba(255,122,138,.35)); }
  .r .v.dim { opacity: .5; }
  .r.win { background: linear-gradient(90deg, transparent, rgba(255,122,138,.10)); border-radius: 0; }
  .r .crown { font-size: 11px; margin-left: 4px; }

  .verdict { position: absolute; left: 20px; right: 20px; top: 744px; height: 64px; border-radius: 18px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: rgba(255,122,138,.12); box-shadow: inset 0 0 0 1px rgba(255,122,138,.35); }
  .verdict .big { font: 400 30px/1 var(--f-anton); color: #ff8b99; }
  .verdict b { display: block; font: 600 14px/1.25 var(--f-ui); letter-spacing: -.1px; }
  .verdict span { display: block; font: 500 12px/1.3 var(--f-ui); color: var(--text-2); margin-top: 1px; }
  .homebar.dark { background: rgba(255,255,255,.92); }
</style></head>
<body class="phone" data-chrome="dark">
  <div class="split"><div class="half s"></div><div class="half m"></div></div>
  <div class="grain" style="opacity:.22"></div>

  <div class="nav">
    <div class="btn-circle"><svg viewBox="0 0 24 24" style="stroke:#1a0d00"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="btn-circle"><svg viewBox="0 0 24 24" style="stroke:#2a0610"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>
  <div class="tag">HEAD · TO · HEAD</div>

  <div class="p s">
    <div class="nm"><span class="av" style="background:linear-gradient(135deg,#1a0d00,#5a3200)">S</span>Sam</div>
    <div class="num">60</div>
    <div class="sub">Games · since 2014</div>
  </div>
  <div class="p m">
    <div class="nm">Maya<span class="av" style="background:linear-gradient(135deg,#33060f,#7a2235)">M</span></div>
    <div class="num">17</div>
    <div class="sub">Games · age 4 to 16</div>
  </div>
  <div class="vs">VS</div>

  <div class="tape">
    <div class="hd"><span class="eyebrow">Tale of the tape</span><span>Sam · Maya</span></div>
    <div id="rows"></div>
  </div>

  <div class="verdict">
    <div class="big">65%</div>
    <div><b>Maya’s the real lucky charm.</b><span>Chicago is 11–6 with her there. You’re at 61%.</span></div>
  </div>
<script>
  const rows = [
    ['Venues', '21', '6', 21, 6],
    ['Countries', '3', '2', 3, 2],
    ['Miles', '42.9k', '9.5k', 42.9, 9.5],
    ['Coldest', '19°', '19°', 1, 1, 'tie'],
    ['Win rate', '61%', '65%', 61, 65, 'maya'],
    ['Walk-offs', '4', '2', 4, 2],
  ];
  document.getElementById('rows').innerHTML = rows.map(([k, a, b, x, y, f]) => {
    const m = Math.max(x, y);
    return `<div class="r ${f === 'maya' ? 'win' : ''}">
      <span class="v l ${f === 'maya' ? 'dim' : ''}">${a}</span>
      <span class="bar l"><i style="width:${(x / m * 100).toFixed(0)}%"></i></span>
      <span class="k">${k}${f === 'tie' ? ' · tie' : ''}</span>
      <span class="bar rr"><i style="width:${(y / m * 100).toFixed(0)}%"></i></span>
      <span class="v rr">${b}${f === 'maya' ? '<span class="crown">▲</span>' : ''}</span></div>`;
  }).join('');
</script>
<script src="../../kit/kit.js"></script>
</body></html>
