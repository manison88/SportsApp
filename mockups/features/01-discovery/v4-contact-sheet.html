<!doctype html>
<html><head><meta charset="utf-8"><title>Contact sheet</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #efeae0; color: var(--paper-ink); }
  .head { position: absolute; top: 62px; left: 20px; right: 20px; z-index: 3; }
  .head .eyebrow { color: rgba(29,26,22,.5); display: flex; justify-content: space-between; }
  .head h1 { margin-top: 8px; font: 400 38px/1 var(--f-dm); letter-spacing: -.8px; }
  .head h1 em { color: #c8261f; font-style: italic; }

  .sheet { position: absolute; left: 12px; right: 12px; top: 150px; z-index: 2; }
  .strip { position: relative; height: 74px; margin-bottom: 20px; background: #111; border-radius: 1px; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .edge { position: absolute; left: 0; right: 0; height: 11px; display: flex; align-items: center; }
  .edge.t { top: 0; } .edge.b { bottom: 0; }
  .holes { position: absolute; inset: 3px 4px; background: radial-gradient(closest-side, transparent 0, transparent 0) ;
    background-image: linear-gradient(90deg, #3d3b38 0 5px, transparent 5px 100%); background-size: 9px 6px; background-repeat: repeat-x; border-radius: 1px; opacity: .9; }
  .edgetxt { position: absolute; top: 2px; font: 600 6.5px/1 var(--f-mono); letter-spacing: .8px; color: #d9a35a; opacity: .85; white-space: nowrap; background: #111; padding: 0 3px; }
  .frames { position: absolute; left: 6px; right: 6px; top: 11px; height: 52px; display: flex; gap: 4px; }
  .fr { position: relative; flex: 1; overflow: hidden; background: #222; }
  .fr img, .fr canvas { filter: grayscale(1) contrast(1.2) brightness(.98); }
  .num { position: absolute; bottom: 1px; font: 600 6.5px/1 var(--f-mono); color: #d9a35a; opacity: .85; }

  .ink { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: visible; }
  .note { position: absolute; z-index: 5; font: 400 15px/1 var(--f-marker); color: #c8261f; transform: rotate(-4deg); white-space: nowrap; text-shadow: 0 0 1px rgba(200,38,31,.4); }

  .loupe { position: absolute; z-index: 6; width: 150px; height: 150px; border-radius: 50%; left: 240px; top: 282px;
    box-shadow: 0 0 0 7px #1b1b1d, 0 0 0 8px #4a4a4e, 0 0 0 10px #18181a, 0 22px 40px rgba(0,0,0,.45), 0 6px 12px rgba(0,0,0,.35); overflow: hidden; background: #111; }
  .loupe .zoom { position: absolute; left: -40px; top: 5px; width: 230px; height: 140px; }
  .loupe .zoom img { filter: grayscale(1) contrast(1.22) brightness(1.04); }
  .loupe::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(120% 90% at 30% 18%, rgba(255,255,255,.28), rgba(255,255,255,0) 40%), radial-gradient(closest-side, transparent 78%, rgba(0,0,0,.45)); }
  .loupe .grease { position: absolute; inset: 0; }

  .card { position: absolute; left: 12px; right: 12px; top: 624px; z-index: 7; border-radius: 26px; padding: 18px 18px 16px; background: #17140f; color: var(--text);
    box-shadow: 0 20px 40px rgba(40,30,10,.28); }
  .card .top { display: flex; justify-content: space-between; align-items: center; }
  .card .eyebrow { color: var(--text-3); }
  .chip { font: 400 15px/1 var(--f-marker); color: #ff5a4f; }
  .card h2 { margin-top: 10px; font: 400 26px/1.05 var(--f-dm); letter-spacing: -.3px; }
  .card .ln { margin-top: 6px; font: 400 13.5px/1.4 var(--f-ui); color: var(--text-2); }
  .card .ln b { color: var(--text); font-weight: 600; }
  .acts { display: flex; gap: 8px; margin-top: 16px; }
  .acts div { height: 48px; border-radius: 24px; display: grid; place-items: center; font: 600 15px/1 var(--f-ui); }
  .acts .s { width: 108px; background: rgba(255,255,255,.08); color: var(--text-2); }
  .acts .k { flex: 1; background: #f3ece0; color: #17140f; }
</style></head>
<body class="phone" data-chrome="dark">
  <div class="paper-tex"></div>
  <div class="head">
    <div class="eyebrow"><span>Camera roll · 2,814 frames</span><span>Sheet 4 of 12</span></div>
    <h1>47 games, <em>circled.</em></h1>
  </div>

  <div class="sheet" id="sheet"></div>
  <svg class="ink" id="ink" width="393" height="852"></svg>

  <div class="loupe">
    <div class="zoom"><img class="ph" src="../../photos/wrigley-night.jpg" style="object-position:50% 50%"></div>
    <svg class="grease" width="150" height="150"><path d="M8 40 C 40 22, 118 18, 146 36" stroke="#c8261f" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/></svg>
  </div>

  <div class="card">
    <div class="top"><span class="eyebrow">Frames 23–25 · Oct 30, 2016</span><span class="chip">match!</span></div>
    <h2>World Series, Game 5</h2>
    <div class="ln"><b>Chicago 3, Cleveland 2</b> · Wrigley Field · with Dad</div>
    <div class="acts"><div class="s">Skip</div><div class="k">Keep this game</div></div>
  </div>

<script>
(function(){
  const P = n => `<img class="ph" src="../../photos/${n}.jpg">`;
  const Cv = (st, seed, a, b, extra='') => `<canvas class="photo" data-style="${st}" data-seed="${seed}" data-accent="${a}" data-secondary="${b}" ${extra}></canvas>`;
  const rows = [
    { tag: 'JUN 15 2015', start: 14, rot: -.5, f: [Cv('skyline',3,'#e8243c','#ffd6a0'), P('united-center-court'), Cv('arena',8,'#e8243c','#ffffff','data-sport="hockey"'), Cv('celebration',4,'#e8243c','#ffd36e')] },
    { tag: 'OCT 22 2016', start: 18, rot: .4, f: [Cv('concourse',6,'#2f6bff','#cc3433'), P('wrigley-night-2'), Cv('scoreboard',2,'#2f6bff','#cc3433','data-board="LA  0|CHC 5"'), Cv('skyline',9,'#2f6bff','#ffd6a0')] },
    { tag: 'OCT 30 2016', start: 22, rot: -.3, f: [Cv('tailgate',5,'#2f6bff','#cc3433'), P('wrigley-bleachers'), P('wrigley-scoreboard'), P('wrigley-night')] },
    { tag: 'FEB 22 2020', start: 26, rot: .5, f: [Cv('skyline',12,'#d3125e','#004d98'), P('camp-nou-aerial'), Cv('pitch',7,'#d3125e','#004d98'), Cv('skyline',14,'#ffd6a0','#d3125e')] },
    { tag: 'JAN 05 2025', start: 30, rot: -.4, f: [Cv('skyline',21,'#ffd6a0','#f05a1a'), P('lambeau-exterior'), Cv('snowGame',5,'#f05a1a','#ffb612','data-sport="football"'), P('lambeau-concourse')] },
  ];
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = rows.map((r, i) => `
    <div class="strip" style="transform:rotate(${r.rot}deg)">
      <div class="edge t"><div class="holes"></div><span class="edgetxt" style="left:24px">WITNESS 400 · ${r.tag}</span><span class="edgetxt" style="right:40px">▸ ${r.start}A</span></div>
      <div class="frames">${r.f.map((h, j) => `<div class="fr" data-r="${i}" data-c="${j}">${h}</div>`).join('')}</div>
      <div class="edge b"><div class="holes"></div>${r.f.map((_, j) => `<span class="edgetxt" style="left:${10 + j * 88}px;top:3px">${r.start + j}</span>`).join('')}</div>
    </div>`).join('');

  // grease-pencil loops around matched frame groups
  const groups = [ [0,1,2,'Cup on home ice!', -6, 'below'], [1,1,2,'pennant', 4, 'below'], [2,1,3,'WS G5 !!', -3, 'below'], [3,1,2,'Camp Nou 5–0', -5, 'below'], [4,1,3,'19°F, worth it', 3, 'below'] ];
  const ink = document.getElementById('ink');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function loop(x0, y0, x1, y1) {
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2 + 7, ry = (y1 - y0) / 2 + 7;
    let d = ''; const N = 46, turns = 1.12, a0 = -2.2 + rnd() * .4;
    for (let i = 0; i <= N; i++) { const t = i / N, a = a0 + t * turns * Math.PI * 2, k = 1 + (t - .5) * .07 + (rnd() - .5) * .02;
      const x = cx + Math.cos(a) * rx * k, y = cy + Math.sin(a) * ry * k * (1 + .04 * Math.sin(a * 2));
      d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
    return d;
  }
  window.afterPaint = async () => {
    groups.forEach(([r, c0, c1, note, rot, pos]) => {
      const a = document.querySelector(`.fr[data-r="${r}"][data-c="${c0}"]`).getBoundingClientRect();
      const b = document.querySelector(`.fr[data-r="${r}"][data-c="${c1}"]`).getBoundingClientRect();
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', loop(a.left, a.top, b.right, b.bottom));
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#d02a22'); p.setAttribute('stroke-width', '3.2'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('opacity', '.9');
      ink.appendChild(p);
      if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note;
        n.style.left = (a.left - 4) + 'px'; n.style.top = (pos === 'above' ? a.top - 30 : b.bottom + 10) + 'px'; n.style.transform = `rotate(${rot}deg)`; document.body.appendChild(n); }
    });
    // skipped frames: a quick X
    [[0,0],[1,3],[3,3],[4,0]].forEach(([r,c]) => { const q = document.querySelector(`.fr[data-r="${r}"][data-c="${c}"]`).getBoundingClientRect();
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); const m = 16, cx = (q.left+q.right)/2, cy = (q.top+q.bottom)/2;
      p.setAttribute('d', `M${cx-m} ${cy-m*.6} L${cx+m} ${cy+m*.6} M${cx+m*.9} ${cy-m*.7} L${cx-m*.8} ${cy+m*.6}`);
      p.setAttribute('stroke', 'rgba(208,42,34,.55)'); p.setAttribute('stroke-width', '2.4'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('fill','none'); ink.appendChild(p); });
  };
})();
</script>
<script src="../../kit/kit.js"></script>
</body></html>
