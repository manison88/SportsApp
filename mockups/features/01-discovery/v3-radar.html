<!doctype html>
<html><head><meta charset="utf-8"><title>Radar sweep</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  :root { --g: #57ffb0; --g2: rgba(87,255,176,.62); --g3: rgba(87,255,176,.34); --g4: rgba(87,255,176,.14); }
  body.phone { background: radial-gradient(80% 48% at 50% 36%, #06231a 0%, #03100c 55%, #020605 100%); }
  .head { position: absolute; top: 62px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: center; }
  .head .eyebrow { color: var(--g2); display: flex; align-items: center; gap: 8px; }
  .head .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--g); box-shadow: 0 0 8px var(--g); }
  .head .done { font: 600 15px/1 var(--f-ui); color: var(--text-2); }

  .radar { position: absolute; left: 21.5px; top: 104px; width: 350px; height: 350px; }
  .radar svg { position: absolute; inset: 0; overflow: visible; }
  .sweep { position: absolute; inset: 10px; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(87,255,176,0) 0deg, rgba(87,255,176,0) 290deg, rgba(87,255,176,.05) 320deg, rgba(87,255,176,.22) 357deg, rgba(87,255,176,.55) 360deg);
    transform: rotate(-12deg); mix-blend-mode: screen; }
  .label { position: absolute; font: 600 9.5px/1.25 var(--f-mono); letter-spacing: .6px; color: var(--g); white-space: nowrap; text-shadow: 0 0 8px rgba(0,0,0,.9); }
  .label span { color: var(--g2); font-weight: 400; }
  .label.big { font-size: 10.5px; padding: 6px 8px; border-radius: 8px; background: rgba(3,20,14,.82); box-shadow: inset 0 0 0 .5px rgba(87,255,176,.5), 0 0 24px rgba(87,255,176,.25); }

  .counter { position: absolute; left: 0; right: 0; top: 470px; text-align: center; }
  .counter .n { font: 800 76px/1 var(--f-mono); letter-spacing: -5px; color: #eafff4; text-shadow: 0 0 30px rgba(87,255,176,.45); display: inline-flex; align-items: flex-end; }
  .roll { display: inline-block; height: 76px; overflow: hidden; position: relative; width: 46px; }
  .roll span { position: absolute; left: 0; }
  .counter .of { margin-top: 6px; font: 500 14px/1 var(--f-ui); color: var(--text-2); }
  .counter .of b { color: var(--g); font-weight: 600; }

  .card { position: absolute; left: 16px; right: 16px; top: 594px; border-radius: 26px; padding: 16px 16px 16px 16px;
    background: rgba(8,30,22,.72); box-shadow: inset 0 0 0 .5px rgba(87,255,176,.28), 0 20px 50px rgba(0,0,0,.5); }
  .card .eyebrow { color: var(--g2); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .thumb { width: 54px; height: 54px; border-radius: 14px; overflow: hidden; flex: none; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font: 600 17px/1.2 var(--f-ui); letter-spacing: -.2px; }
  .row .t span { font: 400 13px/1.35 var(--f-ui); color: var(--text-2); }
  .sc { font: 700 26px/1 var(--f-cond); letter-spacing: -.3px; text-align: right; }
  .sc small { display: block; font: 600 9px/1 var(--f-ui); letter-spacing: 1.4px; color: var(--text-3); margin-top: 4px; }
  .acts { display: flex; gap: 8px; margin-top: 14px; }
  .acts div { height: 46px; border-radius: 23px; display: grid; place-items: center; font: 600 15px/1 var(--f-ui); }
  .acts .s { width: 104px; background: rgba(255,255,255,.07); color: var(--text-2); }
  .acts .c { flex: 1; background: var(--g); color: #03251a; }
  .all { position: absolute; left: 0; right: 0; top: 788px; text-align: center; font: 600 13px/1 var(--f-ui); color: var(--g2); }
</style></head>
<body class="phone">
  <div class="head">
    <div class="eyebrow"><i></i>Scanning 2,814 photos · on device</div>
    <div class="done">Done</div>
  </div>

  <div class="radar">
    <svg id="map" width="350" height="350"></svg>
    <div class="sweep"></div>
    <svg id="over" width="350" height="350"></svg>
  </div>

  <div class="counter">
    <div class="n"><span>3</span><span class="roll"><span style="top:-48px;opacity:.25;filter:blur(1px)">1</span><span style="top:6px">2</span></span></div>
    <div class="of">of <b>47 games</b> found in your photos</div>
  </div>

  <div class="card">
    <div class="eyebrow">Just pinged · 1,031 km north</div>
    <div class="row">
      <div class="thumb"><img class="ph graded" src="../../photos/lambeau-concourse.jpg"></div>
      <div class="t"><b>Lambeau Field</b><span>Sun, Jan 5, 2025 · 38 photos</span></div>
      <div class="sc tnum">CHI 24<small>GB 22 · FINAL</small></div>
    </div>
    <div class="acts"><div class="s">Skip</div><div class="c">Confirm game</div></div>
  </div>
  <div class="all">Confirm all 32 matches</div>

<script src="../../kit/vendor/d3.min.js"></script>
<script src="../../kit/vendor/topojson-client.min.js"></script>
<script src="../../kit/vendor/land-50m.js"></script>
<script src="../../kit/vendor/states-10m.js"></script>
<script>
(function(){
  const S = 350, C = S/2, R = 165;
  const home = [-87.70, 41.92];
  const proj = d3.geoAzimuthalEquidistant().rotate([-home[0], -home[1]]).clipAngle(27).scale(R / (27 * Math.PI/180)).translate([C, C]);
  const path = d3.geoPath(proj);
  const land = topojson.feature(__atlas['land-50m'], __atlas['land-50m'].objects.land);
  const st = __atlas['states-10m'];
  const states = topojson.mesh(st, st.objects.states, (a,b) => a !== b);
  const map = d3.select('#map');
  const defs = map.append('defs');
  const rg = defs.append('radialGradient').attr('id','bg');
  rg.append('stop').attr('offset','0').attr('stop-color','#0a3a2a');
  rg.append('stop').attr('offset','1').attr('stop-color','#041a12');
  defs.append('clipPath').attr('id','cl').append('circle').attr('cx',C).attr('cy',C).attr('r',R);
  map.append('circle').attr('cx',C).attr('cy',C).attr('r',R).attr('fill','url(#bg)');
  const g = map.append('g').attr('clip-path','url(#cl)');
  g.append('path').attr('d', path(land)).attr('fill','rgba(87,255,176,.10)').attr('stroke','rgba(87,255,176,.45)').attr('stroke-width',.7);
  g.append('path').attr('d', path(states)).attr('fill','none').attr('stroke','rgba(87,255,176,.16)').attr('stroke-width',.5);
  // grid
  for (let i = 1; i <= 4; i++) map.append('circle').attr('cx',C).attr('cy',C).attr('r',R*i/4).attr('fill','none').attr('stroke','rgba(87,255,176,'+(i===4?.55:.16)+')').attr('stroke-width', i===4?1.2:.7).attr('stroke-dasharray', i===4?null:'2 3');
  [0,45,90,135].forEach(a => { const r = a*Math.PI/180; map.append('line').attr('x1',C-Math.cos(r)*R).attr('y1',C-Math.sin(r)*R).attr('x2',C+Math.cos(r)*R).attr('y2',C+Math.sin(r)*R).attr('stroke','rgba(87,255,176,.10)').attr('stroke-width',.7); });
  // ring distance labels
  [['500 MI',1],['1,000',2],['1,500',3]].forEach(([t,i]) => map.append('text').attr('x',C+4).attr('y',C-R*i/4*0.9 - 0).attr('fill','rgba(87,255,176,.4)').attr('font-family','JetBrains Mono').attr('font-size',7.5).attr('font-weight',600).text(t));

  // outer progress ring (32/47) + ticks
  const ov = d3.select('#over');
  for (let i = 0; i < 120; i++) { const a = i/120*2*Math.PI - Math.PI/2, r1 = R+6, r2 = R + (i%10===0?13:9);
    ov.append('line').attr('x1',C+Math.cos(a)*r1).attr('y1',C+Math.sin(a)*r1).attr('x2',C+Math.cos(a)*r2).attr('y2',C+Math.sin(a)*r2)
      .attr('stroke', i/120 < 32/47 ? 'rgba(87,255,176,.85)' : 'rgba(87,255,176,.18)').attr('stroke-width', 1); }

  // sweep leading edge
  const sa = -12 * Math.PI/180 - Math.PI/2;
  ov.append('line').attr('x1',C).attr('y1',C).attr('x2',C+Math.cos(sa)*R).attr('y2',C+Math.sin(sa)*R).attr('stroke','#b9ffe0').attr('stroke-width',1.4).attr('opacity',.9);

  const V = [
    ['Wrigley', -87.655, 41.948, 17], ['Soldier', -87.617, 41.862, 15], ['UC', -87.674, 41.881, 11], ['GRF', -87.634, 41.830, 3],
    ['Lambeau', -88.062, 44.501, 1, 'new'], ['Milwaukee', -87.971, 43.028, 2], ['Minneapolis', -93.278, 44.982, 1], ['Kansas City', -94.480, 39.051, 1],
    ['St. Louis', -90.193, 38.623, 2], ['Cincinnati', -84.507, 39.097, 1], ['Detroit', -83.049, 42.339, 1], ['Pittsburgh', -80.006, 40.447, 1],
    ['New York', -73.926, 40.829, 1], ['Fenway', -71.097, 42.346, 2], ['Denver', -104.994, 39.756, 1], ['COTA', -97.641, 30.133, 1]
  ];
  const dg = defs.append('radialGradient').attr('id','blip');
  dg.append('stop').attr('offset','0').attr('stop-color','#d9ffef');
  dg.append('stop').attr('offset','.35').attr('stop-color','rgba(87,255,176,.8)');
  dg.append('stop').attr('offset','1').attr('stop-color','rgba(87,255,176,0)');
  V.forEach(([n, lon, lat, k, flag]) => {
    const [x, y] = proj([lon, lat]);
    const r = 4 + Math.sqrt(k) * 2.4;
    if (n === 'Wrigley' || n === 'Soldier' || n === 'UC' || n === 'GRF') return;
    ov.append('circle').attr('cx',x).attr('cy',y).attr('r',r*1.8).attr('fill','url(#blip)').attr('opacity', flag ? 1 : .75);
    ov.append('circle').attr('cx',x).attr('cy',y).attr('r',1.8).attr('fill','#eafff4');
    if (flag) { [10, 18, 27].forEach((rr, i) => ov.append('circle').attr('cx',x).attr('cy',y).attr('r',rr).attr('fill','none').attr('stroke','#57ffb0').attr('stroke-width',1.2 - i*.3).attr('opacity', .9 - i*.28)); }
  });
  // home cluster
  const [hx, hy] = proj(home);
  ov.append('circle').attr('cx',hx).attr('cy',hy).attr('r',22).attr('fill','url(#blip)');
  ov.append('circle').attr('cx',hx).attr('cy',hy).attr('r',4.5).attr('fill','#ffb547').attr('stroke','#020605').attr('stroke-width',1.5);

  const lab = (txt, x, y, cls) => { const d = document.createElement('div'); d.className = 'label ' + (cls||''); d.innerHTML = txt; d.style.left = x + 'px'; d.style.top = y + 'px'; document.querySelector('.radar').appendChild(d); return d; };
  const p = n => proj(V.find(v => v[0] === n).slice(1,3));
  let q = p('Lambeau'); lab('LAMBEAU FIELD <span>· NEW</span><br><span>CHI 24 – GB 22 · ’25</span>', q[0] + 24, q[1] - 34, 'big');
  lab('CHICAGO <span>· 46</span>', hx + 12, hy + 12);
  q = p('Fenway'); lab('FENWAY', q[0] - 22, q[1] + 12);
  q = p('COTA'); lab('COTA', q[0] - 12, q[1] + 11);
  q = p('Denver'); lab('DENVER', q[0] - 18, q[1] + 11);
  q = p('St. Louis'); lab('ST. LOUIS', q[0] - 26, q[1] + 11);
  // beyond range: Europe bearing (great-circle initial bearing ≈ 41° from Chicago)
  const ba = (41 - 90) * Math.PI/180;
  const ex = C + Math.cos(ba) * (R + 2), ey = C + Math.sin(ba) * (R + 2);
  ov.append('path').attr('d', `M${ex-6},${ey+4} L${ex+5},${ey-5} M${ex+5},${ey-5} L${ex-2},${ey-6} M${ex+5},${ey-5} L${ex+4},${ey+2}`).attr('stroke','#ffb547').attr('stroke-width',1.8).attr('fill','none').attr('stroke-linecap','round');
  const e = lab('+3 BEYOND RANGE<br><span style="color:rgba(255,181,71,.7)">DORTMUND · BCN · MADRID</span>', ex - 100, ey - 54);
  e.style.color = '#ffb547'; e.style.textAlign = 'right';
})();
</script>
<script src="../../kit/kit.js"></script>
</body></html>
