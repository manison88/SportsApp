<!doctype html>
<html><head><meta charset="utf-8"><title>Trophy shelf</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #120a07; }
  .top { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .hdr { position: absolute; left: 24px; right: 24px; top: 108px; z-index: 6; text-align: center; }
  .hdr .eyebrow { color: #d9b26a; letter-spacing: 3px; }
  .hdr h1 { font: 400 30px/1.05 var(--f-dm); color: #f6ead2; margin-top: 8px; letter-spacing: -.2px; }
  .hdr h1 i { color: #e9c77b; }
  svg#cab { position: absolute; left: 0; top: 0; width: 393px; height: 852px; }
  text { font-family: "Inter", sans-serif; }
  .serif { font-family: "DM Serif Display", serif; }
</style></head>
<body class="phone">
  <svg id="cab" viewBox="0 0 393 852">
    <defs>
      <linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#160c09"/><stop offset=".5" stop-color="#2a1711"/><stop offset="1" stop-color="#160c09"/></linearGradient>
      <pattern id="grain" width="393" height="40" patternUnits="userSpaceOnUse"><path d="M0 8 C 80 4, 160 14, 393 6 M0 22 C 120 28, 220 16, 393 24 M0 34 C 100 30, 260 38, 393 32" stroke="rgba(0,0,0,.25)" fill="none"/></pattern>
      <radialGradient id="spot" cx="50%" cy="0%" r="62%"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".34"/><stop offset=".55" stop-color="#ffcf80" stop-opacity=".08"/><stop offset="1" stop-color="#ffcf80" stop-opacity="0"/></radialGradient>
      <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3f27"/><stop offset=".25" stop-color="#4a2a1a"/><stop offset="1" stop-color="#2a1710"/></linearGradient>
      <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#7a5212"/><stop offset=".22" stop-color="#e7b94c"/><stop offset=".38" stop-color="#fff1b8"/><stop offset=".55" stop-color="#d79e2c"/><stop offset=".8" stop-color="#8d5f14"/><stop offset="1" stop-color="#c38d27"/></linearGradient>
      <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#d79e2c"/><stop offset="1" stop-color="#7a5212"/></linearGradient>
      <linearGradient id="silver" x1="0" x2="1"><stop offset="0" stop-color="#5d636c"/><stop offset=".3" stop-color="#dfe4ea"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".7" stop-color="#9aa1aa"/><stop offset="1" stop-color="#4c5158"/></linearGradient>
      <linearGradient id="bronze" x1="0" x2="1"><stop offset="0" stop-color="#5a2e14"/><stop offset=".3" stop-color="#c47a42"/><stop offset=".45" stop-color="#f2b585"/><stop offset=".7" stop-color="#9a5326"/><stop offset="1" stop-color="#4a250f"/></linearGradient>
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d68c"/><stop offset=".5" stop-color="#c99a45"/><stop offset="1" stop-color="#e8c574"/></linearGradient>
      <linearGradient id="lacq" x1="0" x2="1"><stop offset="0" stop-color="#0d0908"/><stop offset=".4" stop-color="#2b2220"/><stop offset="1" stop-color="#0d0908"/></linearGradient>
      <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4528"/><stop offset=".5" stop-color="#5a3019"/><stop offset="1" stop-color="#3d1f10"/></linearGradient>
      <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f7ff" stop-opacity=".95"/><stop offset=".45" stop-color="#8fd0f5" stop-opacity=".55"/><stop offset="1" stop-color="#cfefff" stop-opacity=".85"/></linearGradient>
      <radialGradient id="globe" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#d79e2c"/><stop offset="1" stop-color="#5e3d0c"/></radialGradient>
      <radialGradient id="ball" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd4da"/><stop offset="1" stop-color="#5d636c"/></radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>

    <rect width="393" height="852" fill="url(#wall)"/>
    <rect width="393" height="852" fill="url(#grain)" opacity=".7"/>
    <!-- spotlights -->
    <rect x="0" y="0" width="393" height="402" fill="url(#spot)"/>
    <rect x="0" y="418" width="393" height="180" fill="url(#spot)" opacity=".8"/>
    <rect x="0" y="614" width="393" height="172" fill="url(#spot)" opacity=".75"/>
    <!-- cabinet side rails -->
    <rect x="0" y="0" width="10" height="852" fill="#2c1810"/><rect x="383" y="0" width="10" height="852" fill="#2c1810"/>

    <!-- ===== SHELF 1 (y=402) ===== -->
    <g id="s1">
      <!-- silver baseball -->
      <g transform="translate(70 402)">
        <ellipse cx="0" cy="-2" rx="38" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
        <rect x="-38" y="-30" width="76" height="30" rx="2" fill="url(#lacq)"/>
        <rect x="-32" y="-24" width="64" height="18" rx="1.5" fill="url(#brass)"/>
        <text x="0" y="-12" text-anchor="middle" font-size="9" font-weight="800" fill="#3a2608" letter-spacing=".5">487 RUNS</text>
        <path d="M-12 -30 L-8 -44 L8 -44 L12 -30Z" fill="url(#silver)"/>
        <circle cx="0" cy="-74" r="31" fill="url(#ball)"/>
        <path d="M-20 -97 C -8 -84, -8 -64, -20 -51 M20 -97 C 8 -84, 8 -64, 20 -51" stroke="#b6343a" stroke-width="1.6" fill="none" opacity=".85"/>
      </g>
      <!-- gold cup -->
      <g transform="translate(196 402)">
        <ellipse cx="0" cy="-2" rx="62" ry="7" fill="#000" opacity=".55" filter="url(#soft)"/>
        <rect x="-62" y="-44" width="124" height="44" rx="2" fill="url(#lacq)"/>
        <rect x="-54" y="-37" width="108" height="29" rx="2" fill="url(#brass)"/>
        <text x="0" y="-25" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a2608" letter-spacing="1.4">LUCKY CHARM</text>
        <text x="0" y="-14" text-anchor="middle" font-size="7" font-weight="600" fill="#3a2608" letter-spacing=".4">WIN RATE · 35–22–2</text>
        <path d="M-30 -44 L-22 -54 L22 -54 L30 -44Z" fill="url(#gold)"/>
        <path d="M-10 -54 C -8 -70, -6 -82, -5 -92 L5 -92 C 6 -82, 8 -70, 10 -54Z" fill="url(#gold)"/>
        <ellipse cx="0" cy="-94" rx="14" ry="5" fill="url(#gold)"/>
        <!-- handles -->
        <path d="M-58 -196 C -98 -196, -92 -128, -36 -118" stroke="url(#goldV)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M58 -196 C 98 -196, 92 -128, 36 -118" stroke="url(#goldV)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <!-- bowl -->
        <path d="M-62 -206 C -62 -150, -36 -104, 0 -98 C 36 -104, 62 -150, 62 -206Z" fill="url(#gold)"/>
        <ellipse cx="0" cy="-206" rx="62" ry="10" fill="#5e3d0c"/>
        <ellipse cx="0" cy="-206" rx="62" ry="10" fill="none" stroke="#fff1b8" stroke-width="2"/>
        <path d="M-44 -192 C -44 -160, -30 -130, -16 -118" stroke="#fff8d8" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
        <text x="0" y="-146" text-anchor="middle" class="serif" font-size="42" fill="#6e4a0e" opacity=".85">61%</text>
        <text x="0" y="-147" text-anchor="middle" class="serif" font-size="42" fill="none" stroke="#fff1b8" stroke-width=".6" opacity=".7">61%</text>
      </g>
      <!-- bronze football -->
      <g transform="translate(318 402)">
        <ellipse cx="0" cy="-2" rx="38" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
        <rect x="-38" y="-30" width="76" height="30" rx="2" fill="url(#lacq)"/>
        <rect x="-32" y="-24" width="64" height="18" rx="1.5" fill="url(#brass)"/>
        <text x="0" y="-12" text-anchor="middle" font-size="9" font-weight="800" fill="#3a2608" letter-spacing=".2">1,204 PTS</text>
        <path d="M-14 -30 L-8 -46 L8 -46 L14 -30Z" fill="url(#bronze)"/>
        <ellipse cx="0" cy="-76" rx="21" ry="34" transform="rotate(24 0 -76)" fill="url(#bronze)"/>
        <path d="M-6 -90 L8 -62 M-4 -84 l6 -3 M0 -77 l6 -3 M3 -70 l6 -3" stroke="#ffe1c4" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      </g>
    </g>
    <rect x="10" y="402" width="373" height="16" fill="url(#board)"/>
    <rect x="10" y="402" width="373" height="1.5" fill="#a26a45"/>
    <rect x="10" y="418" width="373" height="22" fill="#000" opacity=".35" filter="url(#soft)"/>

    <!-- ===== SHELF 2 (y=598) ===== -->
    <!-- walnut plaque -->
    <g transform="translate(30 598)">
      <ellipse cx="78" cy="-2" rx="80" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
      <path d="M8 -136 L156 -136 L160 -2 L4 -2Z" fill="url(#walnut)"/>
      <path d="M8 -136 L156 -136 L160 -2 L4 -2Z" fill="none" stroke="#a26a45" stroke-width="1.5" opacity=".6"/>
      <rect x="20" y="-122" width="124" height="104" rx="3" fill="url(#brass)"/>
      <rect x="24" y="-118" width="116" height="96" rx="2" fill="none" stroke="#8a6420" stroke-width=".8"/>
      <text x="82" y="-100" text-anchor="middle" font-size="7.5" font-weight="800" fill="#4a3210" letter-spacing="1.8">MILES TRAVELED</text>
      <text x="82" y="-66" text-anchor="middle" class="serif" font-size="32" fill="#3a2608">42,900</text>
      <path d="M40 -54 L124 -54" stroke="#8a6420" stroke-width=".8"/>
      <text x="82" y="-38" text-anchor="middle" font-size="7.5" font-weight="700" fill="#4a3210" letter-spacing=".8">1.7 TIMES AROUND</text>
      <text x="82" y="-28" text-anchor="middle" font-size="7.5" font-weight="700" fill="#4a3210" letter-spacing=".8">THE EARTH</text>
    </g>
    <!-- gold globe -->
    <g transform="translate(236 598)">
      <ellipse cx="0" cy="-2" rx="36" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
      <rect x="-30" y="-28" width="60" height="28" rx="2" fill="url(#lacq)"/>
      <rect x="-26" y="-23" width="52" height="17" rx="1.5" fill="url(#brass)"/>
      <text x="0" y="-11.5" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a2608" letter-spacing=".3">4,600 MI</text>
      <path d="M-4 -28 L-3 -44 L3 -44 L4 -28Z" fill="url(#gold)"/>
      <path d="M-34 -84 A 36 36 0 0 0 30 -58" stroke="url(#goldV)" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-82" r="30" fill="url(#globe)"/>
      <g fill="none" stroke="#6e4a0e" stroke-width="1" opacity=".7">
        <ellipse cx="0" cy="-82" rx="30" ry="10"/><ellipse cx="0" cy="-82" rx="12" ry="30"/><path d="M-30 -82 H30"/>
      </g>
      <circle cx="11" cy="-90" r="3" fill="#b6343a" stroke="#fff1b8" stroke-width="1"/>
      <text x="0" y="-120" text-anchor="middle" font-size="7.5" font-weight="700" fill="#e9c77b" letter-spacing="1.6">SPAIN · 2020</text>
    </g>
    <!-- puck -->
    <g transform="translate(330 598)">
      <ellipse cx="0" cy="-2" rx="34" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
      <path d="M-26 0 L-20 -64 L20 -64 L26 0Z" fill="url(#lacq)"/>
      <rect x="-22" y="-44" width="44" height="30" rx="1.5" fill="url(#brass)"/>
      <text x="0" y="-31" text-anchor="middle" class="serif" font-size="14" fill="#3a2608">162</text>
      <text x="0" y="-20" text-anchor="middle" font-size="7" font-weight="800" fill="#3a2608" letter-spacing="1">GOALS</text>
      <ellipse cx="0" cy="-70" rx="24" ry="7" fill="#0b0b0c"/>
      <rect x="-24" y="-82" width="48" height="12" fill="#151517"/>
      <ellipse cx="0" cy="-82" rx="24" ry="7" fill="url(#silver)" opacity=".9"/>
      <ellipse cx="0" cy="-82" rx="24" ry="7" fill="#1c1c1f" opacity=".75"/>
      <path d="M-18 -84 q 18 -6 36 0" stroke="#fff" stroke-width="1" fill="none" opacity=".35"/>
    </g>
    <rect x="10" y="598" width="373" height="16" fill="url(#board)"/>
    <rect x="10" y="598" width="373" height="1.5" fill="#a26a45"/>
    <rect x="10" y="614" width="373" height="22" fill="#000" opacity=".35" filter="url(#soft)"/>

    <!-- ===== SHELF 3 (y=786) ===== -->
    <!-- ice crystal -->
    <g transform="translate(66 786)">
      <ellipse cx="0" cy="-2" rx="38" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
      <rect x="-32" y="-24" width="64" height="24" rx="2" fill="url(#lacq)"/>
      <rect x="-27" y="-19" width="54" height="14" rx="1.5" fill="#cfd4da"/>
      <text x="0" y="-9" text-anchor="middle" font-size="7.5" font-weight="800" fill="#25303a" letter-spacing=".8">COLDEST</text>
      <path d="M-22 -24 L-26 -96 L-6 -132 L18 -118 L26 -40 L22 -24Z" fill="url(#ice)" stroke="#e9f7ff" stroke-width="1"/>
      <path d="M-6 -132 L-2 -24 M-26 -96 L18 -118 M-2 -70 L26 -40" stroke="#ffffff" stroke-width=".8" opacity=".6"/>
      <text x="0" y="-62" text-anchor="middle" class="serif" font-size="22" fill="#0f3a58">19°F</text>
      <text x="0" y="-48" text-anchor="middle" font-size="6" font-weight="700" fill="#0f3a58" letter-spacing=".3">LAMBEAU</text>
    </g>
    <!-- Maya medal -->
    <g transform="translate(176 786)">
      <ellipse cx="0" cy="-2" rx="44" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
      <path d="M-34 0 L-6 -96 M34 0 L6 -96" stroke="#3d1f10" stroke-width="4" stroke-linecap="round"/>
      <path d="M-20 -128 L0 -82 L20 -128 L8 -128 L0 -104 L-8 -128Z" fill="#ff7a8a"/>
      <path d="M-20 -128 L-8 -128 L0 -104 L8 -128 L20 -128" fill="none" stroke="#c94a5c" stroke-width="1"/>
      <path d="M-4 -128 L4 -128 L0 -112Z" fill="#fff" opacity=".7"/>
      <circle cx="0" cy="-58" r="31" fill="url(#gold)"/>
      <circle cx="0" cy="-58" r="26" fill="none" stroke="#fff1b8" stroke-width="1.2" opacity=".8"/>
      <text x="0" y="-55" text-anchor="middle" class="serif" font-size="24" fill="#5e3d0c">17</text>
      <text x="0" y="-43" text-anchor="middle" font-size="5.6" font-weight="800" fill="#5e3d0c" letter-spacing=".5">WITH MAYA</text>
    </g>
    <!-- plaques: venues + countries -->
    <g transform="translate(250 786)">
      <ellipse cx="62" cy="-2" rx="66" ry="5" fill="#000" opacity=".5" filter="url(#soft)"/>
      <rect x="0" y="-84" width="124" height="84" rx="4" fill="url(#lacq)"/>
      <rect x="8" y="-76" width="108" height="32" rx="2" fill="url(#brass)"/>
      <text x="18" y="-53" class="serif" font-size="22" fill="#3a2608">21</text>
      <text x="48" y="-56" font-size="8" font-weight="800" fill="#3a2608" letter-spacing="1.2">VENUES</text>
      <rect x="8" y="-38" width="108" height="30" rx="2" fill="url(#brass)"/>
      <text x="18" y="-16" class="serif" font-size="22" fill="#3a2608">3</text>
      <text x="48" y="-19" font-size="8" font-weight="800" fill="#3a2608" letter-spacing="1.2">COUNTRIES</text>
      <rect x="2" y="-84" width="120" height="2" fill="#fff" opacity=".1"/>
    </g>
    <rect x="10" y="786" width="373" height="16" fill="url(#board)"/>
    <rect x="10" y="786" width="373" height="1.5" fill="#a26a45"/>
    <rect x="10" y="802" width="373" height="50" fill="#0b0605"/>
  </svg>

  <div class="top">
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>
  <div class="hdr">
    <div class="eyebrow">Trophy room · Since 2014</div>
    <h1>Sixty games, <i>polished.</i></h1>
  </div>
  <div class="grain" style="opacity:.2"></div>
<script src="../../kit/kit.js"></script>
</body></html>
