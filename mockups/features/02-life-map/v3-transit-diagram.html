<!doctype html>
<html><head><meta charset="utf-8"><title>Transit diagram</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #fbfaf7; color: #141414; }
  .head { position: absolute; top: 60px; left: 20px; right: 20px; display: flex; align-items: center; gap: 12px; }
  .roundel { width: 44px; height: 44px; border-radius: 50%; border: 7px solid #141414; display: grid; place-items: center; position: relative; }
  .roundel::after { content: ""; position: absolute; left: -12px; right: -12px; top: 50%; height: 11px; margin-top: -5.5px; background: #141414; }
  .head h1 { font: 800 25px/1 var(--f-tight); letter-spacing: -.8px; }
  .head p { margin-top: 4px; font: 500 12.5px/1 var(--f-ui); color: rgba(20,20,20,.55); }
  .head .zone { margin-left: auto; font: 700 10px/1 var(--f-ui); letter-spacing: 1.4px; padding: 7px 9px; border-radius: 6px; background: #141414; color: #fff; }
  #map { position: absolute; left: 0; top: 128px; }
  .legend { position: absolute; left: 16px; right: 16px; top: 676px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .lg { height: 46px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); display: flex; align-items: center; gap: 9px; padding: 0 10px; }
  .lg i { width: 6px; height: 26px; border-radius: 3px; }
  .lg b { display: block; font: 700 13px/1 var(--f-ui); letter-spacing: -.1px; }
  .lg span { display: block; margin-top: 3px; font: 500 10.5px/1 var(--f-ui); color: rgba(20,20,20,.5); }
  .foot { position: absolute; left: 20px; right: 20px; top: 788px; display: flex; justify-content: space-between; font: 600 11px/1 var(--f-ui); color: rgba(20,20,20,.45); }
</style></head>
<body class="phone" data-chrome="dark">
  <div class="head">
    <div class="roundel"></div>
    <div><h1>The Okafor Lines</h1><p>21 stations · 6 lines · since 2014</p></div>
    <div class="zone">ZONE 1–3</div>
  </div>
  <svg id="map" width="393" height="540"></svg>

  <div class="legend">
    <div class="lg"><i style="background:#1f5bd6"></i><div><b>Baseball</b><span>14 parks</span></div></div>
    <div class="lg"><i style="background:#f05a1a"></i><div><b>Football</b><span>2 stadiums</span></div></div>
    <div class="lg"><i style="background:#18a058"></i><div><b>Soccer</b><span>4 grounds</span></div></div>
    <div class="lg"><i style="background:#e8213f"></i><div><b>Basketball</b><span>1 arena</span></div></div>
    <div class="lg"><i style="background:#1a1a1a"></i><div><b>Hockey</b><span>1 arena</span></div></div>
    <div class="lg"><i style="background:#8a4bd8"></i><div><b>Formula 1</b><span>1 circuit</span></div></div>
  </div>
  <div class="foot"><span>Line weight = games</span><span>Not to scale</span></div>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('map');
  const el = (t, a, parent = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
  const C = { mlb: '#1f5bd6', nfl: '#f05a1a', soc: '#18a058', nba: '#e8213f', nhl: '#1a1a1a', f1: '#8a4bd8' };
  const LW = 6;
  const line = (pts, col, w = LW, dash) => el('path', { d: 'M' + pts.map(p => p.join(',')).join(' L'), fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...(dash ? { 'stroke-dasharray': dash } : {}) });
  const text = (x, y, s, o = {}) => { const t = el('text', { x, y, 'font-family': 'Inter', 'font-size': o.size || 11.5, 'font-weight': o.weight || 600, fill: o.fill || '#141414', 'text-anchor': o.anchor || 'start', ...(o.rot ? { transform: `rotate(${o.rot} ${x} ${y})` } : {}), 'letter-spacing': o.ls || -.1 }); t.textContent = s; return t; };
  const tick = (x, y, dir, col) => { const d = { n: [0, -7], s: [0, 7], e: [7, 0], w: [-7, 0] }[dir]; line([[x, y], [x + d[0], y + d[1]]], col, 5); };
  const inter = (x, y, r = 7.5) => { el('circle', { cx: x, cy: y, r, fill: '#fff', stroke: '#141414', 'stroke-width': 3 }); };
  const count = (x, y, n, anchor = 'start') => text(x, y, n, { size: 10, weight: 700, fill: 'rgba(20,20,20,.38)', anchor });

  const HX = 196, HY = 200;           // home
  const MY = 104;                      // baseball trunk
  // --- Baseball: branch west + east from Wrigley ---
  const west = ['Dodger Stadium', 'Oracle Park', 'Coors Field', 'Kauffman', 'Target Field', 'Milwaukee'];
  const east = ['Rate Field', 'Busch Stadium', 'Cincinnati', 'Comerica Park', 'PNC Park', 'Yankee Stadium', 'Fenway Park'];
  const x0 = 22, x1 = 332, step = (x1 - x0) / 13;
  const xs = i => x0 + i * step;       // 0..13, Wrigley at index 6
  const WX = xs(6);
  line([[HX, HY], [HX, MY + 14], [WX, MY]], C.mlb, 7);
  line([[x0, MY], [x1, MY]], C.mlb, 7);
  [...west, null, ...east].forEach((n, i) => {
    if (!n) return; const x = xs(i);
    tick(x, MY, 'n', C.mlb);
    text(x + 2, MY - 13, n, { rot: -52, size: 11, weight: n === 'Fenway Park' || n === 'Rate Field' ? 700 : 600 });
  });
  // --- Football + Soccer to Soldier Field ---
  const SX = 116, SY = 270;
  line([[HX - 4, HY], [HX - 4, HY + 12], [SX - 4, SY - 4 + 0], [SX - 4, SY + 72]], C.nfl, 7);          // to Lambeau
  line([[HX + 4, HY], [HX + 4, HY + 16], [SX + 4, SY + 4 - 0 + 0], [SX + 4, SY + 18], [60, SY + 74], [60, SY + 96]], C.soc, 7);
  line([[60, SY + 96], [60, SY + 132]], C.soc, 7, '2 7');          // ocean crossing
  line([[60, SY + 132], [60, SY + 222]], C.soc, 7);
  // --- Basketball + Hockey to United Center ---
  const UX = 282, UY = 270;
  line([[HX + 2, HY], [HX + 2, HY + 12], [UX - 2, UY - 4], [UX - 2, UY + 8]], C.nba, 7);
  line([[HX + 10, HY], [HX + 10, HY + 4], [UX + 6, UY - 6], [UX + 6, UY + 8]], C.nhl, 7);
  // --- F1 straight south ---
  line([[HX, HY], [HX, 400]], C.f1, 7);

  // stations
  inter(WX, MY, 9);
  text(WX + 2, MY - 15, 'Wrigley Field', { rot: -52, size: 13, weight: 800 });
  // Home
  el('rect', { x: HX - 20, y: HY - 11, width: 40, height: 22, rx: 11, fill: '#fff', stroke: '#141414', 'stroke-width': 3 });
  el('circle', { cx: HX, cy: HY, r: 4.5, fill: '#ffb547' });
  text(HX + 28, HY - 2, 'Home', { size: 15, weight: 800, ls: -.3 });
  text(HX + 28, HY + 12, 'Logan Square', { size: 11, weight: 500, fill: 'rgba(20,20,20,.55)' });
  // Soldier Field interchange (NFL + soccer)
  el('rect', { x: SX - 12, y: SY - 9, width: 24, height: 18, rx: 9, fill: '#fff', stroke: '#141414', 'stroke-width': 3 });
  text(SX - 18, SY + 4, 'Soldier Field', { anchor: 'end', size: 13, weight: 800 });
  count(SX - 18, SY + 18, '15 games', 'end');
  // Lambeau terminus
  tick(SX - 4, SY + 72, 'e', C.nfl); line([[SX - 10, SY + 72], [SX + 2, SY + 72]], C.nfl, 5);
  text(SX - 4, SY + 92, 'Lambeau Field', { size: 12, anchor: 'middle' }); count(SX - 4, SY + 106, 'Week 18 · ’25', 'middle');
  // United Center interchange
  el('rect', { x: UX - 12, y: UY - 2, width: 24, height: 18, rx: 9, fill: '#fff', stroke: '#141414', 'stroke-width': 3 });
  text(UX + 18, UY + 11, 'United Center', { size: 13, weight: 800 });
  count(UX + 18, UY + 25, '11 games');
  // soccer stations
  text(72, SY + 120, 'Atlantic', { size: 10, weight: 600, fill: 'rgba(20,20,20,.4)' });
  [['Signal Iduna Park', SY + 150, 'Dortmund · ’17'], ['Camp Nou', SY + 186, 'Barcelona · ’20'], ['Bernabéu', SY + 222, 'Madrid · ’20']].forEach(([n, y, sub], i) => {
    if (i < 2) tick(60, y, 'e', C.soc); else { line([[52, y], [68, y]], C.soc, 5); }
    text(74, y + 4, n, { size: 12 }); count(74, y + 17, sub);
  });
  // COTA terminus
  line([[HX - 8, 400], [HX + 8, 400]], C.f1, 5);
  text(HX + 14, 404, 'Circuit of the Americas', { size: 12 }); count(HX + 14, 417, 'Austin · US Grand Prix ’21');
  // you-are-here
  el('circle', { cx: HX, cy: HY, r: 16, fill: 'none', stroke: '#ffb547', 'stroke-width': 1.5, opacity: .8 });
})();
</script>
<script src="../../kit/kit.js"></script>
</body></html>
