<!doctype html>
<html><head><meta charset="utf-8"><title>Broadcast intro</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #02040a; }
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg img { transform: scale(1.35); transform-origin: 92% 74%; filter: saturate(1.1) contrast(1.1) brightness(.62); }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2,4,10,.7) 0%, rgba(2,4,10,.1) 25%, rgba(2,4,10,.25) 50%, rgba(2,4,10,.9) 76%, #02040a 88%); }
  .sw { position: absolute; z-index: 2; left: -60px; width: 560px; transform: rotate(-14deg); transform-origin: left center; }
  .sw.a { top: 360px; height: 120px; background: linear-gradient(90deg, rgba(14,51,134,0) 0%, rgba(14,51,134,.95) 30%, #2f6bff 70%, rgba(47,107,255,0) 100%); }
  .sw.b { top: 470px; height: 10px; background: linear-gradient(90deg, rgba(204,52,51,0), #cc3433 30%, #ff5a4e 70%, rgba(204,52,51,0)); box-shadow: 0 0 24px rgba(255,80,70,.8); }
  .sw.c { top: 340px; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9) 40%, transparent); }
  .sw.d { top: 498px; height: 3px; background: linear-gradient(90deg, transparent 20%, rgba(255,255,255,.7) 60%, transparent); }
  .streaks { position: absolute; z-index: 2; left: 0; right: 0; top: 280px; height: 300px; transform: rotate(-14deg); }
  .streaks i { position: absolute; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); }
  .gfx { position: absolute; z-index: 4; left: 22px; top: 326px; transform: rotate(-14deg); transform-origin: left top; }
  .gfx .k { display: inline-block; font: 800 12px/1 var(--f-ui); letter-spacing: 3px; color: #fff; background: #cc3433; padding: 6px 9px 6px 11px; }
  .gfx h1 { margin-top: 4px; font: 400 76px/.86 var(--f-anton); letter-spacing: -.5px; color: #fff; text-transform: uppercase; font-style: italic; text-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .gfx h1 span { color: #0b1430; -webkit-text-stroke: 0; background: #fff; padding: 0 10px 0 6px; display: inline-block; margin-top: 6px; }
  .bug { position: absolute; z-index: 6; top: 106px; left: 16px; display: flex; align-items: stretch; height: 40px; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .bug .w { width: 40px; background: #fff; display: grid; place-items: center; font: 400 22px/1 var(--f-anton); color: #0e3386; font-style: italic; }
  .bug .t { display: flex; align-items: center; gap: 8px; padding: 0 10px; font: 700 16px/1 var(--f-cond); color: #fff; letter-spacing: .4px; }
  .bug .t b { font: 800 22px/1 var(--f-cond); }
  .bug .cle { background: #0c2340; box-shadow: inset 3px 0 #e8344a; } .bug .chc { background: #0e3386; box-shadow: inset 3px 0 #cc3433; }
  .bug .st { background: rgba(5,5,6,.92); color: var(--signal); font: 700 13px/1 var(--f-cond); letter-spacing: 1.4px; display: flex; align-items: center; padding: 0 10px; }
  .topbar { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 7; }
  .topbar .pill { height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-ui); }
  .lower { position: absolute; z-index: 5; left: 16px; right: 16px; top: 588px; display: flex; align-items: stretch; height: 44px; }
  .lower .a { background: #fff; color: #050506; display: flex; align-items: center; padding: 0 12px; font: 400 18px/1 var(--f-anton); letter-spacing: .6px; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); padding-right: 22px; }
  .lower .b { flex: 1; margin-left: -6px; background: rgba(5,8,18,.85); display: flex; flex-direction: column; justify-content: center; padding: 0 12px 0 16px; clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%); }
  .lower .b b { font: 700 12px/1.1 var(--f-ui); color: #fff; }
  .lower .b span { font: 500 10.5px/1.2 var(--f-ui); color: var(--text-2); margin-top: 3px; }
  .player { position: absolute; z-index: 8; left: 12px; right: 12px; top: 664px; height: 140px; border-radius: 26px; padding: 16px 18px; }
  .row1 { display: flex; justify-content: space-between; align-items: center; }
  .row1 .ti b { display: block; font: 600 15px/1.1 var(--f-ui); }
  .row1 .ti span { display: block; margin-top: 3px; font: 500 11.5px/1 var(--f-ui); color: var(--text-2); }
  .live { font: 700 10px/1 var(--f-ui); letter-spacing: 1.4px; color: var(--text-2); display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 8px; background: rgba(255,255,255,.08); }
  .scrub { position: relative; margin-top: 16px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); }
  .scrub b { position: absolute; left: 0; top: 0; bottom: 0; width: 9%; border-radius: 2px; background: #fff; }
  .scrub .buf { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: rgba(255,255,255,.18); border-radius: 2px; }
  .scrub .k { position: absolute; top: -4px; width: 2px; height: 12px; background: var(--signal); border-radius: 1px; }
  .scrub .h { position: absolute; left: 9%; top: -5px; width: 14px; height: 14px; border-radius: 7px; background: #fff; transform: translateX(-50%); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .times { margin-top: 8px; display: flex; justify-content: space-between; font: 600 10.5px/1 var(--f-mono); color: var(--text-2); }
  .ctr { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
  .ctr svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctr .pp svg { width: 30px; height: 30px; fill: #fff; stroke: none; }
</style></head>
<body class="phone">
  <div class="bg"><img class="ph" src="../../photos/wrigley-night-2.jpg" style="object-position:50% 50%"></div>
  <div class="sw a"></div><div class="sw c"></div><div class="sw b"></div><div class="sw d"></div>
  <div class="streaks">
    <i style="left:20px;top:30px;width:120px"></i><i style="left:220px;top:60px;width:160px"></i><i style="left:120px;top:250px;width:200px"></i><i style="left:280px;top:226px;width:90px"></i><i style="left:-10px;top:200px;width:110px"></i>
  </div>

  <div class="topbar">
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    <div class="pill glass"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.2"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Broadcast style</div>
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>

  <div class="bug">
    <div class="w">W</div>
    <div class="t cle">CLE <b class="tnum">0</b></div>
    <div class="t chc">CHC <b class="tnum">0</b></div>
    <div class="st">CLE LEADS 3–1</div>
  </div>

  <div class="gfx">
    <span class="k">TONIGHT ON WITNESS</span>
    <h1>World Series<br><span>Game 5</span></h1>
  </div>

  <div class="lower">
    <div class="a">Live from Wrigley</div>
    <div class="b"><b>Chicago, Illinois · 63° Clear</b><span>Sam & Dad · Bleachers, Sec 314</span></div>
  </div>

  <div class="player glass">
    <div class="row1">
      <div class="ti"><b>Game 5 · Recap film</b><span>Cold open · 6 photos, 11 plays</span></div>
      <span class="live">1080p · HDR</span>
    </div>
    <div class="scrub"><span class="buf"></span><b></b><i class="k" style="left:24%"></i><i class="k" style="left:46%"></i><i class="k" style="left:58%"></i><i class="k" style="left:92%"></i><span class="h"></span></div>
    <div class="times tnum"><span>0:08</span><span>1:30</span></div>
    <div class="ctr">
      <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <svg viewBox="0 0 24 24"><path d="M19 5L9 12l10 7zM5 5v14"/></svg>
      <span class="pp"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></span>
      <svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7zM19 5v14"/></svg>
      <svg viewBox="0 0 24 24"><path d="M5 17H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-1"/><path d="M12 15l5 6H7z"/></svg>
    </div>
  </div>
<script src="../../kit/kit.js"></script>
</body></html>
