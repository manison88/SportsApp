<!doctype html>
<html><head><meta charset="utf-8"><title>Seat map</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #07080b; }
  .bg { position: absolute; inset: 0; background: radial-gradient(70% 40% at 60% 30%, rgba(255,160,60,.12), transparent 70%), #07080b; }
  .top { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .top .ttl { font: 600 15px/1 var(--f-ui); }
  .hdr { position: absolute; left: 22px; right: 22px; top: 112px; }
  .hdr .eyebrow { color: var(--signal); }
  .hdr h1 { font: 700 30px/1.05 var(--f-tight); letter-spacing: -.8px; margin-top: 8px; }
  .hdr h1 span { color: var(--text-3); }
  .chips { position: absolute; left: 22px; right: 0; top: 204px; display: flex; gap: 8px; }
  .chip { height: 30px; padding: 0 13px; border-radius: 15px; display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px/1 var(--f-ui); color: var(--text-2); background: #15161b; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.1); white-space: nowrap; }
  .chip.on { background: #f5f1ea; color: #111; }
  .chip i { font-style: normal; opacity: .55; }
  svg#map { position: absolute; left: 13px; top: 250px; width: 367px; height: 355px; }
  .tip { position: absolute; left: 16px; top: 252px; width: 132px; padding: 11px 12px; border-radius: 14px; z-index: 5; }
  .tip .k { font: 700 9.5px/1 var(--f-ui); letter-spacing: 1.5px; color: var(--signal); text-transform: uppercase; }
  .tip .t { font: 600 15px/1.15 var(--f-ui); margin-top: 6px; }
  .tip .s { font: 400 12px/1.3 var(--f-ui); color: var(--text-2); margin-top: 3px; }

  .list { position: absolute; left: 16px; right: 16px; top: 612px; padding: 4px 16px; border-radius: 22px; background: #111216; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.08); }
  .row { display: grid; grid-template-columns: 44px 1fr 92px 40px; align-items: center; height: 36px; border-bottom: .5px solid rgba(255,255,255,.07); }
  .row:last-child { border-bottom: 0; }
  .row .sec { font: 700 17px/1 var(--f-cond); letter-spacing: .3px; color: var(--signal); }
  .row .nm { font: 500 13.5px/1 var(--f-ui); color: var(--text); }
  .row .nm span { color: var(--text-3); }
  .row .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); position: relative; overflow: hidden; }
  .row .bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #ff9a2f, #ffd27a); }
  .row .wl { font: 600 12.5px/1 var(--f-ui); color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
</style></head>
<body class="phone">
  <div class="bg"></div>
  <div class="top">
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="ttl">Wrigley Field</div>
    <div class="btn-circle glass"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
  </div>
  <div class="hdr">
    <div class="eyebrow">Your seats · 2014–2026</div>
    <h1>17 games from<br>5 sections. <span>11–6.</span></h1>
  </div>
  <div class="chips"><span class="chip on">All <i>17</i></span><span class="chip">With Dad <i>6</i></span><span class="chip">Postseason <i>2</i></span></div>

  <svg id="map" viewBox="0 0 393 380"></svg>
  <div class="tip glass"><div class="k">Sec 314</div><div class="t">Bleachers, 6×</div><div class="s">5–1 here, incl. WS Game 5 with Dad</div></div>

  <div class="list">
    <div class="row"><span class="sec">314</span><span class="nm">Bleachers</span><span class="bar"><b style="width:100%"></b></span><span class="wl">5–1</span></div>
    <div class="row"><span class="sec">209</span><span class="nm">Terrace <span>· 3B</span></span><span class="bar"><b style="width:66%"></b></span><span class="wl">2–2</span></div>
    <div class="row"><span class="sec">118</span><span class="nm">Field box <span>· home</span></span><span class="bar"><b style="width:50%"></b></span><span class="wl">2–1</span></div>
    <div class="row"><span class="sec">230</span><span class="nm">Terrace <span>· 1B</span></span><span class="bar"><b style="width:33%"></b></span><span class="wl">1–1</span></div>
    <div class="row"><span class="sec">506</span><span class="nm">Upper deck</span><span class="bar"><b style="width:33%"></b></span><span class="wl">1–1</span></div>
  </div>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('map');
  const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const C = [196, 196];
  const pt = (r, deg) => [C[0] + r * Math.sin(deg * Math.PI / 180), C[1] - r * Math.cos(deg * Math.PI / 180)];
  const wedge = (r0, r1, a0, a1) => {
    const [p0, p1, p2, p3] = [pt(r0, a0), pt(r1, a0), pt(r1, a1), pt(r0, a1)];
    const lg = Math.abs(a1 - a0) > 180 ? 1 : 0, sw = a1 > a0 ? 1 : 0;
    return `M${p0} L${p1} A${r1} ${r1} 0 ${lg} ${sw} ${p2} L${p3} A${r0} ${r0} 0 ${lg} ${1 - sw} ${p0} Z`;
  };
  const defs = el('defs', {});
  defs.innerHTML = `
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="grass" cx="50%" cy="70%" r="70%"><stop offset="0" stop-color="#16301d"/><stop offset="1" stop-color="#0c1810"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffb547" stop-opacity=".9"/><stop offset=".4" stop-color="#ff9a2f" stop-opacity=".3"/><stop offset="1" stop-color="#ff9a2f" stop-opacity="0"/></radialGradient>
    <pattern id="mow" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="transparent"/><rect width="5" height="10" fill="rgba(255,255,255,.025)"/></pattern>`;
  // field
  const BL = 82; // bleachers span ±BL degrees
  const fieldD = `M${pt(104, 100)} A104 104 0 0 1 ${pt(104, 260)} L${pt(132, 262)} A132 132 0 1 1 ${pt(132, 98)} Z`;
  el('path', { d: fieldD, fill: 'url(#grass)' });
  el('path', { d: fieldD, fill: 'url(#mow)' });
  const H = [196, 282], dd = 46;
  el('path', { d: `M${H[0]} ${H[1] + 4} L${H[0] - dd - 10} ${H[1] - dd - 4} Q${H[0]} ${H[1] - 2 * dd - 26} ${H[0] + dd + 10} ${H[1] - dd - 4} Z`, fill: '#3a281d' });
  el('polygon', { points: `${H[0]},${H[1] - 6} ${H[0] - dd + 9},${H[1] - dd} ${H[0]},${H[1] - 2 * dd + 6} ${H[0] + dd - 9},${H[1] - dd}`, fill: '#16301d' });
  const lf = pt(130, 278), rf = pt(130, 82);
  el('line', { x1: H[0], y1: H[1], x2: lf[0], y2: lf[1], stroke: 'rgba(255,255,255,.35)', 'stroke-width': .8 });
  el('line', { x1: H[0], y1: H[1], x2: rf[0], y2: rf[1], stroke: 'rgba(255,255,255,.35)', 'stroke-width': .8 });
  [[H[0], H[1]], [H[0] + dd, H[1] - dd], [H[0], H[1] - 2 * dd], [H[0] - dd, H[1] - dd]].forEach(([x, y]) => el('rect', { x: x - 2, y: y - 2, width: 4, height: 4, fill: '#e9e4da', transform: `rotate(45 ${x} ${y})` }));
  el('circle', { cx: H[0], cy: H[1] - dd, r: 4, fill: '#3a281d' });
  el('path', { d: `M${pt(133, 262)} A133 133 0 1 1 ${pt(133, 98)}`, fill: 'none', stroke: '#2b6a37', 'stroke-width': 2.5 });

  const mine = { 314: 6, 209: 4, 118: 3, 230: 2, 506: 2 };
  const halo = el('g', {});
  const base = el('g', {});
  const glowG = el('g', { filter: 'url(#glow)' });
  const txtG = el('g', {});
  const label = (num, r, ang, hot) => {
    const [x, y] = pt(r, ang);
    let rot = ((ang % 360) + 360) % 360;
    rot = rot < 180 ? rot - 90 : rot + 90;
    const t = el('text', { x, y, dy: '.36em', transform: `rotate(${rot} ${x} ${y})`, 'text-anchor': 'middle', 'font-family': 'Inter', 'font-weight': hot ? 800 : 600, 'font-size': hot ? 7.6 : 6.2, fill: hot ? '#2a1604' : 'rgba(245,241,234,.34)' }, txtG);
    t.textContent = num;
  };
  const sec = (r0, r1, a0, a1, num, showLbl) => {
    const n = mine[num], d = wedge(r0, r1, Math.min(a0, a1), Math.max(a0, a1)), am = (a0 + a1) / 2, rm = (r0 + r1) / 2;
    if (n) {
      const [hx, hy] = pt(rm, am);
      el('circle', { cx: hx, cy: hy, r: 18 + n * 4, fill: 'url(#halo)', opacity: .55 + n * .07 }, halo);
      el('path', { d, fill: `rgb(255,${168 + n * 10},${80 + n * 10})`, stroke: '#fff3d6', 'stroke-width': .6 }, glowG);
      label(num, rm, am, true);
    } else {
      el('path', { d, fill: '#1a1b21', stroke: '#07080b', 'stroke-width': 1.1 }, base);
      if (showLbl && !mine[num - 1] && !mine[num + 1]) label(num, rm, am, false);
    }
  };
  const ring = (r0, r1, start, count, every) => {
    for (let i = 0; i < count; i++) {
      const a0 = 260 - (160 / count) * i, a1 = 260 - (160 / count) * (i + 1);
      sec(r0, r1, a0, a1, start + i, i % every === 2);
    }
  };
  ring(108, 132, 101, 35, 5);
  ring(137, 160, 201, 40, 6);
  ring(166, 188, 501, 36, 6);
  const NB = 20;
  for (let i = 0; i < NB; i++) {
    const a0 = -BL + (2 * BL / NB) * i, a1 = a0 + 2 * BL / NB;
    sec(138, Math.abs((a0 + a1) / 2) < 12 ? 168 : 162, a0, a1, 301 + i, i % 4 === 1);
  }
  // CF scoreboard
  el('rect', { x: 178, y: 16, width: 36, height: 9, rx: 1.5, fill: '#1f4d33', stroke: 'rgba(255,255,255,.3)', 'stroke-width': .5 });
  // leader from 314 to the tooltip
  const i314 = 13, p = pt(166, -BL + (2 * BL / NB) * (i314 + .5));
  el('path', { d: `M${p[0]} ${p[1]} C ${p[0] - 6} ${p[1] - 34}, 214 2, 146 14`, fill: 'none', stroke: 'rgba(255,210,122,.75)', 'stroke-width': 1, 'stroke-dasharray': '2 2' });
  el('circle', { cx: p[0], cy: p[1], r: 2.4, fill: '#ffd27a' });
  // most recent visit
  const r = pt(148.5, 260 - (160 / 40) * 29.5);
  el('circle', { cx: r[0], cy: r[1], r: 10, fill: 'none', stroke: '#fff', 'stroke-width': 1.2, 'stroke-dasharray': '2 2' });
  const lp = pt(200, 126); el('path', { d: `M${r[0] + 7} ${r[1] + 7} L${lp[0] - 2} ${lp[1] - 4}`, stroke: 'rgba(255,255,255,.5)', 'stroke-width': .8 }); const t = el('text', { x: lp[0], y: lp[1] + 6, 'font-family': 'Inter', 'font-weight': 600, 'font-size': 8.5, fill: 'rgba(245,241,234,.85)' }); t.textContent = 'Jul 4 ’26';
})();
</script>
<script src="../../kit/kit.js"></script>
</body></html>
