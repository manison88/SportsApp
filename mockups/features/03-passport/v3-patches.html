<!doctype html>
<html><head><meta charset="utf-8"><title>Patches</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  body.phone { background: #1d3157; }
  .denim { position: absolute; inset: 0; background:
      radial-gradient(40% 22% at 50% 44%, rgba(170,200,240,.28), rgba(0,0,0,0) 70%),
      radial-gradient(70% 40% at 50% 100%, rgba(5,12,30,.6), rgba(0,0,0,0) 70%),
      repeating-linear-gradient(63deg, rgba(255,255,255,.075) 0 1px, rgba(255,255,255,0) 1px 2.6px),
      repeating-linear-gradient(-27deg, rgba(0,0,10,.14) 0 .8px, rgba(0,0,0,0) .8px 3px),
      linear-gradient(180deg, #2c4a7e 0%, #27426f 50%, #1d3157 100%); }
  .denim::after { content: ""; position: absolute; inset: 0; opacity: .75; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='d'><feTurbulence type='fractalNoise' baseFrequency='.012 .9' numOctaves='3' seed='6'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.5 -.4'/></filter><rect width='100%' height='100%' filter='url(%23d)'/></svg>"); }
  svg.stage { position: absolute; inset: 0; }

  .top { position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .top .btn-circle { background: rgba(10,18,40,.4); backdrop-filter: blur(12px); border: .5px solid rgba(255,255,255,.14); }
  .title { text-align: center; }
  .title .e { font: 700 10px/1 var(--f-ui); letter-spacing: 2.4px; text-transform: uppercase; color: rgba(255,226,170,.8); }
  .title .t { font: 400 24px/1 var(--f-marker); color: #fff6e6; margin-top: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.35); }

  .sheet { position: absolute; left: 12px; right: 12px; bottom: 26px; height: 104px; border-radius: 28px; padding: 16px 18px; z-index: 6;
    background: rgba(12,20,40,.62); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: .5px solid rgba(255,255,255,.14);
    box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .sheet .row { display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 { font: 700 17px/1.1 var(--f-tight); color: #fff; letter-spacing: -.2px; }
  .sheet p { font: 500 13px/1.3 var(--f-ui); color: rgba(255,255,255,.62); margin-top: 3px; }
  .sheet .btn { height: 36px; padding: 0 14px; border-radius: 18px; background: #f2b33d; color: #1a1206; font: 700 13px/36px var(--f-ui); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .bars { display: flex; gap: 6px; margin-top: 14px; }
  .bars div { flex: 1; }
  .bars i { display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
  .bars i b { display: block; height: 100%; background: #f2b33d; border-radius: 2px; }
  .bars span { display: block; font: 600 10px/1 var(--f-ui); color: rgba(255,255,255,.55); margin-top: 6px; letter-spacing: .3px; white-space: nowrap; }
  .bars span em { font-style: normal; color: #fff; }
</style></head>
<body class="phone">
<div class="denim"></div>
<svg class="stage" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <pattern id="satin" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(62)">
      <rect width="1.1" height="2.4" fill="rgba(255,255,255,.22)"/><rect x="1.1" width="1.3" height="2.4" fill="rgba(0,0,0,.12)"/>
    </pattern>
    <pattern id="satin2" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="1.1" height="2.4" fill="rgba(255,255,255,.2)"/><rect x="1.1" width="1.3" height="2.4" fill="rgba(0,0,0,.12)"/>
    </pattern>
    <pattern id="twill" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.4" height="3" fill="rgba(255,255,255,.1)"/>
    </pattern>
    <radialGradient id="light" cx="30%" cy="22%" r="85%">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation=".6" flood-color="#000" flood-opacity=".45"/>
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#030a1c" flood-opacity=".55"/>
    </filter>
    <filter id="thread" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="1" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"/>
      <feDropShadow dx="0" dy=".8" stdDeviation=".4" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="fuzz" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
      <feDropShadow dx="0" dy="1.6" stdDeviation=".8" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <path id="arc-wrig" d="M-52,0 a52,52 0 0,1 104,0"/>
    <path id="arc-wrig-b" d="M-58,0 a58,58 0 0,0 116,0"/>
    <path id="arc-bvb" d="M-30,0 a30,30 0 0,1 60,0"/>
    <path id="arc-fen" d="M-24,0 a24,24 0 0,1 48,0"/>
    <clipPath id="cp-shield"><path d="M-52 -64h104v58c0 36-26 58-52 70-26-12-52-34-52-70z"/></clipPath>
  </defs>

  <!-- yoke seam + topstitching -->
  <path d="M-10 140 C 100 168, 293 168, 403 140" stroke="rgba(5,12,30,.45)" stroke-width="10" fill="none"/>
  <path d="M-10 136 C 100 164, 293 164, 403 136" stroke="rgba(160,190,230,.18)" stroke-width="2" fill="none"/>
  <path d="M-10 130 C 100 158, 293 158, 403 130" stroke="#d99a3c" stroke-width="1.3" stroke-dasharray="4 2.4" fill="none"/>
  <path d="M-10 147 C 100 175, 293 175, 403 147" stroke="#d99a3c" stroke-width="1.3" stroke-dasharray="4 2.4" fill="none"/>
  <!-- side panel seams -->
  <path d="M30 170 C 26 420, 40 640, 34 852" stroke="rgba(5,12,30,.4)" stroke-width="8" fill="none"/>
  <path d="M38 170 C 34 420, 48 640, 42 852" stroke="#d99a3c" stroke-width="1.2" stroke-dasharray="4 2.4" fill="none"/>
  <path d="M363 170 C 367 420, 353 640, 359 852" stroke="rgba(5,12,30,.4)" stroke-width="8" fill="none"/>
  <path d="M355 170 C 359 420, 345 640, 351 852" stroke="#d99a3c" stroke-width="1.2" stroke-dasharray="4 2.4" fill="none"/>

  <!-- ghost of a removed / not-yet patch -->
  <g transform="translate(190,664) rotate(-4)">
    <rect x="-54" y="-30" width="108" height="60" rx="10" fill="rgba(8,20,48,.35)"/>
    <rect x="-54" y="-30" width="108" height="60" rx="10" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="1.2 3.2"/>
    <text y="-3" text-anchor="middle" font-family="Inter" font-weight="700" font-size="8" letter-spacing="2" fill="rgba(255,255,255,.5)">NEXT PATCH</text>
    <text y="14" text-anchor="middle" font-family="Permanent Marker" font-size="14" fill="rgba(255,255,255,.62)">Oracle Park?</text>
  </g>

  <!-- 1. WRIGLEY round, hero -->
  <g transform="translate(130,270) rotate(-6)" filter="url(#raise)">
    <circle r="82" fill="#0e3386"/>
    <circle r="82" fill="url(#satin)"/>
    <circle r="77" fill="none" stroke="#f3eee2" stroke-width="10"/>
    <circle r="77" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="10" stroke-dasharray=".9 1.5"/>
    <circle r="71.5" fill="none" stroke="#cc3433" stroke-width="2.4"/>
    <circle r="82.5" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
    <g filter="url(#thread)">
      <text font-family="Archivo Black" font-size="15" letter-spacing="2.6" fill="#f3eee2"><textPath href="#arc-wrig" startOffset="50%" text-anchor="middle">WRIGLEY</textPath></text>
      <text font-family="Archivo Black" font-size="9.5" letter-spacing="3" fill="#f3eee2" transform="translate(0,9)"><textPath href="#arc-wrig-b" startOffset="50%" text-anchor="middle">CHICAGO · 1914</textPath></text>
      <!-- marquee -->
      <path d="M-34 -24h68l-4 20h-60z" fill="#cc3433"/>
      <path d="M-34 -24h68l-4 20h-60z" fill="url(#satin2)"/>
      <path d="M-26 -14h52" stroke="#f3eee2" stroke-width="2.4" stroke-dasharray="5 3"/>
      <rect x="-22" y="-4" width="5" height="22" fill="#cc3433"/><rect x="17" y="-4" width="5" height="22" fill="#cc3433"/>
      <rect x="-1" y="-32" width="2" height="8" fill="#f3eee2"/><circle cy="-33" r="2.4" fill="#f3eee2"/>
    </g>
    <text y="46" text-anchor="middle" font-family="Anton" font-size="30" fill="#f2b33d" filter="url(#fuzz)">17</text>
    <circle r="82" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- 2. LAMBEAU shield -->
  <g transform="translate(298,252) rotate(9)" filter="url(#raise)">
    <path d="M-52 -64h104v58c0 36-26 58-52 70-26-12-52-34-52-70z" fill="#f3eee2"/>
    <path d="M-46 -58h92v52c0 32-23 52-46 63-23-11-46-31-46-63z" fill="#203731"/>
    <path d="M-46 -58h92v52c0 32-23 52-46 63-23-11-46-31-46-63z" fill="url(#satin2)"/>
    <path d="M-52 -64h104v58c0 36-26 58-52 70-26-12-52-34-52-70z" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray=".9 1.4" transform="scale(.97)"/>
    <g filter="url(#thread)">
      <text y="-38" text-anchor="middle" font-family="Archivo Black" font-size="10" letter-spacing="2" fill="#ffb612">LAMBEAU</text>
      <!-- snowflake -->
      <g stroke="#f3eee2" stroke-width="2.4" stroke-linecap="round" transform="translate(0,-14)">
        <path d="M0 -13v26M-11 -6.5l22 13M-11 6.5l22-13"/>
        <path d="M-4 -10l4 3 4-3M-4 10l4-3 4 3" stroke-width="1.6" fill="none"/>
      </g>
      <text y="17" text-anchor="middle" font-family="Anton" font-size="21" fill="#ffb612">24–22</text>
      <text y="32" text-anchor="middle" font-family="Archivo Black" font-size="7" letter-spacing="1.4" fill="#f3eee2">JAN ’25</text>
    </g>
    <path d="M-52 -64h104v58c0 36-26 58-52 70-26-12-52-34-52-70z" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- 3. CAMP NOU: rounded rectangle, striped -->
  <g transform="translate(284,428) rotate(-7)" filter="url(#raise)">
    <rect x="-66" y="-38" width="132" height="76" rx="12" fill="#f3d36b"/>
    <clipPath id="cp-nou"><rect x="-60" y="-32" width="120" height="64" rx="8"/></clipPath>
    <g clip-path="url(#cp-nou)">
      <rect x="-60" y="-32" width="120" height="64" fill="#004d98"/>
      <rect x="-36" y="-32" width="18" height="64" fill="#a50044"/><rect x="0" y="-32" width="18" height="64" fill="#a50044"/><rect x="36" y="-32" width="18" height="64" fill="#a50044"/>
      <rect x="-60" y="-32" width="120" height="64" fill="url(#satin)"/>
      <rect x="-60" y="-11" width="120" height="26" fill="#0b1630" opacity=".88"/>
    </g>
    <rect x="-66" y="-38" width="132" height="76" rx="12" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="5" stroke-dasharray=".9 1.4" transform="scale(.97)"/>
    <g filter="url(#thread)">
      <text y="9" text-anchor="middle" font-family="Archivo Black" font-size="15" letter-spacing="1.5" fill="#f3d36b">CAMP NOU</text>
      <text y="-17" text-anchor="middle" font-family="Archivo Black" font-size="7.5" letter-spacing="2.4" fill="#fff">BARCELONA</text>
      <text y="28" text-anchor="middle" font-family="Archivo Black" font-size="7.5" letter-spacing="2.4" fill="#fff">22 · II · 2020</text>
    </g>
    <rect x="-66" y="-38" width="132" height="76" rx="12" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- 4. COTA: pennant -->
  <g transform="translate(110,448) rotate(-10)" filter="url(#raise)">
    <path d="M-62 -34L74 0L-62 34z" fill="#f3eee2"/>
    <path d="M-56 -26L58 0L-56 26z" fill="#141414"/>
    <clipPath id="cp-pen"><path d="M-56 -26L58 0L-56 26z"/></clipPath>
    <g clip-path="url(#cp-pen)" id="checks"></g>
    <path d="M-56 -26L58 0L-56 26z" fill="url(#satin)"/>
    <path d="M-62 -34L74 0L-62 34z" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="5" stroke-dasharray=".9 1.4" transform="scale(.97)"/>
    <g filter="url(#thread)">
      <rect x="-50" y="-9" width="84" height="18" rx="2" fill="#e10600"/>
      <text x="-8" y="5" text-anchor="middle" font-family="Archivo Black" font-size="10.5" letter-spacing="1.6" fill="#fff">AUSTIN ’21</text>
    </g>
    <path d="M-62 -34L74 0L-62 34z" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- 5. FENWAY small round -->
  <g transform="translate(80,620) rotate(8)" filter="url(#raise)">
    <circle r="40" fill="#f3eee2"/>
    <circle r="34" fill="#0f5c3a"/><circle r="34" fill="url(#satin2)"/>
    <circle r="37" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="5" stroke-dasharray=".9 1.4"/>
    <g filter="url(#thread)">
      <text font-family="Archivo Black" font-size="8" letter-spacing="1.2" fill="#f3eee2"><textPath href="#arc-fen" startOffset="50%" text-anchor="middle">FENWAY</textPath></text>
      <rect x="-20" y="-2" width="40" height="14" fill="#1c7a4c"/><path d="M-20 4h40" stroke="#f3eee2" stroke-width="1.2" stroke-dasharray="2 2"/>
      <text y="26" text-anchor="middle" font-family="Archivo Black" font-size="8" letter-spacing="1" fill="#f3eee2">’19</text>
    </g>
    <circle r="40" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- 6. DORTMUND round yellow -->
  <g transform="translate(300,610) rotate(-12)" filter="url(#raise)">
    <circle r="48" fill="#141414"/>
    <circle r="41" fill="#fde100"/><circle r="41" fill="url(#satin)"/>
    <circle r="44.5" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="6" stroke-dasharray=".9 1.4"/>
    <g filter="url(#thread)">
      <text font-family="Archivo Black" font-size="8.5" letter-spacing="1.2" fill="#141414"><textPath href="#arc-bvb" startOffset="50%" text-anchor="middle">DORTMUND</textPath></text>
      <text y="18" text-anchor="middle" font-family="Anton" font-size="25" fill="#141414">4:4</text>
      <text y="29" text-anchor="middle" font-family="Archivo Black" font-size="6.5" letter-spacing="1.4" fill="#141414">NOV 2017</text>
    </g>
    <circle r="48" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- 7. UNITED CENTER hex (partially under sheet? no, above) -->
  <g transform="translate(186,548) rotate(6)" filter="url(#raise)">
    <path d="M0 -42l38 21v42l-38 21-38-21v-42z" fill="#f3eee2"/>
    <path d="M0 -36l32 18v36l-32 18-32-18v-36z" fill="#c8102e"/><path d="M0 -36l32 18v36l-32 18-32-18v-36z" fill="url(#satin2)"/>
    <g filter="url(#thread)">
      <text y="-13" text-anchor="middle" font-family="Archivo Black" font-size="9" letter-spacing="1.4" fill="#f3eee2">CHI</text>
      <path d="M-10 -4h20l-3 12h-14z M-6 8h12v4h-12z" fill="#f2b33d"/>
      <text y="24" text-anchor="middle" font-family="Archivo Black" font-size="7.5" letter-spacing="1" fill="#f3eee2">2015</text>
    </g>
    <path d="M0 -42l38 21v42l-38 21-38-21v-42z" fill="url(#light)" style="mix-blend-mode:soft-light"/>
  </g>
</svg>

<div class="top">
  <div class="btn-circle"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="title"><div class="e">Sam’s jacket</div><div class="t">21 venues stitched</div></div>
  <div class="btn-circle"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
</div>

<div class="sheet">
  <div class="row">
    <div><h3>14 of 30 MLB parks</h3><p>Newest patch · Coors Field, Aug ’24</p></div>
    <div class="btn">Rearrange</div>
  </div>
  <div class="bars">
    <div><i><b style="width:47%"></b></i><span><em>14</em>/30 MLB</span></div>
    <div><i><b style="width:7%"></b></i><span><em>2</em>/30 NFL</span></div>
    <div><i><b style="width:4%"></b></i><span><em>2</em> NBA·NHL</span></div>
    <div><i><b style="width:60%"></b></i><span><em>4</em> Soccer</span></div>
  </div>
</div>
<script>
  const NS = 'http://www.w3.org/2000/svg', ch = document.getElementById('checks');
  for (let x = -56; x < 60; x += 8) for (let y = -28; y < 28; y += 8) if (((x + y) / 8) % 2 === 0) {
    const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', 8); r.setAttribute('height', 8); r.setAttribute('fill', '#f3eee2'); ch.appendChild(r);
  }
</script>
<script src="../../kit/kit.js"></script>
</body></html>
