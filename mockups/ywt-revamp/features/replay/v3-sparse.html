<!doctype html>
<html><head><meta charset="utf-8"><title>Replay Sparse</title>
<link rel="stylesheet" href="../../../kit/kit.css">
<style>
body.phone{background:#050506;font-family:var(--f-ui)}
.ph-full{position:absolute;inset:0;overflow:hidden;background:#0a0a0c}
.ph-full img{position:absolute;display:block;max-width:none}
.scrim-t{position:absolute;left:0;right:0;top:0;height:210px;background:linear-gradient(180deg,rgba(5,5,6,.92) 0%,rgba(5,5,6,.8) 45%,rgba(5,5,6,0) 100%)}
.scrim-b{position:absolute;left:0;right:0;bottom:0;height:580px;background:linear-gradient(180deg,rgba(5,5,6,0) 0%,rgba(5,5,6,.55) 38%,rgba(5,5,6,.9) 72%,#050506 100%)}
.segs{position:absolute;top:58px;left:16px;right:16px;height:3px;display:flex;gap:3px;z-index:20}
.segs i{flex:1;border-radius:2px;background:rgba(255,255,255,.28);position:relative;overflow:hidden}
.segs i.d{background:#fff}
.segs i.on{background:rgba(255,255,255,.28)}
.segs i.on b{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.seglab{position:absolute;top:68px;z-index:20;font:700 9.5px/1 var(--f-ui);letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap}
.seglab em{font-style:normal;color:rgba(255,255,255,.6)}
.hdr{position:absolute;top:90px;left:16px;right:16px;height:44px;z-index:20;display:flex;align-items:center;justify-content:space-between}
.ibtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(18,18,21,.55);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:.5px solid rgba(255,255,255,.16)}
.ibtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bug{height:44px;border-radius:22px;background:rgba(10,10,12,.72);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:.5px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:0 6px;gap:0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.bug .tm{display:flex;align-items:center;gap:7px;width:84px}
.bug .tm.r{flex-direction:row-reverse}
.bug .tile{width:30px;height:30px;border-radius:9px;font-size:13px;letter-spacing:.2px;flex:none}
.bug .n{font:800 30px/1 var(--f-cond);font-variant-numeric:tabular-nums;color:#fff;width:24px;text-align:center}
.bug .clk{width:74px;text-align:center;border-left:.5px solid rgba(255,255,255,.16);border-right:.5px solid rgba(255,255,255,.16);height:30px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bug .clk b{font:800 18px/1 var(--f-cond);color:#fff;letter-spacing:.3px}
.bug .clk s{text-decoration:none;font:700 7.5px/1 var(--f-ui);letter-spacing:1.3px;color:var(--text-3);text-transform:uppercase}
.chip{position:absolute;left:16px;height:26px;border-radius:13px;display:flex;align-items:center;gap:7px;padding:0 11px 0 9px;background:rgba(255,181,71,.17);border:1px solid rgba(255,181,71,.55);color:var(--signal);font:700 11.5px/1 var(--f-ui);letter-spacing:.1px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:3px;background:var(--signal);box-shadow:0 0 0 3px rgba(255,181,71,.28)}
.chip-r{position:absolute;right:16px;font:500 12.5px/1 var(--f-ui);color:var(--text-2);z-index:20;white-space:nowrap}
.big{position:absolute;left:12px;font:800 108px/.8 var(--f-cond);letter-spacing:-1px;color:#fff;z-index:20;font-variant-numeric:tabular-nums}
.col{position:absolute;z-index:20}
.eb{font:700 11px/1 var(--f-ui);letter-spacing:1.9px;text-transform:uppercase;color:var(--text-2);display:flex;align-items:center;gap:7px}
.play{font:800 34px/1 var(--f-tight);letter-spacing:-.8px;color:#fff;margin-top:9px}
.sub{font:500 14px/1.3 var(--f-ui);color:var(--text-2);margin-top:7px}
.story{position:absolute;left:16px;right:16px;z-index:20;font:500 14.5px/1.35 var(--f-ui);color:rgba(245,241,234,.78)}
.story b{color:#fff;font-weight:600}
.dock{position:absolute;left:12px;right:12px;height:104px;border-radius:24px;z-index:20;background:rgba(14,14,17,.74);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:.5px solid rgba(255,255,255,.16)}
.dock .pp{position:absolute;left:12px;top:10px;width:32px;height:32px;border-radius:16px;background:#fff;display:grid;place-items:center}
.dock .pp svg{width:14px;height:14px;fill:#0a0a0c}
.dock .t1{position:absolute;left:54px;top:12px;font:800 20px/1 var(--f-cond);letter-spacing:.3px;color:#fff;display:flex;align-items:baseline;gap:8px}
.dock .t1 span{font:500 12px/1 var(--f-ui);color:var(--text-2);letter-spacing:0}
.scrub{position:absolute;right:12px;top:12px;height:28px;border-radius:14px;padding:0 11px 0 9px;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,181,71,.55);background:rgba(255,181,71,.12);color:var(--signal);font:700 10px/1 var(--f-ui);letter-spacing:1.5px}
.scrub svg{width:12px;height:12px;stroke:var(--signal);stroke-width:2;fill:none;stroke-linecap:round}
.tl{position:absolute;left:14px;right:14px;top:48px;height:36px}
.tl .tk{position:absolute;bottom:12px;width:1.5px;border-radius:1px;background:rgba(255,255,255,.62)}
.tl .tk.f{background:rgba(255,255,255,.3)}
.tl .base{position:absolute;left:0;right:0;bottom:11px;height:1px;background:rgba(255,255,255,.22)}
.tl .band{position:absolute;bottom:3px;height:5px;border-radius:2.5px;background:rgba(255,255,255,.2)}
.tl .band.g{background:rgba(255,255,255,.5)}
.tl .goal{position:absolute;bottom:0;width:8px;height:8px;border-radius:4px;border:1.5px solid #fff;transform:translateX(-4px);bottom:1.5px}
.tl .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--signal);border-radius:1px;transform:translateX(-1px);box-shadow:0 0 10px rgba(255,181,71,.7)}
.tl .ph u{position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:6px;background:var(--signal);border:2px solid #0e0e11;box-sizing:border-box;box-shadow:0 0 0 1.5px var(--signal)}
.axl{position:absolute;left:14px;right:14px;top:87px;height:10px;font:600 8.5px/1 var(--f-ui);letter-spacing:.6px;color:var(--text-3);text-transform:uppercase}
.axl span{position:absolute;white-space:nowrap}
</style></head>
<body class="phone">

<div class="ph-full"><img src="../../../photos/soldier-skyline.jpg" style="width:1080px;left:-380px;top:-30px;filter:contrast(1.06) saturate(.95) brightness(.92)"></div>
<div class="scrim-t"></div><div class="scrim-b" style="height:520px"></div>
<div class="segs"><i class="on"><b style="width:50%"></b></i><i></i><i></i></div>
<div class="seglab" style="left:16.0px">Arrival</div>
<div class="hdr"><div class="ibtn"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
<div class="bug"><div class="tm"><span class="mono-badge tile" style="background:#1F8A4C;color:#fff">ROC</span><span class="n">2</span></div>
<div class="clk"><b>FT</b><s>Final</s></div>
<div class="tm r"><span class="mono-badge tile" style="background:#C4372E;color:#fff">PEO</span><span class="n">2</span></div></div>
<div class="ibtn"><svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 11v8a2 2 0 002 2h10a2 2 0 002-2v-8"/></svg></div></div>
<div class="chip" style="top:512px"><i></i>You were here &middot; 5:52 PM</div>
<div class="chip-r" style="top:518px">38 min before kickoff</div>
<div class="big" style="top:556px;font-size:100px;left:14px">&minus;38&prime;</div>
<div class="col" style="left:190px;top:552px;width:187px">
 <div class="eb"><span style="color:#fff">Arrival</span></div>
 <div class="play" style="font-size:30px">Gates open</div>
 <div class="sub">Kickoff was at 6:30 PM</div>
</div>
<div class="story" style="top:646px">No play data for this match, so Witness keeps the clock and your photos. <b style="color:var(--signal)">Add a note</b></div>

<div class="dock" style="top:702px">
 <div class="pp"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.6" height="12" rx="1.2"/><rect x="8.4" y="1" width="3.6" height="12" rx="1.2"/></svg></div>
 <div class="t1">5:52 PM<span>Before kickoff</span></div>
 <div class="scrub"><svg viewBox="0 0 12 12"><path d="M2 3.5h8M2 8.5h8"/></svg>SCRUB</div>
 <div class="tl" style="top:50px">
  <div class="base" style="bottom:9px"></div>
  <i class="band" style="left:95.1px;width:182.4px;bottom:7px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px)"></i>
  <div style="position:absolute;left:17.9px;top:-4px;width:34px;height:34px;border-radius:10px;border:2px solid #ffb547;box-shadow:0 0 12px rgba(255,181,71,.55);background:url(../../../photos/soldier-skyline.jpg) 50% 50%/cover;overflow:hidden"></div>
  <div style="position:absolute;left:285.9px;top:-4px;width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.55);background:url(../../../photos/soldier-soccer.jpg) 50% 80%/cover;overflow:hidden"></div>
 </div>
 <div class="axl" style="top:90px"><span style="left:91.1px">KO 6:30</span><span style="left:273.5px">FT 8:25</span><span style="left:0">5:30 PM</span></div>
</div>

<script src="../../../kit/kit.js"></script>
</body></html>
