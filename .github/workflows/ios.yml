name: iOS build & test

on:
  push:
    branches: [claude/witness-mockups-phase1]
    paths: ['Witness/**', 'WitnessTests/**', 'WitnessUITests/**', 'project.yml', 'ci/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          ls /Applications | grep Xcode || true
          LATEST=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -3

      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Prepare simulator (photos, permissions, location)
        run: bash ci/sim_setup.sh

      - name: Build and test
        id: test
        run: |
          mkdir -p build
          set +e
          xcodebuild test \
            -project Witness.xcodeproj -scheme Witness \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath build/Results.xcresult \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1
          STATUS=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " build/xcodebuild.log | tail -150
          exit $STATUS

      - name: Collect results
        if: always()
        run: bash ci/collect.sh

      - name: Publish results to ci-results branch
        if: always()
        run: bash ci/publish.sh
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_OUTCOME: ${{ steps.test.outcome }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: out
